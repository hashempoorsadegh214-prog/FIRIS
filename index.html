<style>

/* ============================================================
   FONT
   ============================================================ */

@font-face {

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ============================================================
   GLOBAL DATA
   ============================================================ */

"use strict";


let map = null;

let farsLayer = null;

let fliLayer = null;

let protectedLayer = null;

let huntingLayer = null;

let fliGrid = null;

let fliMetadata = null;

let fwiAvailable = false;


/* ============================================================
   MAP
   ============================================================ */

map = L.map(
  "map",
  {
    zoomControl: true,
    preferCanvas: true
  }
);


const osm =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 18,
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(
    map
  );


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  text,
  ok = true
) {

  const element =
    document.getElementById(
      "status"
    );

  element.textContent =
    text;

  element.className =
    ok
      ? "status-bar status-ok"
      : "status-bar status-error";
}


/* ============================================================
   FORMAT
   ============================================================ */

function formatNumber(
  value
) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    return "—";
  }

  return number.toLocaleString(
    "fa-IR",
    {
      maximumFractionDigits:
        2
    }
  );
}


/* ============================================================
   RISK
   ============================================================ */

function getRisk(
  value
) {

  value =
    Number(value);

  if (
    !Number.isFinite(value)
  ) {

    return {
      label:
        "بدون داده",

      color:
        "#777"
    };
  }


  if (value < 20) {

    return {
      label:
        "کم",

      color:
        "#2e7d32"
    };
  }


  if (value < 40) {

    return {
      label:
        "متوسط",

      color:
        "#c7a900"
    };
  }


  if (value < 60) {

    return {
      label:
        "زیاد",

      color:
        "#fb8c00"
    };
  }


  if (value < 80) {

    return {
      label:
        "خیلی زیاد",

      color:
        "#e53935"
    };
  }


  return {

    label:
      "بحرانی",

    color:
      "#880e4f"
  };
}


/* ============================================================
   GAUGE
   ============================================================ */

function updateGauge(
  value,
  title,
  subtitle
) {

  const valueEl =
    document.getElementById(
      "gaugeValue"
    );

  const labelEl =
    document.getElementById(
      "gaugeLabel"
    );

  const locationEl =
    document.getElementById(
      "gaugeLocation"
    );


  if (
    !Number.isFinite(
      Number(value)
    )
  ) {

    valueEl.textContent =
      "—";

    labelEl.textContent =
      "بدون داده";

    labelEl.style.color =
      "#777";

    locationEl.textContent =
      subtitle || "—";

    return;
  }


  const number =
    Number(value);

  const risk =
    getRisk(number);


  valueEl.textContent =
    formatNumber(number);

  labelEl.textContent =
    risk.label;

  labelEl.style.color =
    risk.color;

  locationEl.textContent =
    `${title || ""}${subtitle ? " | " + subtitle : ""}`;
}

/* ============================================================
   REGION NAME
   ============================================================ */

function getRegionName(
  properties,
  fallback
) {

    properties || {};


  return (

    properties.name
    ||
    properties.NAME

    properties.Name

    ||
    properties.ShapeName
    ||
    properties.NAME_1
    ||

  );

/* ============================================================
   REGION MEAN FROM GRID
   ============================================================ */

function regionMean(
  feature
) {

  if (
    !fliGrid
    ||
    !Array.isArray(
      fliGrid.values
    )
    ||
    !fliGrid.bounds
  ) {

    return null;
  }


  const bounds =
    fliGrid.bounds;


  const south =
    Number(
      bounds[0][0]
    );

  const west =
    Number(
      bounds[0][1]
    );

  const north =
    Number(
      bounds[1][0]
    );

  const east =
    Number(
      bounds[1][1]
    );


  const rows =
    Number(
      fliGrid.rows
    );

  const cols =
    Number(
      fliGrid.cols
    );


  if (
    rows <= 0
    ||
    cols <= 0
  ) {

    return null;
  }


  let sum =
    0;

  let count =
    0;


  for (
    let row = 0;
    row < rows;
    row++
  ) {

    const lat =
      north
      -
      (
        (row + .5)
        /
        rows
      )
      *
      (
        north - south
      );


    for (
      let col = 0;
      col < cols;
      col++
    ) {

      const rawValue =
        fliGrid
          .values?.[row]?.[col];


      const value =
        Number(
          rawValue
        );


      if (
        !Number.isFinite(value)
        ||
        value < 0
        ||
        value > 100
      ) {

        continue;
      }


      const lon =
        west
        +
        (
          (col + .5)
          /
          cols
        )
        *
        (
          east - west
        );


      try {

        const point =
          turf.point([
            lon,
            lat
          ]);


        if (
          turf.booleanPointInPolygon(
            point,
            feature
          )
        ) {

          sum +=
            value;

          count++;
        }

      } catch (
        error
      ) {

        console.warn(
          "Region mean error:",
          error
        );
      }
    }
  }


  if (
    count === 0
  ) {

    return null;
  }


  return (
    sum / count
  );
}


/* ============================================================
   REGION POPUP
   ============================================================ */

function bindRegion(
  feature,
  layer,
  type
) {

  const properties =
    feature.properties || {};


  const fixedType =
    type === "protected"
      ? "مناطق چهارگانه محیط زیست"
      : "مناطق شکار ممنوع";


  const fallbackName =
    type === "protected"
      ? "منطقه چهارگانه"
      : "منطقه شکار ممنوع";


  const name =
    getRegionName(
      properties,
      fallbackName
    );


  const mean =
    regionMean(
      feature
    );


  const risk =
    getRisk(
      mean
    );


  const popup = `

    <div class="region-popup">

      <div class="region-title">
        ${name}
      </div>

      <div class="region-type">
        ${fixedType}
      </div>

      <div
        class="region-value"
        style="color:${risk.color}"
      >
        میانگین FLI:
        ${formatNumber(mean)}
      </div>

      <div
        class="region-risk"
        style="background:${risk.color}"
      >
        ${risk.label}
      </div>

    </div>

  `;


  layer.bindPopup(
    popup,
    {
      maxWidth:
        300
    }
  );


  layer.on(
    "click",
    function() {

      updateGauge(
        mean,
        name,
        fixedType
      );

    }
  );
}

/* ============================================================
   LOAD FLI METADATA
   ============================================================ */

async function loadFLIData() {

  const response =
    await fetch(
      "data/web/fli_latest.json",
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `متادیتای FLI: HTTP ${response.status}`
    );
  }


  fliMetadata =
    await response.json();


  const statistics =
    fliMetadata.statistics
    ||
    {};


  /*
   * IMPORTANT:
   * forecast_date is the forecast target date.
   * generated_at_utc is NOT used as the forecast date.
   */

  const forecastDate =
    fliMetadata.forecast_date
    ||
    fliMetadata.target_date;


  if (
    forecastDate
  ) {

    const date =
      new Date(
        `${forecastDate}T12:00:00`
      );


    const shamsi =
      date.toLocaleDateString(
        "fa-IR-u-ca-persian",
        {
          year:
            "numeric",

          month:
            "long",

          day:
            "numeric"
        }
      );


    document.getElementById(
      "forecastText"
    ).textContent =
      `پیش‌بینی خطر حریق برای ${shamsi}`;


    return;
  }


  /*
   * No forecast date:
   * do NOT silently use generated_at_utc.
   */

  document.getElementById(
    "forecastText"
  ).textContent =
    "تاریخ پیش‌بینی در دسترس نیست";
}

/* ============================================================
   POINT TO GRID
   ============================================================ */

function getPointValue(
  lat,
  lon
) {

  if (
    !fliGrid
    ||
    !fliGrid.bounds
    ||
    !Array.isArray(
      fliGrid.values
    )
  ) {

    return null;
  }


  const bounds =
    fliGrid.bounds;


  const south =
    Number(
      bounds[0][0]
    );

  const west =
    Number(
      bounds[0][1]
    );

  const north =
    Number(
      bounds[1][0]
    );

  const east =
    Number(
      bounds[1][1]
    );


  if (
    lat < south
    ||
    lat > north
    ||
    lon < west
    ||
    lon > east
  ) {

    return null;
  }


  const rows =
    Number(
      fliGrid.rows
    );

  const cols =
    Number(
      fliGrid.cols
    );


  if (
    rows <= 0
    ||
    cols <= 0
  ) {

    return null;
  }


  let row =
    Math.floor(
      (
        (north - lat)
        /
        (north - south)
      )
      *
      rows
    );


  let col =
    Math.floor(
      (
        (lon - west)
        /
        (east - west)
      )
      *
      cols
    );


  row =
    Math.max(
      0,
      Math.min(
        rows - 1,
        row
      )
    );


  col =
    Math.max(
      0,
      Math.min(
        cols - 1,
        col
      )
    );


  const value =
    Number(
      fliGrid
        .values?.[row]?.[col]
    );


  if (
    !Number.isFinite(value)
    ||
    value < 0
    ||
    value > 100
  ) {

    return null;
  }


  return value;
}


/* ============================================================
   MAP CLICK
   ============================================================ */

map.on(
  "click",
  function(event) {

    const lat =
      event.latlng.lat;

    const lon =
      event.latlng.lng;


    /*
     * First make sure click is inside Fars.
     * This prevents values being shown outside
     * the province boundary.
     */

    if (
      farsLayer
      &&
      farsLayer.getLayers().length
    ) {

      const point =
        turf.point([
          lon,
          lat
        ]);


      let insideFars =
        false;


      for (
        const layer
        of farsLayer.getLayers()
      ) {

        const feature =
          layer.toGeoJSON();


        if (
          turf.booleanPointInPolygon(
            point,
            feature
          )
        ) {

          insideFars =
            true;

          break;
        }
      }


      if (
        !insideFars
      ) {

        return;
      }
    }


    const value =
      getPointValue(
        lat,
        lon
      );


    updateGauge(
      value,
      "استان فارس",
      `${lat.toFixed(4)}° ، ${lon.toFixed(4)}°`
    );


    if (
      !Number.isFinite(value)
    ) {

      return;
    }


    const risk =
      getRisk(
        value
      );


    const popup = `

      <div class="fli-popup">

        <div class="fli-popup-title">
          شاخص خطر حریق
        </div>

        <div
          class="fli-popup-value"
          style="color:${risk.color}"
        >
          ${formatNumber(value)}
        </div>

        <div
          class="fli-popup-risk"
          style="background:${risk.color}"
        >
          ${risk.label}
        </div>

        <div class="fli-popup-row">
          استان فارس
        </div>

        <div class="fli-popup-row">
          عرض جغرافیایی:
          ${lat.toFixed(5)}
        </div>

        <div class="fli-popup-row">
          طول جغرافیایی:
          ${lon.toFixed(5)}
        </div>

      </div>

    `;


    L.popup(
      {
        maxWidth:
          280
      }
    )
    .setLatLng(
      event.latlng
    )
    .setContent(
      popup
    )
    .openOn(
      map
    );

  }
);


/* ============================================================
   LAYER VISIBILITY
   ============================================================ */

function setLayerVisible(
  layer,
  visible
) {

  if (!layer) {
    return;
  }


  if (
    visible
  ) {

    if (
      !map.hasLayer(
        layer
      )
    ) {

      layer.addTo(
        map
      );
    }

  } else {

    if (
      map.hasLayer(
        layer
      )
    ) {

      map.removeLayer(
        layer
      );
    }
  }
}


/* ============================================================
   LAYER DROPDOWN
   ============================================================ */

document.getElementById(
  "layerSelect"
).addEventListener(
  "change",
  function(event) {

    const value =
      event.target.value;


    /*
     * FLI
     */

    if (
      value === "fli"
    ) {

      setLayerVisible(
        fliLayer,
        true
      );

      setLayerVisible(
        protectedLayer,
        false
      );

      setLayerVisible(
        huntingLayer,
        false
      );

      return;
    }


    /*
     * FWI
     *
     * There is currently no web FWI layer file
     * in data/web, so keep FLI visible and inform user.
     */

    if (
      value === "fwi"
    ) {

      setLayerVisible(
        fliLayer,
        false
      );

      setLayerVisible(
        protectedLayer,
        false
      );

      setLayerVisible(
        huntingLayer,
        false
      );

      setStatus(
        "لایه نمایشی FWI در وب هنوز تولید نشده است.",
        false
      );

      return;
    }


    /*
     * PROTECTED
     */

    if (
      value === "protected"
    ) {

      setLayerVisible(
        fliLayer,
        true
      );

      setLayerVisible(
        protectedLayer,
        true
      );

      setLayerVisible(
        huntingLayer,
        false
      );

      return;
    }


    /*
     * HUNTING
     */

    if (
      value === "hunting"
    ) {

      setLayerVisible(
        fliLayer,
        true
      );

      setLayerVisible(
        protectedLayer,
        false
      );

      setLayerVisible(
        huntingLayer,
        true
      );

      return;
    }


    /*
     * ALL
     */

    setLayerVisible(
      fliLayer,
      true
    );

    setLayerVisible(
      protectedLayer,
      true
    );

    setLayerVisible(
      huntingLayer,
      true
    );
  }
);


/* ============================================================
   FIT FARS
   ============================================================ */

function fitFars() {

  if (
    farsLayer
    &&
    farsLayer
      .getBounds()
      .isValid()
  ) {

    map.fitBounds(
      farsLayer.getBounds(),
      {
        padding:
          [35, 35],

        maxZoom:
          8
      }
    );

  } else {

    map.setView(
      [29.6, 53.0],
      7
    );
  }
}


/* ============================================================
   WORLD EXTENT
   ============================================================ */

function fitWorld() {

  map.fitBounds(
    [
      [-85, -180],
      [85, 180]
    ],
    {
      padding:
        [0, 0]
    }
  );
}

/* ============================================================
   ARCHIVE
   ============================================================ */

async function loadArchive() {

  const select =
    document.getElementById(
      "archiveSelect"
    );


  try {

    const response =
      await fetch(
        "data/archive/index.json",
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      return;
    }


    const archive =
      await response.json();


    const items =
      Array.isArray(
        archive
      )
        ? archive
        : archive.items;


    if (
      !Array.isArray(
        items
      )
    ) {

      return;
    }


    for (
      const item
      of items
    ) {

      const date =
        item.date
        ||
        item.run_date
        ||
        item.forecast_date;


      const url =
        item.url
        ||
        item.metadata
        ||
        item.link;


      if (
        !date
        ||
        !url
      ) {

        continue;
      }


      const option =
        document.createElement(
          "option"
        );


      option.value =
        url;


      option.textContent =
        `آرشیو پیش‌بینی ${date}`;


      select.appendChild(
        option
      );
    }

  } catch (
    error
  ) {

    console.info(
      "Archive unavailable."
    );
  }
}


/* ============================================================
   ARCHIVE CHANGE
   ============================================================ */

document.getElementById(
  "archiveSelect"
).addEventListener(
  "change",

    const url =
      event.target.value;


    if (
      !url
      ||
      url === "current"
    ) {

      return;
    }


    window.location.href =
      url;
  }
);


/* ============================================================
   START
   ============================================================ */

async function startFIRIS() {

  try {

    setStatus(
      "در حال بارگذاری سامانه..."
    );


    await loadFLIData();

    await loadGrid();

    await loadFars();

    await loadFLI();

    await loadProtected();

    await loadHunting();

    await loadArchive();


    /*
     * Default state
     */

    setLayerVisible(
      fliLayer,
      true
    );

    setLayerVisible(
      protectedLayer,
      false
    );

    setLayerVisible(
      huntingLayer,
      false
    );


    /*
     * Default map view
     */

    fitFars();


    /*
     * Final status
     */

    setStatus(
      "سامانه با موفقیت بارگذاری شد.",
      true
    );


    /*
     * Important Leaflet resize
     */

    setTimeout(
      function() {

        map.invalidateSize();

      },
      250
    );


  } catch (
    error
  ) {

    console.error(
      "FIRIS startup error:",
      error
    );


    setStatus(
      "خطا در بارگذاری سامانه: "
      +
      error.message,
      false
    );
  }
}


/* ============================================================
   START APP
   ============================================================ */

startFIRIS();
