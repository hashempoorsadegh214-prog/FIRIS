<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FIRIS | نقشه خطر آتش‌سوزی فارس</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQp1s4f0Y7D3f2SRQX+5pV0U6A6mLk="
    crossorigin=""
  />

  <style>
    :root {
      --primary: #9b1c1c;
      --dark: #1f2937;
      --light: #f8fafc;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--light);
      color: var(--dark);
    }

    header {
      padding: 16px 20px;
      color: #ffffff;
      background: linear-gradient(135deg, #7f1d1d, #b91c1c);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.95;
    }

    #map {
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 480px;
      background: #dbeafe;
    }

    .info-panel {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: #ffffff;
      font-size: 14px;
      line-height: 1.8;
    }

    #status {
      color: #374151;
    }

    #status.success {
      color: #166534;
    }

    #status.error {
      color: #b91c1c;
      font-weight: bold;
    }

    .legend {
      direction: rtl;
      min-width: 165px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
      font-family: Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.9;
    }

    .legend-title {
      margin-bottom: 5px;
      font-weight: bold;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .color-box {
      width: 18px;
      height: 14px;
      border: 1px solid rgba(0, 0, 0, 0.25);
    }

    .leaflet-control-layers {
      direction: rtl;
      text-align: right;
      font-family: Tahoma, Arial, sans-serif;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
      }

      #map {
        height: calc(100vh - 200px);
        min-height: 400px;
      }

      .info-panel {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>FIRIS | سامانه نقشه خطر آتش‌سوزی استان فارس</h1>
    <p>Fire Risk Index System — لایه شاخص خطر آتش‌سوزی (FLI)</p>
  </header>

  <main>
    <div id="map"></div>

    <section class="info-panel">
      <strong>وضعیت لایه:</strong>
      <span id="status">در حال دریافت داده‌های نقشه...</span>
    </section>
  </main>

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    "use strict";

    /*
      مسیرهای دقیق در مخزن FIRIS:

      index.html
      data/
        web/
          fli_latest.json
          fli_latest.png
    */
    const METADATA_URL = "data/web/fli_latest.json";
    const OVERLAY_URL = "data/web/fli_latest.png";

    const statusElement = document.getElementById("status");

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = type;
    }

    // مرکز تقریبی استان فارس تا پیش از خواندن محدودهٔ واقعی رستر
    const map = L.map("map", {
      center: [29.6, 53.5],
      zoom: 7,
      zoomControl: true
    });

    // نقشه پایه OpenStreetMap
    const osmLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 18,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    // نقشه پایه جایگزین (تصاویر ماهواره‌ای Esri)
    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 18,
        attribution: "Tiles &copy; Esri"
      }
    );

    const baseLayers = {
      "نقشه خیابانی": osmLayer,
      "تصویر ماهواره‌ای": satelliteLayer
    };

    const overlayLayers = {};

    const layerControl = L.control
      .layers(baseLayers, overlayLayers, {
        collapsed: false,
        position: "topright"
      })
      .addTo(map);

    function addLegend(legendItems) {
      const legend = L.control({ position: "bottomleft" });

      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");

        let html = '<div class="legend-title">راهنمای شاخص خطر</div>';

        if (Array.isArray(legendItems) && legendItems.length > 0) {
          legendItems.forEach((item) => {
            html += `
              <div class="legend-row">
                <span class="color-box" style="background:${item.color};"></span>
                <span>${item.label} (${item.min} تا ${item.max})</span>
              </div>
            `;
          });
        } else {
          html += `
            <div class="legend-row">
              <span class="color-box" style="background:#2e7d32;"></span>
              <span>کم: 0 تا 20</span>
            </div>
            <div class="legend-row">
              <span class="color-box" style="background:#fdd835;"></span>
              <span>متوسط: 20 تا 40</span>
            </div>
            <div class="legend-row">
              <span class="color-box" style="background:#fb8c00;"></span>
              <span>نسبتاً زیاد: 40 تا 60</span>
            </div>
            <div class="legend-row">
              <span class="color-box" style="background:#e53935;"></span>
              <span>زیاد: 60 تا 80</span>
            </div>
            <div class="legend-row">
              <span class="color-box" style="background:#880e4f;"></span>
              <span>بسیار زیاد: 80 تا 100</span>
            </div>
          `;
        }

        div.innerHTML = html;

        // جلوگیری از حرکت نقشه هنگام لمس/کلیک روی کادر راهنما
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);

        return div;
      };

      legend.addTo(map);
    }

    async function loadFirisLayer() {
      try {
        // جلوگیری از نمایش نسخهٔ کش‌شدهٔ قدیمی پس از اجرای GitHub Actions
        const cacheBust = `?v=${Date.now()}`;

        const response = await fetch(METADATA_URL + cacheBust, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `فایل اطلاعات نقشه پیدا نشد. HTTP status: ${response.status}`
          );
        }

        const metadata = await response.json();

        if (
          !metadata.bounds ||
          !Array.isArray(metadata.bounds) ||
          metadata.bounds.length !== 2
        ) {
          throw new Error("مختصات bounds در فایل fli_latest.json معتبر نیست.");
        }

        /*
          metadata.bounds باید به این شکل باشد:
          [
            [south, west],
            [north, east]
          ]
        */
        const imageUrl =
          metadata.image && typeof metadata.image === "string"
            ? `data/web/${metadata.image}?v=${Date.now()}`
            : OVERLAY_URL + cacheBust;

        const firisOverlay = L.imageOverlay(imageUrl, metadata.bounds, {
          opacity: 0.74,
          interactive: true,
          crossOrigin: true
        });

        firisOverlay.addTo(map);

        overlayLayers["شاخص خطر آتش‌سوزی FIRIS"] = firisOverlay;

        // به‌روزرسانی کنترل لایه‌ها با لایه FLI
        layerControl.addOverlay(
          firisOverlay,
          "شاخص خطر آتش‌سوزی FIRIS"
        );

        // زوم خودکار روی محدودهٔ واقعی رستر FLI
        map.fitBounds(metadata.bounds, {
          padding: [20, 20],
          maxZoom: 10
        });

        // راهنمای رنگ‌ها
        addLegend(metadata.legend);

        const generatedAt = metadata.generated_at_utc
          ? new Date(metadata.generated_at_utc).toLocaleString("fa-IR")
          : "نامشخص";

        const minValue =
          metadata.statistics && metadata.statistics.min !== undefined
            ? metadata.statistics.min
            : "-";

        const maxValue =
          metadata.statistics && metadata.statistics.max !== undefined
            ? metadata.statistics.max
            : "-";

        setStatus(
          `لایه FLI با موفقیت بارگذاری شد | کمینه: ${minValue} | بیشینه: ${maxValue} | زمان تولید: ${generatedAt}`,
          "success"
        );

        console.log("FIRIS metadata loaded:", metadata);
      } catch (error) {
        console.error("FIRIS layer loading error:", error);

        setStatus(
          "خطا در بارگذاری لایه خطر آتش‌سوزی. ابتدا بررسی کنید فایل‌های data/web/fli_latest.png و data/web/fli_latest.json در مخزن ایجاد شده باشند.",
          "error"
        );
      }
    }

    loadFirisLayer();
  </script>
</body>
</html>
