<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FIRIS | سامانه نقشه خطر آتش‌سوزی فارس</title>

  <!-- Leaflet CSS: آدرس صحیح -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --header-red-dark: #7f1d1d;
      --header-red: #b91c1c;
      --page-bg: #f8fafc;
      --text-color: #1f2937;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--page-bg);
      color: var(--text-color);
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      padding: 16px 20px;
      color: #ffffff;
      background: linear-gradient(
        135deg,
        var(--header-red-dark),
        var(--header-red)
      );
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.95;
    }

    /* ارتفاع و فضای نمایش صحیح نقشه */
    #map {
      width: 100%;
      height: calc(100vh - 177px);
      min-height: 500px;
      direction: ltr;
      background: #dbeafe;
    }

    .info-panel {
      padding: 12px 18px;
      border-top: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 14px;
      line-height: 1.8;
    }

    #status {
      color: #374151;
    }

    #status.success {
      color: #166534;
    }

    #status.error {
      color: #b91c1c;
      font-weight: bold;
    }

    /* 
      این بخش برای جلوگیری از پراکنده شدن Tileهای نقشه ضروری است.
      گاهی CSSهای عمومی سایت روی اندازهٔ تصاویر Leaflet اثر می‌گذارند.
    */
    .leaflet-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    .leaflet-container img,
    .leaflet-container .leaflet-tile {
      max-width: none !important;
      max-height: none !important;
    }

    .leaflet-pane,
    .leaflet-map-pane,
    .leaflet-tile-pane,
    .leaflet-overlay-pane {
      position: absolute;
      top: 0;
      left: 0;
    }

    .leaflet-control-layers {
      direction: rtl;
      text-align: right;
      font-family: Tahoma, Arial, sans-serif;
    }

    .legend {
      direction: rtl;
      min-width: 170px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
      color: #111827;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.9;
    }

    .legend-title {
      margin-bottom: 5px;
      font-weight: bold;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .color-box {
      width: 18px;
      height: 14px;
      border: 1px solid rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
      }

      #map {
        height: calc(100vh - 195px);
        min-height: 420px;
      }

      .info-panel {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>FIRIS | سامانه نقشه خطر آتش‌سوزی استان فارس</h1>
    <p>Fire Risk Index System — لایه شاخص خطر آتش‌سوزی (FLI)</p>
  </header>

  <main>
    <div id="map"></div>

    <section class="info-panel">
      <strong>وضعیت لایه:</strong>
      <span id="status">در حال دریافت داده‌های نقشه...</span>
    </section>
  </main>

  <!-- Leaflet JavaScript: آدرس صحیح -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    /*
      آدرس‌های دقیق GitHub Pages پروژه FIRIS
    */
    const METADATA_URL =
      "https://hashempoorsadegh214-prog.github.io/FIRIS/data/web/fli_latest.json";

    const OVERLAY_URL =
      "https://hashempoorsadegh214-prog.github.io/FIRIS/data/web/fli_latest.png";

    const statusElement = document.getElementById("status");

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = type;
    }

    /*
      نمای اولیهٔ استان فارس.
      بعد از دریافت فایل JSON، نقشه خودکار روی محدودهٔ واقعی FLI زوم می‌شود.
    */
    const map = L.map("map", {
      center: [29.6, 53.5],
      zoom: 7,
      zoomControl: true
    });

    const osmLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    );

    const layerControl = L.control.layers(
      {
        "نقشه خیابانی": osmLayer,
        "تصویر ماهواره‌ای": satelliteLayer
      },
      {},
      {
        collapsed: false,
        position: "topright"
      }
    ).addTo(map);

    function addLegend(items) {
      const legend = L.control({ position: "bottomleft" });

      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");

        let html = '<div class="legend-title">راهنمای شاخص خطر FLI</div>';

        const defaultLegend = [
          { min: 0, max: 20, label: "کم", color: "#2e7d32" },
          { min: 20, max: 40, label: "متوسط", color: "#fdd835" },
          { min: 40, max: 60, label: "نسبتاً زیاد", color: "#fb8c00" },
          { min: 60, max: 80, label: "زیاد", color: "#e53935" },
          { min: 80, max: 100, label: "بسیار زیاد", color: "#880e4f" }
        ];

        const legendItems =
          Array.isArray(items) && items.length > 0 ? items : defaultLegend;

        legendItems.forEach((item) => {
          html += `
            <div class="legend-row">
              <span class="color-box" style="background: ${item.color};"></span>
              <span>${item.label}: ${item.min} تا ${item.max}</span>
            </div>
          `;
        });

        div.innerHTML = html;

        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);

        return div;
      };

      legend.addTo(map);
    }

    async function loadFirisLayer() {
      try {
        /*
          ?v= زمان فعلی:
          برای جلوگیری از دیدن نسخهٔ کش‌شدهٔ قدیمی GitHub Pages یا مرورگر
        */
        const version = Date.now();

        const response = await fetch(`${METADATA_URL}?v=${version}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `فایل JSON یافت نشد یا قابل خواندن نیست. کد HTTP: ${response.status}`
          );
        }

        const metadata = await response.json();

        if (
          !Array.isArray(metadata.bounds) ||
          metadata.bounds.length !== 2 ||
          !Array.isArray(metadata.bounds[0]) ||
          !Array.isArray(metadata.bounds[1])
        ) {
          throw new Error(
            "مختصات bounds در فایل fli_latest.json معتبر نیست."
          );
        }

        /*
          اگر نام image در JSON موجود باشد، همان فایل خوانده می‌شود.
          در غیر این صورت از آدرس دقیق ثابت PNG استفاده می‌کنیم.
        */
        let imageUrl = `${OVERLAY_URL}?v=${version}`;

        if (typeof metadata.image === "string" && metadata.image.trim() !== "") {
          imageUrl =
            `https://hashempoorsadegh214-prog.github.io/FIRIS/data/web/` +
            `${metadata.image}?v=${version}`;
        }

        const firisOverlay = L.imageOverlay(imageUrl, metadata.bounds, {
          opacity: 0.74,
          interactive: true
        }).addTo(map);

        layerControl.addOverlay(
          firisOverlay,
          "شاخص خطر آتش‌سوزی FIRIS"
        );

        map.fitBounds(metadata.bounds, {
          padding: [20, 20],
          maxZoom: 10
        });

        addLegend(metadata.legend);

        const statistics = metadata.statistics || {};

        const minValue =
          statistics.min !== undefined ? statistics.min : "نامشخص";

        const maxValue =
          statistics.max !== undefined ? statistics.max : "نامشخص";

        let generatedAt = "نامشخص";

        if (metadata.generated_at_utc) {
          generatedAt = new Date(metadata.generated_at_utc).toLocaleString(
            "fa-IR"
          );
        }

        setStatus(
          `لایه FLI با موفقیت بارگذاری شد | کمینه: ${minValue} | بیشینه: ${maxValue} | زمان تولید: ${generatedAt}`,
          "success"
        );

        console.log("FIRIS metadata:", metadata);
        console.log("FIRIS overlay URL:", imageUrl);
      } catch (error) {
        console.error("FIRIS loading error:", error);

        setStatus(
          "خطا در دریافت لایه FLI. بررسی کنید فایل‌های fli_latest.json و fli_latest.png در مسیر data/web مخزن ایجاد شده باشند.",
          "error"
        );
      }
    }

    loadFirisLayer();
  </script>
</body>
</html>
