<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FIRIS | سامانه اطلاعات خطر حریق فارس</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #f3f5f6;
      color: #1f2933;
      font-family: Tahoma, Arial, sans-serif;
    }

    .header {
      padding: 18px 20px;
      color: #ffffff;
      background: #74151f;
      border-bottom: 4px solid #d8a13c;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 8px 0 0;
      color: #ffe9b9;
      font-size: 14px;
    }

    .page {
      width: min(1200px, calc(100% - 24px));
      margin: 16px auto;
    }

    .status {
      margin-bottom: 12px;
      padding: 10px 14px;
      border: 1px solid #d7dfe3;
      border-right: 4px solid #74151f;
      border-radius: 8px;
      color: #52606d;
      background: #ffffff;
    }

    .map-card {
      overflow: hidden;
      border: 1px solid #d7dfe3;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
    }

    .map-title {
      margin: 0;
      padding: 11px 14px;
      color: #ffffff;
      background: #8d1e2b;
      font-size: 17px;
    }

    #map {
      width: 100%;
      height: 650px;
      background: #dce8ed;
    }

    .footer {
      padding: 16px 0 8px;
      color: #697783;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 20px;
      }

      #map {
        height: 520px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>سامانه اطلاعات خطر حریق فارس</h1>
    <p>FIRIS — Fars Integrated Fire Information System</p>
  </header>

  <main class="page">
    <div id="status" class="status">
      در حال آماده‌سازی نقشه...
    </div>

    <section class="map-card">
      <h2 class="map-title">نقشه استان فارس</h2>
      <div id="map"></div>
    </section>

    <div class="footer">
      پروژه FIRIS | نسخه اولیه
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    const statusBox = document.getElementById("status");

    const map = L.map("map").setView([29.5, 53.2], 7);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    statusBox.textContent = "نقشه با موفقیت آماده شد. در گام بعد مرز استان فارس را اضافه می‌کنیم.";
  </script>
</body>
</html>
