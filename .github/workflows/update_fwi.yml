name: Update FIRIS FWI

on:
  workflow_dispatch:

  schedule:
    # ----------------------------------------------------------
    # RUN 1: 20:35 UTC = 00:05 Iran (Immediately after midnight)
    # ----------------------------------------------------------
    - cron: "35 20 * * *"

    # ----------------------------------------------------------
    # RUN 2: 21:35 UTC = 01:05 Iran (Backup run)
    # ----------------------------------------------------------
    - cron: "35 21 * * *"

  push:
    paths:
      - "scripts/update_fwi.py"
      - "fars.geojson"
      - ".github/workflows/update_fwi.yml"

permissions:
  contents: write

concurrency:
  group: firis-fwi-update
  cancel-in-progress: false

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ========================================================
      # SETUP PYTHON
      # ========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            numpy \
            rasterio \
            requests \
            shapely \
            pyproj

      # ========================================================
      # CALCULATE IRAN DATE
      # ========================================================
      - name: Calculate Iran dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IRAN = ZoneInfo("Asia/Tehran")
          now_iran = datetime.now(IRAN)
          today = now_iran.date()
          tomorrow = today + timedelta(days=1)

          today_str = today.isoformat()
          tomorrow_str = tomorrow.isoformat()

          print("")
          print("=" * 70)
          print("FIRIS IRAN DATE CALCULATION")
          print("=" * 70)
          print(f"Current Iran datetime: {now_iran.isoformat()}")
          print(f"Today in Iran: {today_str}")
          print(f"Forecast target: {tomorrow_str}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TODAY_IRAN={today_str}\n")
              env.write(f"EXPECTED_DATE={tomorrow_str}\n")
          PY

      # ========================================================
      # DOWNLOAD TOMORROW FWI
      # ========================================================
      - name: Download FWI for tomorrow
        shell: bash
        run: |
          set -euo pipefail
          echo ""
          echo "======================================================================"
          echo "DOWNLOADING FIRIS FWI"
          echo "======================================================================"
          echo "Today in Iran: ${TODAY_IRAN}"
          echo "Target forecast: ${EXPECTED_DATE}"
          echo "Running update_fwi.py..."

          python scripts/update_fwi.py \
            --boundary "fars.geojson" \
            --overwrite

      # ========================================================
      # VERIFY TOMORROW FWI
      # ========================================================
      - name: Verify tomorrow FWI
        shell: bash
        run: |
          set -euo pipefail
          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"
          FWI_METADATA="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.json"

          echo ""
          echo "======================================================================"
          echo "VERIFYING TOMORROW FWI"
          echo "======================================================================"
          echo "Today in Iran: ${TODAY_IRAN}"
          echo "Expected forecast date: ${EXPECTED_DATE}"

          if [ ! -f "${FWI_FILE}" ]; then
            echo "ERROR: Tomorrow FWI raster was not created: ${FWI_FILE}"
            exit 1
          fi

          if [ ! -f "${FWI_METADATA}" ]; then
            echo "ERROR: Tomorrow FWI metadata was not created: ${FWI_METADATA}"
            exit 1
          fi

          echo "✓ Tomorrow FWI raster and metadata exist."

      # ========================================================
      # VERIFY METADATA DATE
      # ========================================================
      - name: Verify FWI metadata date
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["EXPECTED_DATE"]
          path = f"data/raw/fwi/fwi_ecmwf_fars_{expected}.json"

          with open(path, "r", encoding="utf-8") as file:
              metadata = json.load(file)

          actual = metadata.get("target_date") or metadata.get("forecast_date")

          print("=" * 70)
          print("FWI DATE VALIDATION")
          print("=" * 70)
          print(f"Expected: {expected}")
          print(f"Metadata: {actual}")

          if actual != expected:
              print("ERROR: FWI target date does not match EXPECTED_DATE.")
              sys.exit(1)

          print("✓ FWI target date is correct.")
          PY

      # ========================================================
      # VALIDATE GEOTIFF
      # ========================================================
      - name: Validate FWI GeoTIFF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import rasterio

          expected = os.environ["EXPECTED_DATE"]
          path = f"data/raw/fwi/fwi_ecmwf_fars_{expected}.tif"

          print("=" * 70)
          print("FWI GEOTIFF VALIDATION")
          print("=" * 70)

          with rasterio.open(path) as src:
              print(f"CRS: {src.crs}")
              print(f"Width: {src.width}, Height: {src.height}")
              print(f"Resolution: {src.res}")
              print(f"Bounds: {src.bounds}")

              if src.crs is None or src.crs.to_epsg() != 4326:
                  raise SystemExit("ERROR: FWI CRS is invalid or not EPSG:4326.")

              data = src.read(1, masked=True)
              if data.count() == 0:
                  raise SystemExit("ERROR: FWI contains no valid pixels.")

              print(f"Valid pixels: {int(data.count())}")
              print(f"Min: {float(data.min())}, Max: {float(data.max())}, Mean: {float(data.mean())}")

          print("✓ FWI GeoTIFF is valid.")
          PY

      # ========================================================
      # FINAL FORECAST VALIDATION
      # ========================================================
      - name: Final forecast validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["EXPECTED_DATE"]
          path = f"data/raw/fwi/fwi_ecmwf_fars_{expected}.json"

          with open(path, "r", encoding="utf-8") as file:
              metadata = json.load(file)

          target = metadata.get("target_date") or metadata.get("forecast_date")

          print("=" * 70)
          print("FINAL FIRIS FWI FORECAST")
          print("=" * 70)
          print(f"Iran datetime: {metadata.get('current_iran_datetime')}")
          print(f"Today in Iran: {os.environ['TODAY_IRAN']}")
          print(f"Target forecast: {target}")

          if target != expected:
              print("ERROR: Final target date is not tomorrow.")
              sys.exit(1)

          print("✓ Forecast target is correct.")
          print("✓ Tomorrow FWI validated.")
          PY

      # ========================================================
      # COMMIT & PUSH
      # ========================================================
      - name: Commit and Push FWI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fwi

          if git diff --cached --quiet; then
            echo "No FWI changes to commit."
            exit 0
          fi

          git commit -m "Update FWI forecast ${EXPECTED_DATE}"
          git pull --rebase origin main || true
          git push origin HEAD:main

          echo ""
          echo "======================================================================"
          echo "FIRIS FWI UPDATE COMPLETED"
          echo "======================================================================"
          echo "Today in Iran: ${TODAY_IRAN}"
          echo "Forecast target: ${EXPECTED_DATE}"
