name: Update FIRIS FWI

on:

  workflow_dispatch:

  schedule:

    # Every day at 18:00 UTC
    # = 21:30 Iran time
    #
    # The target date is calculated inside update_fwi.py
    # using Asia/Tehran.
    #
    # Example:
    # 2026-09-03 in Iran
    #        ↓
    # forecast target = 2026-09-04
    #
    # IMPORTANT:
    # This runs before midnight Iran time so that
    # tomorrow's FWI is generated before Build FIRIS starts.
    - cron: "0 18 * * *"

  push:

    paths:

      - "scripts/update_fwi.py"
      - "fars.geojson"
      - ".github/workflows/update_fwi.yml"


permissions:

  contents: write


concurrency:

  group: firis-fwi-update

  cancel-in-progress: true


jobs:

  update-fwi:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0
          persist-credentials: true


      # ========================================================
      # SETUP PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            rasterio \
            requests \
            shapely \
            pyproj


      # ========================================================
      # CHECK REQUIRED FILES
      # ========================================================

      - name: Check required files

        shell: bash

        run: |

          set -euo pipefail

          required_files=(

            "scripts/update_fwi.py"

            "fars.geojson"

          )

          echo ""
          echo "============================================================"
          echo "CHECKING REQUIRED FILES"
          echo "============================================================"

          for file in "${required_files[@]}"; do

            if [ ! -f "${file}" ]; then

              echo ""
              echo "ERROR: Required file not found:"
              echo "${file}"

              exit 1

            fi

            echo "✓ ${file}"

          done


      # ========================================================
      # CALCULATE TODAY AND TOMORROW IN IRAN
      # ========================================================

      - name: Calculate Iran dates

        shell: bash

        run: |

          set -euo pipefail

          python - <<'PY'

          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          iran = ZoneInfo("Asia/Tehran")

          now_iran = datetime.now(iran)

          today = now_iran.date()

          tomorrow = today + timedelta(days=1)

          today_str = today.isoformat()

          tomorrow_str = tomorrow.isoformat()

          print("")
          print("=" * 70)
          print("IRAN DATE CALCULATION")
          print("=" * 70)

          print("")
          print("Current Iran datetime:")
          print(now_iran.isoformat())

          print("")
          print("Today in Iran:")
          print(today_str)

          print("")
          print("Tomorrow in Iran:")
          print(tomorrow_str)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"TODAY_IRAN={today_str}\n"
              )

              env.write(
                  f"EXPECTED_DATE={tomorrow_str}\n"
              )

          PY


      # ========================================================
      # RUN AUTOMATIC FWI DOWNLOAD
      #
      # update_fwi.py calculates the target date itself using
      # Asia/Tehran.
      #
      # This workflow independently calculates EXPECTED_DATE
      # and later verifies that update_fwi.py generated exactly
      # that date.
      # ========================================================

      - name: Download FWI for tomorrow

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "DOWNLOADING TOMORROW FWI"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Required forecast date:"
          echo "${EXPECTED_DATE}"

          echo ""
          echo "Running update_fwi.py..."

          python scripts/update_fwi.py \
            --boundary "fars.geojson" \
            --overwrite


      # ========================================================
      # VERIFY DOWNLOADED FWI
      #
      # IMPORTANT:
      #
      # Only tomorrow's FWI is accepted.
      #
      # No fallback to:
      # - today
      # - yesterday
      # - latest available file
      # - older forecast
      # ========================================================

      - name: Verify tomorrow FWI

        shell: bash

        run: |

          set -euo pipefail

          if [ -z "${EXPECTED_DATE:-}" ]; then

            echo ""
            echo "ERROR: EXPECTED_DATE is not defined."

            exit 1

          fi

          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"

          FWI_METADATA="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.json"


          echo ""
          echo "============================================================"
          echo "VERIFYING TOMORROW FWI"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Required forecast date:"
          echo "${EXPECTED_DATE}"

          echo ""
          echo "Expected raster:"
          echo "${FWI_FILE}"

          echo ""
          echo "Expected metadata:"
          echo "${FWI_METADATA}"


          # ------------------------------------------------------
          # RASTER
          # ------------------------------------------------------

          if [ ! -f "${FWI_FILE}" ]; then

            echo ""
            echo "ERROR: Tomorrow FWI raster was not created."

            echo ""
            echo "Expected:"
            echo "${FWI_FILE}"

            echo ""
            echo "FIRIS FWI update stopped."

            exit 1

          fi


          # ------------------------------------------------------
          # METADATA
          # ------------------------------------------------------

          if [ ! -f "${FWI_METADATA}" ]; then

            echo ""
            echo "ERROR: Tomorrow FWI metadata was not created."

            echo ""
            echo "Expected:"
            echo "${FWI_METADATA}"

            echo ""
            echo "FIRIS FWI update stopped."

            exit 1

          fi


          echo ""
          echo "✓ Tomorrow FWI raster exists."

          echo ""
          echo "✓ Tomorrow FWI metadata exists."


      # ========================================================
      # VERIFY METADATA DATE
      # ========================================================

      - name: Verify FWI metadata date

        shell: bash

        run: |

          set -euo pipefail

          python - <<'PY'

          import json
          import os

          expected = os.environ["EXPECTED_DATE"]

          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          target_date = (
              metadata.get("target_date")
              or metadata.get("forecast_date")
          )

          print("")
          print("=" * 70)
          print("FWI METADATA DATE VALIDATION")
          print("=" * 70)

          print("")
          print("Today in Iran:")
          print(os.environ["TODAY_IRAN"])

          print("")
          print("Expected tomorrow:")
          print(expected)

          print("")
          print("Metadata target date:")
          print(target_date)

          if target_date != expected:

              raise SystemExit(
                  "ERROR: FWI metadata target date "
                  "does not equal tomorrow."
              )

          print("")
          print("✓ FWI metadata date is correct.")

          PY


      # ========================================================
      # VALIDATE GEOTIFF
      # ========================================================

      - name: Validate FWI GeoTIFF

        shell: bash

        run: |

          set -euo pipefail

          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"


          echo ""
          echo "============================================================"
          echo "FWI GEOTIFF VALIDATION"
          echo "============================================================"


          python - <<'PY'

          import os
          import rasterio

          expected = os.environ["EXPECTED_DATE"]

          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.tif"
          )


          print("")
          print("File:")
          print(path)


          with rasterio.open(path) as src:

              print("")
              print("CRS:")
              print(src.crs)

              print("")
              print("Width:")
              print(src.width)

              print("")
              print("Height:")
              print(src.height)

              print("")
              print("Resolution:")
              print(src.res)

              print("")
              print("Bounds:")
              print(src.bounds)


              if src.crs is None:

                  raise SystemExit(
                      "ERROR: FWI has no CRS."
                  )


              if src.crs.to_epsg() != 4326:

                  raise SystemExit(
                      "ERROR: FWI CRS is not EPSG:4326."
                  )


              data = src.read(
                  1,
                  masked=True
              )


              valid_count = int(
                  data.count()
              )


              if valid_count == 0:

                  raise SystemExit(
                      "ERROR: FWI contains no valid pixels."
                  )


              print("")
              print("Valid pixels:")
              print(valid_count)

              print("")
              print("Minimum:")
              print(float(data.min()))

              print("")
              print("Maximum:")
              print(float(data.max()))

              print("")
              print("Mean:")
              print(float(data.mean()))


          print("")
          print("✓ FWI GeoTIFF is valid.")

          PY


      # ========================================================
      # FINAL FORECAST VALIDATION
      # ========================================================

      - name: Show final forecast

        shell: bash

        run: |

          set -euo pipefail

          python - <<'PY'

          import json
          import os

          expected = os.environ["EXPECTED_DATE"]

          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)


          forecast_date = (
              metadata.get("target_date")
              or metadata.get("forecast_date")
          )


          print("")
          print("=" * 70)
          print("FINAL FIRIS FWI FORECAST")
          print("=" * 70)

          print("")
          print("Today in Iran:")
          print(os.environ["TODAY_IRAN"])

          print("")
          print("Forecast target:")
          print(forecast_date)

          print("")
          print("Forecast definition:")
          print(
              metadata.get(
                  "forecast_definition"
              )
          )

          print("")
          print("Source:")
          print(
              metadata.get(
                  "source"
              )
          )

          print("")
          print("Layer:")
          print(
              metadata.get(
                  "layer"
              )
          )

          print("")
          print("Current Iran datetime:")
          print(
              metadata.get(
                  "current_iran_datetime"
              )
          )

          print("")
          print("Output file:")
          print(
              metadata.get(
                  "output_file"
              )
          )


          if forecast_date != expected:

              raise SystemExit(
                  "ERROR: Final FWI forecast date "
                  "is not tomorrow."
              )


          print("")
          print("✓ Final FWI forecast validated.")
          print("✓ Target date is tomorrow.")
          print("✓ No older FWI was used.")

          PY


      # ========================================================
      # COMMIT
      # ========================================================

      - name: Commit FWI

        shell: bash

        run: |

          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          echo ""
          echo "============================================================"
          echo "COMMITTING TOMORROW FWI"
          echo "============================================================"


          git add \
            data/raw/fwi


          if git diff --cached --quiet; then

            echo ""
            echo "No FWI changes to commit."

            exit 0

          fi


          git commit \
            -m \
            "chore(fwi): update tomorrow forecast [skip ci]"


      # ========================================================
      # PUSH
      #
      # IMPORTANT:
      # The generated tomorrow FWI must be pushed to main
      # before Build FIRIS starts.
      # ========================================================

      - name: Push FWI

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "PUSHING TOMORROW FWI"
          echo "============================================================"


          git fetch origin main


          # ------------------------------------------------------
          # Synchronize with the latest main.
          #
          # If another workflow changed unrelated files,
          # preserve those changes.
          #
          # The FWI files generated by this workflow remain
          # the authoritative files for tomorrow's forecast.
          # ------------------------------------------------------

          git merge origin/main \
            -X ours \
            --no-edit \
            || {

              echo ""
              echo "ERROR: Git merge failed."

              git status

              exit 1

            }


          git push origin HEAD:main


          echo ""
          echo "============================================================"
          echo "FWI UPDATE COMPLETED"
          echo "============================================================"


          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"


          echo ""
          echo "Tomorrow forecast:"
          echo "${EXPECTED_DATE}"


          echo ""
          echo "FWI metadata:"
          echo "data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.json"


          echo ""
          echo "FWI raster:"
          echo "data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"


          echo ""
          echo "✓ Tomorrow FWI committed to main."
