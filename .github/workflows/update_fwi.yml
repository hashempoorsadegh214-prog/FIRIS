
name: Update FIRIS FWI

on:

  workflow_dispatch:

  schedule:

    # Every day at 21:00 UTC
    # = 00:30 Iran time on the next day during DST-like offsets
    # The actual target date is ALWAYS calculated
    # inside update_fwi.py using Asia/Tehran.
    - cron: "0 21 * * *"

  push:

    paths:

      - "scripts/update_fwi.py"
      - "fars.geojson"
      - ".github/workflows/update_fwi.yml"


permissions:

  contents: write


concurrency:

  group: firis-fwi-update

  cancel-in-progress: true


jobs:

  update-fwi:

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ========================================================
      # SETUP PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            rasterio \
            requests \
            shapely \
            pyproj


      # ========================================================
      # CHECK REQUIRED FILES
      # ========================================================

      - name: Check required files

        shell: bash

        run: |

          set -euo pipefail


          required_files=(

            "scripts/update_fwi.py"

            "fars.geojson"

          )


          echo ""
          echo "============================================================"
          echo "CHECKING REQUIRED FILES"
          echo "============================================================"


          for file in "${required_files[@]}"; do

            if [ ! -f "${file}" ]; then

              echo ""
              echo "ERROR: Required file not found:"
              echo "${file}"

              exit 1

            fi


            echo "✓ ${file}"

          done


      # ========================================================
      # RUN AUTOMATIC FWI DOWNLOAD
      #
      # IMPORTANT:
      #
      # update_fwi.py itself calculates:
      #
      # TODAY IN IRAN + 1 DAY
      #
      # Therefore:
      #
      # 2026-08-29
      #       ↓
      # 2026-08-30
      #
      # We do NOT manually choose the date here.
      # ========================================================

      - name: Download FWI for tomorrow

        shell: bash

        run: |

          set -euo pipefail


          echo ""
          echo "============================================================"
          echo "DOWNLOADING TOMORROW FWI"
          echo "============================================================"


          python scripts/update_fwi.py \
            --boundary "fars.geojson" \
            --overwrite


      # ========================================================
      # DETECT CURRENT IRAN DATE AND EXPECTED TARGET DATE
      # ========================================================

      - name: Calculate expected forecast date

        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo


          iran = ZoneInfo(
              "Asia/Tehran"
          )


          now = datetime.now(
              iran
          )


          expected = (
              now.date()
              +
              timedelta(days=1)
          )


          expected_date = (
              expected.isoformat()
          )


          print("")
          print("=" * 70)
          print("EXPECTED FORECAST DATE")
          print("=" * 70)


          print(
              "Iran current datetime:",
              now.isoformat()
          )


          print(
              "Iran current date:",
              now.date().isoformat()
          )


          print(
              "Expected tomorrow:",
              expected_date
          )


          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"EXPECTED_DATE={expected_date}\n"
              )


          PY


      # ========================================================
      # VERIFY DOWNLOADED FWI
      # ========================================================

      - name: Verify downloaded FWI

        shell: bash

        run: |

          set -euo pipefail


          if [ -z "${EXPECTED_DATE:-}" ]; then

            echo ""
            echo "ERROR: EXPECTED_DATE is not defined."

            exit 1

          fi


          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"

          FWI_METADATA="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.json"


          echo ""
          echo "============================================================"
          echo "VERIFYING TOMORROW FWI"
          echo "============================================================"


          echo ""
          echo "Expected forecast date:"
          echo "${EXPECTED_DATE}"


          echo ""
          echo "Expected raster:"
          echo "${FWI_FILE}"


          echo ""
          echo "Expected metadata:"
          echo "${FWI_METADATA}"


          if [ ! -f "${FWI_FILE}" ]; then

            echo ""
            echo "ERROR: Tomorrow FWI raster was not created:"
            echo "${FWI_FILE}"

            exit 1

          fi


          if [ ! -f "${FWI_METADATA}" ]; then

            echo ""
            echo "ERROR: Tomorrow FWI metadata was not created:"
            echo "${FWI_METADATA}"

            exit 1

          fi


          echo ""
          echo "✓ Tomorrow FWI raster exists."
          echo "✓ Tomorrow FWI metadata exists."


      # ========================================================
      # VERIFY METADATA DATE
      # ========================================================

      - name: Verify FWI metadata date

        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os


          expected = os.environ[
              "EXPECTED_DATE"
          ]


          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(
                  file
              )


          target_date = (

              metadata.get(
                  "target_date"
              )

              or

              metadata.get(
                  "forecast_date"
              )

          )


          print("")
          print("=" * 70)
          print("FWI METADATA DATE VALIDATION")
          print("=" * 70)


          print(
              "Expected:",
              expected
          )


          print(
              "Metadata :",
              target_date
          )


          if target_date != expected:

              raise SystemExit(

                  "ERROR: FWI metadata target date "
                  "does not equal tomorrow."
              )


          print("")
          print(
              "✓ FWI metadata date is correct."
          )


          PY


      # ========================================================
      # VALIDATE GEOTIFF
      # ========================================================

      - name: Validate FWI GeoTIFF

        shell: bash

        run: |

          set -euo pipefail


          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"


          python - <<'PY'

          import os
          import rasterio


          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_"
              f"{os.environ['EXPECTED_DATE']}.tif"
          )


          print("")
          print("=" * 70)
          print("FWI GEOTIFF VALIDATION")
          print("=" * 70)


          with rasterio.open(
              path
          ) as src:

              print(
                  "File:",
                  path
              )

              print(
                  "CRS:",
                  src.crs
              )

              print(
                  "Width:",
                  src.width
              )

              print(
                  "Height:",
                  src.height
              )

              print(
                  "Resolution:",
                  src.res
              )

              print(
                  "Bounds:",
                  src.bounds
              )

              data = src.read(
                  1,
                  masked=True
              )


              if src.crs is None:

                  raise SystemExit(
                      "ERROR: FWI has no CRS."
                  )


              if src.crs.to_epsg() != 4326:

                  raise SystemExit(
                      "ERROR: FWI CRS is not EPSG:4326."
                  )


              valid_count = int(
                  data.count()
              )


              if valid_count == 0:

                  raise SystemExit(
                      "ERROR: FWI contains no valid pixels."
                  )


              print(
                  "Valid pixels:",
                  valid_count
              )


              print(
                  "Minimum:",
                  float(data.min())
              )


              print(
                  "Maximum:",
                  float(data.max())
              )


              print(
                  "Mean:",
                  float(data.mean())
              )


          print("")
          print(
              "✓ FWI GeoTIFF is valid."
          )

          PY


      # ========================================================
      # SHOW FINAL FORECAST
      # ========================================================

      - name: Show final forecast

        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os


          expected = os.environ[
              "EXPECTED_DATE"
          ]


          path = (
              "data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(
                  file
              )


          print("")
          print("=" * 70)
          print("FINAL FIRIS FWI FORECAST")
          print("=" * 70)


          print("")
          print(
              "Forecast date:",
              metadata.get(
                  "target_date"
              )
              or
              metadata.get(
                  "forecast_date"
              )
          )


          print(
              "Forecast definition:",
              metadata.get(
                  "forecast_definition"
              )
          )


          print(
              "Source:",
              metadata.get(
                  "source"
              )
          )


          print(
              "Layer:",
              metadata.get(
                  "layer"
              )
          )


          print(
              "Current Iran datetime:",
              metadata.get(
                  "current_iran_datetime"
              )
          )


          print("")
          print(
              "✓ Final FWI forecast validated."
          )


          PY


      # ========================================================
      # COMMIT
      # ========================================================

      - name: Commit FWI

        shell: bash

        run: |

          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/raw/fwi


          if git diff --cached --quiet; then

            echo ""
            echo "No FWI changes to commit."

            exit 0

          fi


          git commit \
            -m \
            "chore(fwi): update tomorrow forecast [skip ci]"


      # ========================================================
      # PUSH
      # ========================================================

      - name: Push FWI

        shell: bash

        run: |

          set -euo pipefail


          git push origin HEAD:main


          echo ""
          echo "============================================================"
          echo "FWI UPDATE COMPLETED"
          echo "============================================================"


          echo ""
          echo "Today in Iran:"
          echo "${EXPECTED_DATE}"


          echo ""
          echo "Tomorrow forecast:"
          echo "${EXPECTED_DATE}"


          echo ""
          echo "✓ New FWI forecast committed to main."
