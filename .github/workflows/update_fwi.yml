name: Update FIRIS FWI

on:
  workflow_dispatch:

  # اجرای خودکار روزانه کمی بعد از نیمه‌شب ایران
  # 20:35 UTC = 00:05 به وقت ایران
  schedule:
    - cron: "35 20 * * *"

  # اجرای خودکار در صورت تغییر فایل‌های اصلی FWI
  push:
    paths:
      - "scripts/update_fwi.py"
      - "fars.geojson"
      - ".github/workflows/update_fwi.yml"

permissions:
  contents: write

concurrency:
  group: firis-fwi-update
  cancel-in-progress: false

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            numpy \
            rasterio \
            requests \
            shapely \
            pyproj

      # ========================================================
      # 4. CALCULATE IRAN TODAY + TOMORROW
      # ========================================================
      - name: Calculate Iran dates
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IRAN = ZoneInfo("Asia/Tehran")

          now_iran = datetime.now(IRAN)

          today = now_iran.date()
          tomorrow = today + timedelta(days=1)

          today_str = today.isoformat()
          tomorrow_str = tomorrow.isoformat()

          print("=" * 70)
          print("FIRIS IRAN DATE CALCULATION")
          print("=" * 70)

          print(f"Current Iran datetime : {now_iran.isoformat()}")
          print(f"Today in Iran        : {today_str}")
          print(f"Tomorrow / target    : {tomorrow_str}")

          print("=" * 70)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"TODAY_IRAN={today_str}\n"
              )

              env.write(
                  f"EXPECTED_DATE={tomorrow_str}\n"
              )

          PY

      # ========================================================
      # 5. DOWNLOAD FWI FOR TOMORROW
      # ========================================================
      - name: Download FWI for tomorrow
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================================"
          echo "STEP 1 - DOWNLOAD TOMORROW FWI"
          echo "======================================================================"

          echo "Today in Iran : ${TODAY_IRAN}"
          echo "Target date   : ${EXPECTED_DATE}"

          echo ""

          python scripts/update_fwi.py \
            --boundary "fars.geojson" \
            --overwrite

          echo ""

          echo "FWI downloader finished successfully."

      # ========================================================
      # 6. HARD CHECK
      # EXACT TOMORROW FILES MUST EXIST
      # ========================================================
      - name: Verify exact tomorrow FWI files
        shell: bash
        run: |
          set -euo pipefail

          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.tif"

          FWI_METADATA="data/raw/fwi/fwi_ecmwf_fars_${EXPECTED_DATE}.json"

          echo "======================================================================"
          echo "STEP 2 - VERIFY EXACT TOMORROW FWI"
          echo "======================================================================"

          echo "Expected raster   : ${FWI_FILE}"
          echo "Expected metadata : ${FWI_METADATA}"

          echo ""

          if [ ! -f "${FWI_FILE}" ]; then

            echo "ERROR: Exact tomorrow FWI raster does not exist."

            echo "The pipeline will stop here."

            echo "No old FWI may be used."

            exit 1

          fi

          if [ ! -f "${FWI_METADATA}" ]; then

            echo "ERROR: Exact tomorrow FWI metadata does not exist."

            echo "The pipeline will stop here."

            exit 1

          fi

          if [ ! -s "${FWI_FILE}" ]; then

            echo "ERROR: FWI raster exists but is empty."

            exit 1

          fi

          if [ ! -s "${FWI_METADATA}" ]; then

            echo "ERROR: FWI metadata exists but is empty."

            exit 1

          fi

          echo "OK: Exact tomorrow FWI raster exists."

          echo "OK: Exact tomorrow FWI metadata exists."

      # ========================================================
      # 7. HARD CHECK
      # METADATA DATE MUST EQUAL TOMORROW
      # ========================================================
      - name: Verify FWI target date
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["EXPECTED_DATE"]

          path = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          actual = (
              metadata.get("target_date")
              or
              metadata.get("forecast_date")
          )

          print("=" * 70)
          print("STEP 3 - FWI DATE VALIDATION")
          print("=" * 70)

          print(
              f"Expected target date : {expected}"
          )

          print(
              f"Metadata target date : {actual}"
          )

          print("")

          if actual != expected:

              print(
                  "ERROR: FWI metadata date is NOT tomorrow."
              )

              print(
                  "ERROR: Old or wrong-date FWI is forbidden."
              )

              sys.exit(1)

          print(
              "OK: FWI target date exactly matches tomorrow."
          )

          PY

      # ========================================================
      # 8. VALIDATE GEOTIFF CONTENT
      # ========================================================
      - name: Validate FWI GeoTIFF
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import rasterio

          expected = os.environ["EXPECTED_DATE"]

          path = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.tif"
          )

          print("=" * 70)
          print("STEP 4 - FWI GEOTIFF VALIDATION")
          print("=" * 70)

          with rasterio.open(path) as src:

              print(f"CRS        : {src.crs}")

              print(
                  f"Width      : {src.width}"
              )

              print(
                  f"Height     : {src.height}"
              )

              print(
                  f"Resolution : {src.res}"
              )

              print(
                  f"Bounds     : {src.bounds}"
              )

              if (
                  src.crs is None
                  or
                  src.crs.to_epsg() != 4326
              ):

                  raise SystemExit(
                      "ERROR: FWI CRS is invalid "
                      "or is not EPSG:4326."
                  )

              data = src.read(
                  1,
                  masked=True
              )

              if data.count() == 0:

                  raise SystemExit(
                      "ERROR: FWI contains no valid pixels."
                  )

              minimum = float(
                  data.min()
              )

              maximum = float(
                  data.max()
              )

              mean = float(
                  data.mean()
              )

              print(
                  f"Valid pixels: {int(data.count())}"
              )

              print(
                  f"Min         : {minimum}"
              )

              print(
                  f"Max         : {maximum}"
              )

              print(
                  f"Mean        : {mean}"
              )

              if maximum < 0:

                  raise SystemExit(
                      "ERROR: FWI maximum is invalid."
                  )

          print("")
          print(
              "OK: FWI GeoTIFF is valid and contains data."
          )

          PY

      # ========================================================
      # 9. FINAL FWI SUCCESS GATE
      # ========================================================
      - name: Final FWI success gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["EXPECTED_DATE"]

          path = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{expected}.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          target = (
              metadata.get("target_date")
              or
              metadata.get("forecast_date")
          )

          print("=" * 70)
          print("FINAL FWI SUCCESS GATE")
          print("=" * 70)

          print(
              f"Today in Iran : "
              f"{os.environ['TODAY_IRAN']}"
          )

          print(
              f"FWI target    : {target}"
          )

          print(
              f"Expected      : {expected}"
          )

          print("")

          if target != expected:

              print(
                  "ERROR: FWI final gate failed."
              )

              sys.exit(1)

          print(
              "SUCCESS: FWI for tomorrow was "
              "downloaded and fully validated."
          )

          print(
              "SUCCESS: The FWI stage is complete."
          )

          print(
              "SUCCESS: No stale FWI fallback "
              "is permitted by this workflow."
          )

          PY

      # ========================================================
      # 10. COMMIT + PUSH ONLY VERIFIED FWI
      # ========================================================
      - name: Commit and Push verified FWI
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fwi

          if git diff --cached --quiet; then

            echo "No FWI changes to commit."

            exit 0

          fi

          git commit \
            -m "Update FWI forecast ${EXPECTED_DATE}"

          git pull --rebase origin main

          git push origin HEAD:main

          echo ""
          echo "======================================================================"
          echo "FIRIS FWI UPDATE COMPLETED"
          echo "======================================================================"

          echo "Today in Iran : ${TODAY_IRAN}"

          echo "Forecast date : ${EXPECTED_DATE}"

          echo "======================================================================"
