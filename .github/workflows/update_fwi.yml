
name: Update FIRIS FWI

on:

  workflow_dispatch:

  push:
    paths:

      - "scripts/**"
      - "fars.geojson"
      - "data/raw/fwi/**"
      - ".github/workflows/update_fwi.yml"


permissions:
  contents: write


concurrency:

  group: firis-fwi-update

  cancel-in-progress: true


jobs:

  update-fwi:

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj


      # ========================================================
      # CHECK FWI METADATA
      #
      # IMPORTANT:
      #
      # Metadata may contain:
      #
      # target_date
      #
      # or:
      #
      # forecast_date
      #
      # We accept BOTH.
      # ========================================================

      - name: Detect forecast FWI

        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os
          from datetime import datetime
          from pathlib import Path


          directory = Path(
              "data/raw/fwi"
          )


          if not directory.exists():

              raise SystemExit(
                  "ERROR: data/raw/fwi does not exist."
              )


          metadata_files = sorted(
              directory.glob(
                  "fwi_ecmwf_fars_*.json"
              )
          )


          if not metadata_files:

              raise SystemExit(
                  "ERROR: No FWI metadata files found."
              )


          print("")
          print("=" * 70)
          print("SEARCHING FWI METADATA")
          print("=" * 70)


          candidates = []


          for metadata_path in metadata_files:

              print(
                  f"Checking: {metadata_path}"
              )


              try:

                  with metadata_path.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      metadata = json.load(
                          file
                      )


                  # ------------------------------------------------
                  # ACCEPT BOTH DATE FIELDS
                  # ------------------------------------------------

                  forecast_date = (
                      metadata.get(
                          "target_date"
                      )
                      or
                      metadata.get(
                          "forecast_date"
                      )
                  )


                  if not forecast_date:

                      print(
                          "  -> skipped: "
                          "no target_date/forecast_date"
                      )

                      continue


                  # ------------------------------------------------
                  # VALIDATE DATE
                  # ------------------------------------------------

                  try:

                      datetime.strptime(
                          str(
                              forecast_date
                          ),
                          "%Y-%m-%d"
                      )

                  except ValueError:

                      print(
                          "  -> skipped: "
                          f"invalid date {forecast_date}"
                      )

                      continue


                  # ------------------------------------------------
                  # FIND RASTER NAME
                  # ------------------------------------------------

                  raster_name = (
                      metadata.get(
                          "output_file"
                      )
                  )


                  if not raster_name:

                      raster_name = (
                          metadata_path.stem
                          +
                          ".tif"
                      )


                  raster_name = str(
                      raster_name
                  )


                  # ------------------------------------------------
                  # RESOLVE RASTER PATH
                  # ------------------------------------------------

                  raster_path = (
                      directory
                      /
                      raster_name
                  )


                  if not raster_path.is_file():

                      alternative = Path(
                          raster_name
                      )


                      if alternative.is_file():

                          raster_path = alternative

                      else:

                          print(
                              "  -> skipped: "
                              f"raster not found: "
                              f"{raster_path}"
                          )

                          continue


                  candidates.append(
                      (
                          str(
                              forecast_date
                          ),
                          raster_path,
                          metadata_path
                      )
                  )


                  print(
                      "  -> valid:"
                  )

                  print(
                      f"     date = {forecast_date}"
                  )

                  print(
                      f"     raster = {raster_path}"
                  )


              except Exception as error:

                  print(
                      "  -> skipped because of error:"
                  )

                  print(
                      f"     {error}"
                  )


          # ========================================================
          # SELECT LATEST FORECAST
          # ========================================================

          if not candidates:

              raise SystemExit(
                  "ERROR: No valid FWI metadata with "
                  "target_date or forecast_date found."
              )


          candidates.sort(
              key=lambda item: item[0]
          )


          forecast_date, raster_path, metadata_path = (
              candidates[-1]
          )


          # ========================================================
          # EXPORT ENVIRONMENT VARIABLES
          # ========================================================

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"FWI_DATE={forecast_date}\n"
              )

              env.write(
                  f"FWI_RASTER={raster_path}\n"
              )

              env.write(
                  f"FWI_METADATA={metadata_path}\n"
              )


          print("")
          print("=" * 70)
          print("SELECTED FORECAST FWI")
          print("=" * 70)

          print(
              f"Forecast date : {forecast_date}"
          )

          print(
              f"FWI raster    : {raster_path}"
          )

          print(
              f"Metadata      : {metadata_path}"
          )

          print("")
          print(
              "✓ Forecast FWI selected successfully."
          )

          PY


      # ========================================================
      # CHECK SELECTED FWI RASTER
      # ========================================================

      - name: Validate selected FWI raster

        shell: bash

        run: |

          set -euo pipefail


          if [ ! -f "${FWI_RASTER}" ]; then

            echo ""
            echo "ERROR: Selected FWI raster not found:"
            echo "${FWI_RASTER}"

            exit 1

          fi


          python - <<'PY'

          import os
          import rasterio


          path = os.environ[
              "FWI_RASTER"
          ]


          print("")
          print("=" * 70)
          print("VALIDATING SELECTED FWI")
          print("=" * 70)


          with rasterio.open(
              path
          ) as src:

              print(
                  "File       :",
                  path
              )

              print(
                  "CRS        :",
                  src.crs
              )

              print(
                  "Size       :",
                  src.width,
                  "x",
                  src.height
              )

              print(
                  "Resolution :",
                  src.res
              )

              print(
                  "Bounds     :",
                  src.bounds
              )

              if src.crs is None:

                  raise SystemExit(
                      "ERROR: FWI raster has no CRS."
                  )


              if src.crs.to_epsg() != 4326:

                  raise SystemExit(
                      "ERROR: FWI raster must use EPSG:4326."
                  )


          print("")
          print(
              "✓ Selected FWI raster is valid."
          )

          PY


      # ========================================================
      # VERIFY BOUNDARY
      # ========================================================

      - name: Verify Fars boundary

        shell: bash

        run: |

          set -euo pipefail


          if [ ! -f "fars.geojson" ]; then

            echo ""
            echo "ERROR: fars.geojson not found."

            exit 1

          fi


          python - <<'PY'

          import json


          path = "fars.geojson"


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(
                  file
              )


          if (
              data.get("type")
              != "FeatureCollection"
          ):

              raise SystemExit(
                  "ERROR: fars.geojson is not a FeatureCollection."
              )


          features = data.get(
              "features",
              []
          )


          if not features:

              raise SystemExit(
                  "ERROR: fars.geojson has no features."
              )


          print("")
          print(
              "✓ Fars boundary is valid."
          )

          print(
              f"Features: {len(features)}"
          )

          PY


      # ========================================================
      # SHOW FORECAST INFORMATION
      # ========================================================

      - name: Show forecast information

        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os


          path = os.environ[
              "FWI_METADATA"
          ]


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(
                  file
              )


          target_date = (
              metadata.get(
                  "target_date"
              )
              or
              metadata.get(
                  "forecast_date"
              )
          )


          print("")
          print("=" * 70)
          print("FIRIS FWI FORECAST")
          print("=" * 70)

          print(
              "Target date:",
              target_date
          )

          print(
              "Source:",
              metadata.get(
                  "source"
              )
          )

          print(
              "Layer:",
              metadata.get(
                  "layer"
              )
          )

          print(
              "Output file:",
              metadata.get(
                  "output_file"
              )
          )

          print("")

          PY


      # ========================================================
      # COMMIT
      #
      # This workflow does not run FLI.
      # It only manages/updates FWI source files.
      # ========================================================

      - name: Commit FWI files

        shell: bash

        run: |

          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/raw/fwi


          if git diff --cached --quiet; then

            echo ""
            echo "No FWI file changes to commit."

            exit 0

          fi


          git commit \
            -m \
            "chore(fwi): update forecast FWI [skip ci]"


      # ========================================================
      # PUSH
      # ========================================================

      - name: Push FWI update

        shell: bash

        run: |

          set -euo pipefail


          git push origin HEAD:main


          echo ""
          echo "============================================================"
          echo "FWI UPDATE COMPLETED SUCCESSFULLY"
          echo "============================================================"

          echo ""
          echo "Forecast date:"
          echo "${FWI_DATE}"

          echo ""
          echo "FWI raster:"
          echo "${FWI_RASTER}"
