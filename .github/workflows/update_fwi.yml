name: Update FIRIS FWI

on:

  workflow_dispatch:

  schedule:

    - cron: "30 5 * * *"


permissions:

  contents: write


concurrency:

  group: firis-fwi-download

  cancel-in-progress: true


jobs:

  download-fwi:

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            -r scripts/requirements.txt


      # ========================================================
      # CHECK BOUNDARY
      # ========================================================

      - name: Check Fars boundary

        shell: bash

        run: |

          set -euo pipefail

          if [ ! -f "fars.geojson" ]; then

            echo ""
            echo "ERROR: fars.geojson not found."

            exit 1

          fi

          echo "✓ fars.geojson exists."


      # ========================================================
      # DOWNLOAD TOMORROW FWI
      # ========================================================

      - name: Download tomorrow FWI

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "AUTOMATIC TOMORROW FWI"
          echo "============================================================"

          python scripts/update_fwi.py \
            --boundary "fars.geojson" \
            --overwrite


      # ========================================================
      # DETERMINE FWI DATE FROM CREATED FILE
      # ========================================================

      - name: Detect forecast FWI file

        shell: bash

        run: |

          set -euo pipefail

          python - <<'PY'

          import json
          import os
          from pathlib import Path

          directory = Path(
              "data/raw/fwi"
          )

          files = sorted(
              directory.glob(
                  "fwi_ecmwf_fars_*.json"
              )
          )

          if not files:

              raise SystemExit(
                  "No FWI metadata file was created."
              )

          latest = files[-1]

          with latest.open(
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          forecast_date = (
              metadata.get(
                  "forecast_date"
              )
          )

          if not forecast_date:

              raise SystemExit(
                  "forecast_date missing "
                  "from FWI metadata."
              )

          print(
              f"Detected forecast date: "
              f"{forecast_date}"
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"FWI_DATE={forecast_date}\n"
              )

          PY


      # ========================================================
      # VERIFY FWI
      # ========================================================

      - name: Verify tomorrow FWI

        shell: bash

        run: |

          set -euo pipefail

          FWI_FILE="data/raw/fwi/fwi_ecmwf_fars_${FWI_DATE}.tif"

          FWI_META="data/raw/fwi/fwi_ecmwf_fars_${FWI_DATE}.json"


          if [ ! -f "${FWI_FILE}" ]; then

            echo ""
            echo "ERROR: FWI file not found:"
            echo "${FWI_FILE}"

            exit 1

          fi


          if [ ! -f "${FWI_META}" ]; then

            echo ""
            echo "ERROR: FWI metadata not found:"
            echo "${FWI_META}"

            exit 1

          fi


          python - <<'PY'

          import json
          import os
          import rasterio

          date = os.environ["FWI_DATE"]

          tif = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{date}.tif"
          )

          meta = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{date}.json"
          )

          print("")
          print("=" * 70)
          print("FWI VERIFICATION")
          print("=" * 70)

          with open(
              meta,
              "r",
              encoding="utf-8"
          ) as file:

              info = json.load(file)

          print(
              "Forecast date :",
              info.get(
                  "forecast_date"
              )
          )

          print(
              "Iran datetime :",
              info.get(
                  "current_iran_datetime"
              )
          )

          print(
              "Request BBOX  :",
              info.get(
                  "request_bbox"
              )
          )

          with rasterio.open(
              tif
          ) as src:

              print(
                  "Raster bounds :",
                  src.bounds
              )

              print(
                  "Raster size   :",
                  src.width,
                  "x",
                  src.height
              )

              print(
                  "Raster CRS    :",
                  src.crs
              )

          PY


      # ========================================================
      # CONTROL POINT CHECK
      # ========================================================

      - name: Check Fars control points

        shell: bash

        run: |

          set -euo pipefail

          python scripts/check_control_points.py \
            --raster \
              "data/raw/fwi/fwi_ecmwf_fars_${FWI_DATE}.tif" \
            --boundary \
              "fars.geojson" \
            --output \
              "data/outputs/control_points_${FWI_DATE}.json"


      # ========================================================
      # SHOW CONTROL POINTS
      # ========================================================

      - name: Show control point report

        shell: bash

        run: |

          set -euo pipefail

          cat \
            "data/outputs/control_points_${FWI_DATE}.json"


      # ========================================================
      # COMMIT
      # ========================================================

      - name: Commit FWI

        shell: bash

        run: |

          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/raw/fwi \
            "data/outputs/control_points_${FWI_DATE}.json"


          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m \
            "chore: automatic tomorrow FWI update"


      # ========================================================
      # PUSH
      # ========================================================

      - name: Push

        shell: bash

        run: |

          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "============================================================"
          echo "TOMORROW FWI PUSHED SUCCESSFULLY"
          echo "============================================================"
