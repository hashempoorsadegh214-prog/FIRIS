name: Update FIRIS FWI

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "FWI date in YYYY-MM-DD format; leave blank for tomorrow UTC"
        required: false
        type: string

  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  download-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download ECMWF FWI for Fars
        shell: bash
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python scripts/update_fwi.py --date "${{ inputs.target_date }}"
          else
            python scripts/update_fwi.py
          fi

      - name: Commit FWI data and metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fwi/

          if git diff --cached --quiet; then
            echo "No new FWI files to commit."
          else
            git commit -m "chore: update ECMWF FWI data"
            git push
          fi
