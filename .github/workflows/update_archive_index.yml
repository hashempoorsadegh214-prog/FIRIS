name: Update Archive Index

on:
  workflow_run:
    workflows: ["Build FIRIS"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-index:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build archive index
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path("data/web/archive")
          root.mkdir(parents=True, exist_ok=True)

          dates = sorted(
              p.name
              for p in root.iterdir()
              if p.is_dir()
              and len(p.name) == 10
              and p.name[4] == "-"
              and p.name[7] == "-"
          )

          output = root / "index.json"

          output.write_text(
              json.dumps(dates, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Archive dates:", dates)

      - name: Commit archive index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/web/archive/index.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update archive index"
          git push
