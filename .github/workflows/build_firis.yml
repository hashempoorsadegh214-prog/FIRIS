name: FIRIS Automated Pipeline

on:
  schedule:
    - cron: '30 20 * * *' # اجرای خودکار هر شب (۰۰:۰۰ به وقت ایران)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas rasterio openpyxl geopandas shapely requests folium

      - name: 4. Prepare Environment & Fetch Weather
        run: |
          python scripts/prepare_and_fetch.py

      - name: 5. Build FLI Model
        run: |
          if [ -z "$FWI_PATH" ] || [ ! -f "$FWI_PATH" ]; then
            echo "Error: FWI raster file not found."
            exit 1
          fi

          CMD="python scripts/build_firis.py \
            --fwi-raster \"$FWI_PATH\" \
            --fuel-raster \"$FUEL_PATH\" \
            --dem-raster \"$DEM_PATH\" \
            --fuel-excel \"$EXCEL_PATH\" \
            --output-dir \"outputs\" \
            --run-date \"$RUN_DATE\""

          if [ -n "$BOUNDARY_PATH" ] && [ -f "$BOUNDARY_PATH" ]; then
            CMD="$CMD --boundary \"$BOUNDARY_PATH\""
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: 6. Build Web Map
        if: always()
        run: |
          if [ -f "scripts/build_map.py" ]; then
            python scripts/build_map.py --output-dir "outputs" --run-date "$RUN_DATE" || echo "Web map build skipped or warning."
          fi

      - name: 7. Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --staged --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Auto-generate FIRIS FLI layers for ${RUN_DATE}"
            git push
          fi
