name: Build FIRIS Fire Risk Index

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/build_firis.py"
      - "data/raw/fwi/**"
      - "data/raw/fuel/**"
      - "data/raw/topography/**"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

jobs:
  build-firis:
    runs-on: ubuntu-latest

    env:
      # مسیر فایل‌های ورودی
      FWI_RASTER: data/raw/fwi/fwi_ecmwf_fars_2026-08-27.tif
      FUEL_RASTER: data/raw/fuel/fars_fuel.tif
      DEM_RASTER: data/raw/topography/dem_fars.tif
      FUEL_EXCEL: data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx

      # ستون‌های جدول Fuelbeds_metric
      FUEL_CODE_COLUMN: JOIN_VALUE
      FUEL_SCORE_COLUMN: AUTO

      # مسیر و تاریخ خروجی
      OUTPUT_DIR: data/outputs
      FIRIS_DATE: 2026-08-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # برای pull --rebase و push به تاریخچه کامل Git نیاز داریم.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas rasterio openpyxl scipy
          fi

      - name: Verify input files
        run: |
          set -e

          echo "Checking FIRIS input files..."

          test -f "$FWI_RASTER" || {
            echo "ERROR: FWI raster not found: $FWI_RASTER"
            exit 1
          }

          test -f "$FUEL_RASTER" || {
            echo "ERROR: Fuel raster not found: $FUEL_RASTER"
            exit 1
          }

          test -f "$DEM_RASTER" || {
            echo "ERROR: DEM raster not found: $DEM_RASTER"
            exit 1
          }

          test -f "$FUEL_EXCEL" || {
            echo "ERROR: Fuel Excel file not found: $FUEL_EXCEL"
            exit 1
          }

          echo "All input files exist."

      - name: Create output directory
        run: |
          mkdir -p "$OUTPUT_DIR"

      - name: Build FIRIS layers and FLI
        run: |
          python scripts/build_firis.py \
            --fwi-raster "$FWI_RASTER" \
            --fuel-raster "$FUEL_RASTER" \
            --dem-raster "$DEM_RASTER" \
            --fuel-excel "$FUEL_EXCEL" \
            --fuel-code-column "$FUEL_CODE_COLUMN" \
            --fuel-score-column "$FUEL_SCORE_COLUMN" \
            --output-dir "$OUTPUT_DIR" \
            --run-date "$FIRIS_DATE"

      - name: Verify generated output files
        run: |
          set -e

          echo "Generated output files:"
          ls -lh "$OUTPUT_DIR"

          test -f "$OUTPUT_DIR/f_fwi_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/f_fuel_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/slope_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/f_topo_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/fli_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/firis_report_${FIRIS_DATE}.json"

          echo "All expected FIRIS output files were created successfully."

      - name: Commit and push generated outputs
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs/

          if git diff --cached --quiet; then
            echo "No new output changes to commit."
            exit 0
          fi

          git commit -m "chore(firis): update FLI ${FIRIS_DATE} [skip ci]"

          # اگر در طول اجرا Commit جدیدی در main ثبت شده باشد،
          # Commit خروجی را روی آخرین وضعیت remote قرار می‌دهد.
          git pull --rebase origin main

          git push origin HEAD:main
