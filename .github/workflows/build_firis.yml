
name: Build FIRIS

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - ".github/workflows/build-firis.yml"

permissions:
  contents: write

jobs:
  build-firis:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            pillow


      # ============================================================
      # RUN DATE
      # ============================================================

      - name: Set run date
        shell: bash
        run: |
          set -euo pipefail

          RUN_DATE="$(date -u +%Y-%m-%d)"

          echo "RUN_DATE=${RUN_DATE}" >> "${GITHUB_ENV}"

          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"
          echo "Run date: ${RUN_DATE}"


      # ============================================================
      # INPUT FILES
      # ============================================================

      - name: Locate input rasters
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INPUT FILES"
          echo "============================================================"

          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"

          # IMPORTANT:
          # Use the original Fuel raster.
          # Alignment to the FWI grid is performed inside build_firis.py.
          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"

          DEM_RASTER="data/raw/topography/dem_fars.tif"

          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          echo "FWI_RASTER  = ${FWI_RASTER}"
          echo "FUEL_RASTER = ${FUEL_RASTER}"
          echo "DEM_RASTER  = ${DEM_RASTER}"
          echo "FUEL_EXCEL  = ${FUEL_EXCEL}"
          echo "BOUNDARY    = fars.geojson"

          if [ ! -f "${FWI_RASTER}" ]; then
            echo ""
            echo "ERROR: FWI raster not found:"
            echo "${FWI_RASTER}"
            exit 1
          fi

          if [ ! -f "${FUEL_RASTER}" ]; then
            echo ""
            echo "ERROR: RAW fuel raster not found:"
            echo "${FUEL_RASTER}"
            exit 1
          fi

          if [ ! -f "${DEM_RASTER}" ]; then
            echo ""
            echo "ERROR: DEM raster not found:"
            echo "${DEM_RASTER}"
            exit 1
          fi

          if [ ! -f "${FUEL_EXCEL}" ]; then
            echo ""
            echo "ERROR: Fuel Excel not found:"
            echo "${FUEL_EXCEL}"
            exit 1
          fi

          if [ ! -f "fars.geojson" ]; then
            echo ""
            echo "ERROR: Fars boundary not found:"
            echo "fars.geojson"
            exit 1
          fi

          echo ""
          echo "All input files found."


      # ============================================================
      # SOURCE RASTER INFORMATION
      # ============================================================

      - name: Inspect source rasters
        shell: bash
        run: |
          set -euo pipefail

          export FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"
          export FUEL_RASTER="data/raw/fuel/fars_fuel.tif"
          export DEM_RASTER="data/raw/topography/dem_fars.tif"

          python - <<'PY'
          import os
          import rasterio

          files = [
              ("FWI", os.environ["FWI_RASTER"]),
              ("Fuel", os.environ["FUEL_RASTER"]),
              ("DEM", os.environ["DEM_RASTER"]),
          ]

          print("")
          print("=" * 70)
          print("SOURCE RASTER INFORMATION")
          print("=" * 70)

          for name, path in files:

              print("")
              print(f"{name}: {path}")
              print("-" * 70)

              with rasterio.open(path) as src:

                  print("CRS        :", src.crs)
                  print("SIZE       :", src.width, "x", src.height)
                  print("CELL       :", src.res)
                  print("BOUNDS     :", src.bounds)
                  print("TRANSFORM  :", src.transform)
                  print("NODATA     :", src.nodata)

          print("")
          print("=" * 70)
          print("SOURCE RASTER INSPECTION COMPLETED")
          print("=" * 70)
          PY


      # ============================================================
      # RUN FIRIS
      # ============================================================

      - name: Run FIRIS
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"

          python scripts/build_firis.py \
            --fwi-raster "data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif" \
            --fuel-raster "data/raw/fuel/fars_fuel.tif" \
            --dem-raster "data/raw/topography/dem_fars.tif" \
            --fuel-excel "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "${RUN_DATE}"


      # ============================================================
      # BUILD WEB OUTPUT
      # ============================================================

      - name: Build web map
        shell: bash
        run: |
          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${RUN_DATE}.tif"

          if [ ! -f "${FLI_RASTER}" ]; then
            echo ""
            echo "ERROR: FLI output not found:"
            echo "${FLI_RASTER}"
            exit 1
          fi

          mkdir -p data/web

          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web"


      # ============================================================
      # FINAL GRID VALIDATION
      # ============================================================

      - name: Validate final FIRIS grids
        shell: bash
        run: |
          set -euo pipefail

          export FIRIS_DATE="${RUN_DATE}"

          python - <<'PY'
          import os
          import rasterio
          from pathlib import Path

          date = os.environ["FIRIS_DATE"]

          output_dir = Path("data/outputs")

          files = {
              "F_FWI":
                  output_dir / f"f_fwi_fars_{date}.tif",

              "F_Fuel":
                  output_dir / f"f_fuel_fars_{date}.tif",

              "Slope":
                  output_dir / f"slope_fars_{date}.tif",

              "F_Topo":
                  output_dir / f"f_topo_fars_{date}.tif",

              "FLI":
                  output_dir / f"fli_fars_{date}.tif",

              "FuelCoverage":
                  output_dir / f"fuel_coverage_fars_{date}.tif",
          }

          print("")
          print("=" * 70)
          print("FINAL FIRIS GRID VALIDATION")
          print("=" * 70)

          reference_path = files["F_FWI"]

          if not reference_path.exists():
              raise RuntimeError(
                  f"Reference raster not found: {reference_path}"
              )

          with rasterio.open(reference_path) as ref:

              ref_crs = ref.crs
              ref_width = ref.width
              ref_height = ref.height
              ref_transform = ref.transform
              ref_bounds = ref.bounds
              ref_res = ref.res

              print("")
              print("REFERENCE GRID = F_FWI")
              print("CRS       :", ref_crs)
              print("SIZE      :", ref_width, "x", ref_height)
              print("CELL      :", ref_res)
              print("BOUNDS    :", ref_bounds)
              print("TRANSFORM :", ref_transform)

          failures = []

          for name, path in files.items():

              if not path.exists():

                  failures.append(
                      f"{name}: FILE NOT FOUND"
                  )

                  continue

              with rasterio.open(path) as src:

                  problems = []

                  if src.crs != ref_crs:
                      problems.append("CRS")

                  if src.width != ref_width:
                      problems.append("WIDTH")

                  if src.height != ref_height:
                      problems.append("HEIGHT")

                  if not src.transform.almost_equals(
                      ref_transform,
                      precision=7
                  ):
                      problems.append("TRANSFORM")

                  if src.bounds != ref_bounds:
                      problems.append("BOUNDS")

                  if problems:

                      failures.append(
                          f"{name}: "
                          + ", ".join(problems)
                      )

                      print(
                          f"✗ {name:<16} "
                          f"GRID MISMATCH: "
                          f"{', '.join(problems)}"
                      )

                  else:

                      print(
                          f"✓ {name:<16} GRID MATCH"
                      )

          print("")

          if failures:

              print("GRID VALIDATION FAILED")

              for failure in failures:
                  print(" -", failure)

              raise SystemExit(1)

          print("✓ ALL FIRIS OUTPUTS MATCH THE FWI REFERENCE GRID")
          print("=" * 70)
          PY


      # ============================================================
      # SHOW OUTPUTS
      # ============================================================

      - name: Check outputs
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "OUTPUT FILES"
          echo "============================================================"

          find data/outputs \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "WEB FILES"

          find data/web \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs data/web

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit \
            -m "chore(firis): update FLI outputs [skip ci]"


      # ============================================================
      # SAFE PUSH
      # ============================================================

      - name: Push outputs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
