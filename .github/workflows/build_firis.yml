name: Build FIRIS Fire Risk Index

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/build_firis.py"
      - "data/raw/fwi/**"
      - "data/raw/fuel/**"
      - "data/raw/topography/**"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

jobs:
  build-firis:
    runs-on: ubuntu-latest

    env:
      # ورودی‌ها
      FWI_RASTER: data/raw/fwi/fwi_ecmwf_fars_2026-08-27.tif
      FUEL_RASTER: data/raw/fuel/fars_fuel.tif
      DEM_RASTER: data/raw/topography/dem_fars.tif
      FUEL_EXCEL: data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx

      # تنظیمات Fuel Mapping
      FUEL_SHEET: Fuelbeds_metric
      FUEL_CODE_COLUMN: JOIN_VALUE
      FUEL_SCORE_COLUMN: AUTO

      # خروجی‌ها
      OUTPUT_DIR: data/outputs

      # برای نام‌گذاری خروجی‌ها
      FIRIS_DATE: 2026-08-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              numpy \
              pandas \
              rasterio \
              openpyxl \
              scipy
          fi

      - name: Verify required input files
        run: |
          set -e

          echo "Checking FIRIS input files..."

          test -f "$FWI_RASTER" || {
            echo "ERROR: FWI raster not found: $FWI_RASTER"
            exit 1
          }

          test -f "$FUEL_RASTER" || {
            echo "ERROR: Fuel raster not found: $FUEL_RASTER"
            exit 1
          }

          test -f "$DEM_RASTER" || {
            echo "ERROR: DEM raster not found: $DEM_RASTER"
            exit 1
          }

          test -f "$FUEL_EXCEL" || {
            echo "ERROR: Fuel Excel file not found: $FUEL_EXCEL"
            exit 1
          }

          echo "All required input files exist."

      - name: Create output directory
        run: |
          mkdir -p "$OUTPUT_DIR"

      - name: Build FIRIS layers and FLI
        run: |
          python scripts/build_firis.py

      - name: Verify generated outputs
        run: |
          set -e

          echo "Files created in $OUTPUT_DIR:"
          ls -lh "$OUTPUT_DIR"

          test -f "$OUTPUT_DIR/f_fwi_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/f_fuel_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/slope_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/f_topo_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/fli_fars_${FIRIS_DATE}.tif"
          test -f "$OUTPUT_DIR/firis_report_${FIRIS_DATE}.json"

          echo "All expected FIRIS outputs were generated successfully."

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore(firis): update FLI ${FIRIS_DATE} [skip ci]"
            git push origin main
          fi
