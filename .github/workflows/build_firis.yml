name: Build FIRIS Fire Risk Map

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/inputs/**"
      - "Global_fuelbeds_parameters_v1.2.xlsx"
      - "requirements.txt"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build-main
  cancel-in-progress: false

jobs:
  build-firis:
    name: Build FIRIS outputs and web map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            echo "Installing dependencies from requirements.txt..."
            pip install -r requirements.txt
          else
            echo "requirements.txt was not found. Installing required packages directly..."
            pip install numpy pandas rasterio openpyxl
          fi

      - name: Show Python and package versions
        shell: bash
        run: |
          python --version
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import rasterio; print('rasterio:', rasterio.__version__)"

      - name: Build FIRIS FLI GeoTIFF and report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_firis.py

      - name: Build web PNG overlay and metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_web_map.py

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FIRIS calculation outputs ====="
          find data/outputs -maxdepth 1 -type f -printf "%f  %k KB\n" | sort || true

          echo ""
          echo "===== Web-map outputs ====="
          find docs/data -maxdepth 1 -type f -printf "%f  %k KB\n" | sort || true

          echo ""
          echo "===== Latest web metadata ====="
          if [ -f docs/data/fli_latest.json ]; then
            cat docs/data/fli_latest.json
          fi

      - name: Commit and push generated outputs safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs/ docs/data/

          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
            exit 0
          fi

          git commit -m "chore(firis): update FLI and web-map outputs [skip ci]"

          # تلاش مجدد برای جلوگیری از خطای rejected در Commitهای هم‌زمان
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5..."

            git fetch origin main

            # خروجی‌های تولیدی Workflow اولویت دارند.
            # اگر تعارضی رخ دهد، نسخهٔ Commit فعلی Workflow نگه داشته می‌شود.
            git rebase -X theirs origin/main || {
              echo "Rebase conflict detected. Aborting rebase."
              git rebase --abort || true
              echo "Waiting before retry..."
              sleep $((attempt * 5))
              continue
            }

            if git push origin HEAD:main; then
              echo "Generated outputs were pushed successfully."
              exit 0
            fi

            echo "Push was rejected. Waiting before retry..."
            sleep $((attempt * 5))
          done

          echo "ERROR: Could not push generated outputs after 5 attempts."
          exit 1
