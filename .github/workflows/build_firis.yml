name: Build FIRIS Fire Likelihood Index

on:
  workflow_dispatch:

  push:
    paths:
      - "data/raw/fwi/**"
      - "data/raw/fuel/**"
      - "data/raw/topography/**"
      - "scripts/build_firis.py"
      - "scripts/requirements.txt"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

jobs:
  build-firis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build FLI raster and metadata
        run: python scripts/build_firis.py

      - name: Commit generated FIRIS outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/firis data/processed/fli 2>/dev/null || true
          git add data/processed/*.tif data/processed/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No FIRIS output changes to commit."
          else
            git commit -m "chore: update FIRIS FLI outputs [skip ci]"
            git push
          fi
