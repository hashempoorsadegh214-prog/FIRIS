name: FIRIS Build Pipeline

on:
  schedule:
    # ساعت ۲۱:۱۵ UTC (ساعت ۰۰:۴۵ بامداد به وقت ایران)
    - cron: '15 21 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Update FWI Data"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build FLI
        run: python scripts/build_fli.py

      - name: Build Report
        run: python scripts/build_report.py

      - name: Build Web Map
        run: |
          python scripts/build_web_map.py --input output/firis_latest.geojson --output-dir docs/ --archive-dir docs/archive/

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update FIRIS data, reports and web map [skip ci]"
            git push
          fi
