
name: Build FIRIS Fire Risk Map

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "Global_fuelbeds_parameters_v1.2.xlsx"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build-main
  cancel-in-progress: false

jobs:

  build-firis:

    name: Build FIRIS FLI
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            rasterio \
            openpyxl \
            pillow


      # ======================================================
      # SHOW INPUTS
      # ======================================================

      - name: Show available input files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RASTER INPUTS"
          echo "============================================================"

          find data/raw \
            -type f \
            \( -iname "*.tif" -o -iname "*.tiff" \) \
            | sort || true

          echo ""

          echo "============================================================"
          echo "EXCEL INPUTS"
          echo "============================================================"

          find . \
            -type f \
            \( -iname "*.xlsx" -o -iname "*.xls" \) \
            | sort || true


      # ======================================================
      # LOCATE INPUTS
      # ======================================================

      - name: Locate FIRIS input files
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIR="data/raw"

          find_single_raster() {

            local label="$1"
            local pattern="$2"

            mapfile -t matches < <(
              find "${SEARCH_DIR}" \
                -type f \
                \( -iname "*.tif" -o -iname "*.tiff" \) \
                -iname "${pattern}" \
                | sort
            )

            if [ "${#matches[@]}" -eq 0 ]; then

              echo "ERROR:"
              echo "No raster found for ${label}"
              echo "Pattern: ${pattern}"

              exit 1
            fi

            if [ "${#matches[@]}" -gt 1 ]; then

              echo "ERROR:"
              echo "More than one raster found for ${label}:"

              printf ' - %s\n' "${matches[@]}"

              echo ""
              echo "Please keep exactly one matching input."

              exit 1
            fi

            echo "${matches[0]}"
          }


          FWI_RASTER="$(
            find_single_raster \
              "FWI" \
              "*fwi*.tif"
          )"


          FUEL_RASTER="$(
            find_single_raster \
              "Fuel" \
              "*fuel*.tif"
          )"


          DEM_RASTER="$(
            find_single_raster \
              "DEM" \
              "*dem*.tif"
          )"


          FUEL_EXCEL="Global_fuelbeds_parameters_v1.2.xlsx"


          if [ ! -f "${FUEL_EXCEL}" ]; then

            echo "ERROR:"
            echo "Fuel Excel not found:"
            echo "${FUEL_EXCEL}"

            exit 1

          fi


          echo ""
          echo "============================================================"
          echo "SELECTED INPUTS"
          echo "============================================================"

          echo "FWI : ${FWI_RASTER}"
          echo "Fuel: ${FUEL_RASTER}"
          echo "DEM : ${DEM_RASTER}"
          echo "Excel: ${FUEL_EXCEL}"


          echo "FWI_RASTER=${FWI_RASTER}" >> "${GITHUB_ENV}"
          echo "FUEL_RASTER=${FUEL_RASTER}" >> "${GITHUB_ENV}"
          echo "DEM_RASTER=${DEM_RASTER}" >> "${GITHUB_ENV}"
          echo "FUEL_EXCEL=${FUEL_EXCEL}" >> "${GITHUB_ENV}"


      # ======================================================
      # INPUT INSPECTION
      # ======================================================

      - name: Inspect raster metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'

          import os
          import rasterio

          files = {
              "FWI": os.environ["FWI_RASTER"],
              "Fuel": os.environ["FUEL_RASTER"],
              "DEM": os.environ["DEM_RASTER"],
          }

          print("")
          print("=" * 70)
          print("INPUT RASTER METADATA")
          print("=" * 70)

          for name, path in files.items():

              with rasterio.open(path) as src:

                  print("")
                  print(f"[{name}]")
                  print(f"Path       : {path}")
                  print(f"CRS        : {src.crs}")
                  print(f"Width      : {src.width}")
                  print(f"Height     : {src.height}")
                  print(
                      "Resolution : "
                      f"{src.res}"
                  )
                  print(
                      "Bounds     : "
                      f"{src.bounds}"
                  )
                  print(
                      "NoData     : "
                      f"{src.nodata}"
                  )
                  print(
                      "Dtype      : "
                      f"{src.dtypes[0]}"
                  )

          PY


      # ======================================================
      # BUILD FIRIS
      # ======================================================

      - name: Build FIRIS FLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/outputs

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          echo "Run date: ${RUN_DATE}"

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --fuel-code-column "JOIN_VALUE" \
            --fuel-score-column "AUTO" \
            --output-dir "data/outputs" \
            --run-date "${RUN_DATE}"


      # ======================================================
      # BUILD WEB MAP
      # ======================================================

      - name: Build web PNG overlay and metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/web

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          python scripts/build_web_map.py \
            --input "data/outputs/fli_fars_${RUN_DATE}.tif" \
            --output-dir "data/web"


      # ======================================================
      # SHOW OUTPUTS
      # ======================================================

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "FIRIS OUTPUTS"
          echo "============================================================"

          find data/outputs \
            -maxdepth 1 \
            -type f \
            -printf "%f %k KB\n" \
            | sort


          echo ""
          echo "============================================================"
          echo "WEB OUTPUTS"
          echo "============================================================"

          find data/web \
            -maxdepth 1 \
            -type f \
            -printf "%f %k KB\n" \
            | sort


          echo ""
          echo "============================================================"
          echo "FIRIS REPORT"
          echo "============================================================"

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          cat \
            "data/outputs/firis_report_${RUN_DATE}.json"


      # ======================================================
      # COMMIT OUTPUTS
      # ======================================================

      - name: Commit and push generated outputs
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/outputs/ \
            data/web/


          if git diff --cached --quiet; then

            echo "No generated-file changes."

            exit 0

          fi


          git commit \
            -m "chore(firis): update FLI outputs [skip ci]"


          git push origin HEAD:main
