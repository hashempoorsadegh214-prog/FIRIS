
name: Build FIRIS

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - ".github/workflows/build-firis.yml"

permissions:
  contents: write

jobs:
  build-firis:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            pillow


      # ============================================================
      # RUN DATE
      # ============================================================

      - name: Set run date
        shell: bash
        run: |
          set -euo pipefail

          RUN_DATE="$(date -u +%Y-%m-%d)"

          echo "RUN_DATE=${RUN_DATE}" >> "${GITHUB_ENV}"

          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"
          echo "Run date: ${RUN_DATE}"


      # ============================================================
      # INPUT FILES
      # ============================================================

      - name: Locate input rasters
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INPUT FILES"
          echo "============================================================"

          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"

          FUEL_RASTER="data/raw/fuel/fars_fuel_aligned.tif"

          DEM_RASTER="data/raw/topography/dem_fars.tif"

          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          echo "FWI_RASTER  = ${FWI_RASTER}"
          echo "FUEL_RASTER = ${FUEL_RASTER}"
          echo "DEM_RASTER  = ${DEM_RASTER}"
          echo "FUEL_EXCEL  = ${FUEL_EXCEL}"

          if [ ! -f "${FWI_RASTER}" ]; then
            echo ""
            echo "ERROR: FWI raster not found:"
            echo "${FWI_RASTER}"
            exit 1
          fi

          if [ ! -f "${FUEL_RASTER}" ]; then
            echo ""
            echo "ERROR: ALIGNED fuel raster not found:"
            echo "${FUEL_RASTER}"
            echo ""
            echo "Expected file:"
            echo "data/raw/fuel/fars_fuel_aligned.tif"
            exit 1
          fi

          if [ ! -f "${DEM_RASTER}" ]; then
            echo ""
            echo "ERROR: DEM raster not found:"
            echo "${DEM_RASTER}"
            exit 1
          fi

          if [ ! -f "${FUEL_EXCEL}" ]; then
            echo ""
            echo "ERROR: Fuel Excel not found:"
            echo "${FUEL_EXCEL}"
            exit 1
          fi

          echo ""
          echo "All input files found."


      # ============================================================
      # VERIFY RASTER GEOMETRY
      # ============================================================

      - name: Verify raster alignment
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import rasterio

          fwi = "data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"
          fuel = "data/raw/fuel/fars_fuel_aligned.tif"

          print("")
          print("============================================================")
          print("VERIFYING FWI / FUEL GRID")
          print("============================================================")

          with rasterio.open(fwi) as a:
              print("")
              print("FWI")
              print("CRS      :", a.crs)
              print("SIZE     :", a.width, "x", a.height)
              print("CELL     :", a.res)
              print("BOUNDS   :", a.bounds)
              print("TRANSFORM:", a.transform)

          with rasterio.open(fuel) as b:
              print("")
              print("FUEL")
              print("CRS      :", b.crs)
              print("SIZE     :", b.width, "x", b.height)
              print("CELL     :", b.res)
              print("BOUNDS   :", b.bounds)
              print("TRANSFORM:", b.transform)

          with rasterio.open(fwi) as a, rasterio.open(fuel) as b:

              if a.crs != b.crs:
                  raise RuntimeError(
                      "ERROR: FWI and Fuel CRS are different."
                  )

              if a.width != b.width or a.height != b.height:
                  raise RuntimeError(
                      "ERROR: FWI and Fuel dimensions are different."
                  )

              if abs(a.res[0] - b.res[0]) > 1e-9:
                  raise RuntimeError(
                      "ERROR: FWI and Fuel cell sizes are different."
                  )

              if abs(a.res[1] - b.res[1]) > 1e-9:
                  raise RuntimeError(
                      "ERROR: FWI and Fuel cell sizes are different."
                  )

              if not a.transform.almost_equals(
                  b.transform,
                  precision=7
              ):
                  raise RuntimeError(
                      "ERROR: FWI and Fuel grids are not aligned."
                  )

          print("")
          print("FWI and Fuel grids are aligned.")
          PY


      # ============================================================
      # RUN FIRIS
      # ============================================================

      - name: Run FIRIS
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"

          python scripts/build_firis.py \
            --fwi-raster "data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif" \
            --fuel-raster "data/raw/fuel/fars_fuel_aligned.tif" \
            --dem-raster "data/raw/topography/dem_fars.tif" \
            --fuel-excel "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx" \
            --output-dir "data/outputs" \
            --run-date "${RUN_DATE}"


      # ============================================================
      # BUILD WEB OUTPUT
      # ============================================================

      - name: Build web map
        shell: bash
        run: |
          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${RUN_DATE}.tif"

          if [ ! -f "${FLI_RASTER}" ]; then
            echo "ERROR: FLI output not found:"
            echo "${FLI_RASTER}"
            exit 1
          fi

          mkdir -p data/web

          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web"


      # ============================================================
      # SHOW OUTPUTS
      # ============================================================

      - name: Check outputs
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "OUTPUT FILES"
          echo "============================================================"

          find data/outputs -maxdepth 1 -type f -print | sort

          echo ""
          echo "WEB FILES"

          find data/web -maxdepth 1 -type f -print | sort


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs data/web

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit \
            -m "chore(firis): update FLI outputs [skip ci]"


      # ============================================================
      # SAFE PUSH
      # ============================================================

      - name: Push outputs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
