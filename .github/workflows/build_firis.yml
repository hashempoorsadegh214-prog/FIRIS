name: Build FIRIS

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - "protected_areas.geojson"
      - "hunting_banned.geojson"
      - "index.html"
      - "logo.webp"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build
  cancel-in-progress: true

jobs:

  build-firis:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            pillow


      # ========================================================
      # DETECT FWI FORECAST
      # ========================================================

      - name: Detect forecast FWI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime

          directory = Path("data/raw/fwi")

          if not directory.is_dir():
              raise SystemExit(
                  "ERROR: data/raw/fwi directory not found."
              )

          metadata_files = sorted(
              directory.glob("fwi_ecmwf_fars_*.json")
          )

          if not metadata_files:
              raise SystemExit(
                  "ERROR: No FWI metadata files found."
              )

          candidates = []

          for path in metadata_files:

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      metadata = json.load(file)

                  target_date = (
                      metadata.get("target_date")
                      or metadata.get("forecast_date")
                  )

                  raster_name = metadata.get(
                      "output_file"
                  )

                  if not raster_name:
                      raster_name = (
                          path.stem + ".tif"
                      )

                  if not target_date:
                      continue

                  try:
                      datetime.strptime(
                          str(target_date),
                          "%Y-%m-%d"
                      )
                  except ValueError:
                      print(
                          f"WARNING: Invalid date in {path}: "
                          f"{target_date}"
                      )
                      continue

                  raster_path = (
                      directory / str(raster_name)
                  )

                  if not raster_path.is_file():

                      alternative = Path(
                          str(raster_name)
                      )

                      if alternative.is_file():
                          raster_path = alternative
                      else:
                          print(
                              "WARNING: FWI raster not found "
                              f"for {path}: {raster_path}"
                          )
                          continue

                  candidates.append(
                      (
                          str(target_date),
                          raster_path,
                          path
                      )
                  )

              except Exception as error:

                  print(
                      f"WARNING: Could not read "
                      f"{path}: {error}"
                  )

          if not candidates:
              raise SystemExit(
                  "ERROR: No valid FWI metadata with "
                  "target_date or forecast_date found."
              )

          candidates.sort(
              key=lambda item: item[0]
          )

          forecast_date, raster_path, metadata_path = (
              candidates[-1]
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"FWI_DATE={forecast_date}\n"
              )

              env.write(
                  f"FWI_RASTER={raster_path}\n"
              )

          print("")
          print("=" * 70)
          print("FORECAST FWI DETECTION")
          print("=" * 70)
          print("")
          print("Metadata file :", metadata_path)
          print("Forecast date :", forecast_date)
          print("FWI raster    :", raster_path)
          print("")
          print("✓ Forecast FWI selected successfully.")
          PY


      # ========================================================
      # DEFINE INPUT FILES
      # ========================================================

      - name: Define input files
        shell: bash
        run: |
          set -euo pipefail

          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"
          DEM_RASTER="data/raw/topography/dem_fars.tif"
          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          echo "FUEL_RASTER=${FUEL_RASTER}" >> "${GITHUB_ENV}"
          echo "DEM_RASTER=${DEM_RASTER}" >> "${GITHUB_ENV}"
          echo "FUEL_EXCEL=${FUEL_EXCEL}" >> "${GITHUB_ENV}"


      # ========================================================
      # CHECK INPUTS
      # ========================================================

      - name: Check input files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "${FWI_RASTER}"
            "${FUEL_RASTER}"
            "${DEM_RASTER}"
            "${FUEL_EXCEL}"
            "fars.geojson"
          )

          echo ""
          echo "============================================================"
          echo "CHECKING INPUT FILES"
          echo "============================================================"

          for file in "${required_files[@]}"; do

            if [ ! -f "${file}" ]; then

              echo ""
              echo "ERROR: Required file not found:"
              echo "${file}"

              exit 1
            fi

            echo "✓ ${file}"

          done

          echo ""
          echo "All required files found."


      # ========================================================
      # INSPECT FWI
      # ========================================================

      - name: Inspect selected FWI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import rasterio

          path = os.environ["FWI_RASTER"]
          date = os.environ["FWI_DATE"]

          print("")
          print("=" * 70)
          print("SELECTED FORECAST FWI")
          print("=" * 70)

          print("Forecast date:", date)
          print("File:", path)

          with rasterio.open(path) as src:

              print("CRS:", src.crs)

              print(
                  "Size:",
                  src.width,
                  "x",
                  src.height
              )

              print(
                  "Resolution:",
                  src.res
              )

              print(
                  "Bounds:",
                  src.bounds
              )

              if src.crs is None:
                  raise RuntimeError(
                      "FWI raster has no CRS."
                  )

              if src.crs.to_epsg() != 4326:
                  raise RuntimeError(
                      "FWI raster must be EPSG:4326."
                  )
          PY


      # ========================================================
      # OUTPUT DIRECTORIES
      # ========================================================

      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/outputs
          mkdir -p data/web
          mkdir -p data/report


      # ========================================================
      # CONTROL POINTS
      # ========================================================

      - name: Check Fars control points
        shell: bash
        run: |
          set -euo pipefail

          python scripts/check_control_points.py \
            --raster "${FWI_RASTER}" \
            --boundary "fars.geojson" \
            --output \
              "data/outputs/control_points_${FWI_DATE}.json"


      # ========================================================
      # RUN FIRIS
      # ========================================================

      - name: Run FIRIS
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "BUILDING FIRIS"
          echo "============================================================"

          echo ""
          echo "Forecast date:"
          echo "${FWI_DATE}"

          echo ""
          echo "FWI raster:"
          echo "${FWI_RASTER}"

          echo ""

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "${FWI_DATE}"


      # ========================================================
      # VERIFY FLI
      # ========================================================

      - name: Verify FLI output
        shell: bash
        run: |
          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          if [ ! -f "${FLI_RASTER}" ]; then

            echo ""
            echo "ERROR: FLI output not found:"
            echo "${FLI_RASTER}"

            exit 1
          fi

          echo ""
          echo "✓ FLI output exists:"
          echo "${FLI_RASTER}"


      # ========================================================
      # BUILD WEB MAP
      # ========================================================

      - name: Build web map
        shell: bash
        run: |
          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          if [ ! -f "${FLI_RASTER}" ]; then

            echo ""
            echo "ERROR: FLI raster not found:"
            echo "${FLI_RASTER}"

            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "BUILDING WEB MAP"
          echo "============================================================"

          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web" \
            --boundary "fars.geojson"


      # ========================================================
      # BUILD EXCEL REPORT
      # ========================================================

      - name: Build Excel report
        shell: bash
        run: |
          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"
          REPORT_FILE="data/report/firis_report.xlsx"

          if [ ! -f "${FLI_RASTER}" ]; then

            echo ""
            echo "ERROR: FLI raster not found:"
            echo "${FLI_RASTER}"

            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "BUILDING EXCEL REPORT"
          echo "============================================================"

          python scripts/build_report.py \
            --input "${FLI_RASTER}" \
            --output "${REPORT_FILE}" \
            --run-date "${FWI_DATE}"

          if [ ! -f "${REPORT_FILE}" ]; then

            echo ""
            echo "ERROR: Excel report was not created:"
            echo "${REPORT_FILE}"

            exit 1
          fi

          echo ""
          echo "✓ Excel report created:"
          echo "${REPORT_FILE}"


      # ========================================================
      # VERIFY WEB OUTPUTS
      # ========================================================

      - name: Verify web outputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "data/web/fli_polygons.geojson"
            "data/web/fli_latest.json"
            "data/web/fli_latest_grid.json"
            "data/web/fli_latest.png"
            "data/report/firis_report.xlsx"
          )

          echo ""
          echo "============================================================"
          echo "VERIFYING WEB OUTPUTS"
          echo "============================================================"

          for file in "${required_files[@]}"; do

            if [ ! -f "${file}" ]; then

              echo ""
              echo "ERROR: Missing output:"
              echo "${file}"

              exit 1
            fi

            echo "✓ ${file}"

          done


      # ========================================================
      # VERIFY FORECAST DATE
      # ========================================================

      - name: Verify web forecast date
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          expected = os.environ["FWI_DATE"]

          path = "data/web/fli_latest.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          actual = (
              metadata.get("forecast_date")
              or metadata.get("target_date")
          )

          print("")
          print("=" * 70)
          print("WEB FORECAST DATE VALIDATION")
          print("=" * 70)

          print("Expected:", expected)
          print("Actual  :", actual)

          if actual != expected:

              raise SystemExit(
                  "ERROR: Web forecast date does not "
                  "match FWI forecast date."
              )

          print("")
          print(
              "✓ Web forecast date is correct."
          )
          PY


      # ========================================================
      # VALIDATE FINAL GRID
      # ========================================================

      - name: Validate final FIRIS grids
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          import numpy as np
          import rasterio


          date = os.environ["FWI_DATE"]

          directory = Path(
              "data/outputs"
          )


          files = {

              "F_FWI":
                  directory /
                  f"f_fwi_fars_{date}.tif",

              "F_Fuel":
                  directory /
                  f"f_fuel_fars_{date}.tif",

              "Slope":
                  directory /
                  f"slope_fars_{date}.tif",

              "F_Topo":
                  directory /
                  f"f_topo_fars_{date}.tif",

              "FLI":
                  directory /
                  f"fli_fars_{date}.tif",

              "FuelCoverage":
                  directory /
                  f"fuel_coverage_fars_{date}.tif"

          }


          reference_path = files[
              "F_FWI"
          ]


          if not reference_path.exists():

              raise SystemExit(
                  f"Reference F_FWI not found: "
                  f"{reference_path}"
              )


          with rasterio.open(
              reference_path
          ) as ref:

              ref_crs = ref.crs

              ref_width = ref.width

              ref_height = ref.height

              ref_res = np.array(
                  ref.res,
                  dtype=np.float64
              )

              ref_bounds = np.array(

                  [
                      ref.bounds.left,
                      ref.bounds.bottom,
                      ref.bounds.right,
                      ref.bounds.top
                  ],

                  dtype=np.float64
              )

              ref_transform = np.array(

                  [
                      ref.transform.a,
                      ref.transform.b,
                      ref.transform.c,
                      ref.transform.d,
                      ref.transform.e,
                      ref.transform.f
                  ],

                  dtype=np.float64
              )


          tolerance = 1e-8

          failures = []


          print("")
          print("=" * 70)
          print("FINAL GRID VALIDATION")
          print("=" * 70)

          print("")
          print("REFERENCE = F_FWI")
          print("CRS       :", ref_crs)
          print(
              "SIZE      :",
              ref_width,
              "x",
              ref_height
          )
          print(
              "RES       :",
              tuple(ref_res)
          )
          print(
              "BOUNDS    :",
              tuple(ref_bounds)
          )


          for name, path in files.items():

              if not path.exists():

                  print(
                      f"✗ {name:<16} FILE NOT FOUND"
                  )

                  failures.append(
                      f"{name}: FILE NOT FOUND"
                  )

                  continue


              with rasterio.open(
                  path
              ) as src:

                  problems = []


                  if src.crs != ref_crs:

                      problems.append(
                          "CRS"
                      )


                  if src.width != ref_width:

                      problems.append(
                          "WIDTH"
                      )


                  if src.height != ref_height:

                      problems.append(
                          "HEIGHT"
                      )


                  src_res = np.array(
                      src.res,
                      dtype=np.float64
                  )


                  if not np.allclose(

                      src_res,
                      ref_res,
                      rtol=0.0,
                      atol=tolerance

                  ):

                      problems.append(
                          "RESOLUTION"
                      )


                  src_transform = np.array(

                      [
                          src.transform.a,
                          src.transform.b,
                          src.transform.c,
                          src.transform.d,
                          src.transform.e,
                          src.transform.f
                      ],

                      dtype=np.float64
                  )


                  if not np.allclose(

                      src_transform,
                      ref_transform,
                      rtol=0.0,
                      atol=tolerance

                  ):

                      problems.append(
                          "TRANSFORM"
                      )


                  src_bounds = np.array(

                      [
                          src.bounds.left,
                          src.bounds.bottom,
                          src.bounds.right,
                          src.bounds.top
                      ],

                      dtype=np.float64
                  )


                  if not np.allclose(

                      src_bounds,
                      ref_bounds,
                      rtol=0.0,
                      atol=tolerance

                  ):

                      problems.append(
                          "BOUNDS"
                      )


                  if problems:

                      print(
                          f"✗ {name:<16}"
                          f"GRID MISMATCH: "
                          + ", ".join(
                              problems
                          )
                      )

                      failures.append(
                          f"{name}: "
                          + ", ".join(
                              problems
                          )
                      )

                  else:

                      print(
                          f"✓ {name:<16}"
                          f"GRID MATCH"
                      )


          print("")


          if failures:

              print(
                  "GRID VALIDATION FAILED"
              )

              print("")

              for failure in failures:

                  print(
                      " -",
                      failure
                  )

              raise SystemExit(1)


          print(
              "✓ ALL OUTPUT RASTERS MATCH "
              "THE FWI REFERENCE GRID"
          )

          PY


      # ========================================================
      # SHOW FINAL FORECAST
      # ========================================================

      - name: Show final forecast information
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          date = os.environ[
              "FWI_DATE"
          ]

          fwi_path = (
              f"data/raw/fwi/"
              f"fwi_ecmwf_fars_{date}.json"
          )

          web_path = (
              "data/web/fli_latest.json"
          )


          with open(
              fwi_path,
              "r",
              encoding="utf-8"
          ) as file:

              fwi = json.load(file)


          with open(
              web_path,
              "r",
              encoding="utf-8"
          ) as file:

              web = json.load(file)


          fwi_date = (
              fwi.get("target_date")
              or fwi.get("forecast_date")
          )

          web_date = (
              web.get("forecast_date")
              or web.get("target_date")
          )


          print("")
          print("=" * 70)
          print("FINAL FIRIS FORECAST")
          print("=" * 70)

          print("")
          print(
              "FWI target date :",
              fwi_date
          )

          print(
              "FLI target date :",
              web_date
          )

          print(
              "Web layer       :",
              web.get(
                  "primary_web_layer"
              )
          )

          if fwi_date != web_date:

              raise SystemExit(
                  "ERROR: FWI and FLI forecast dates "
                  "are not synchronized."
              )

          print("")
          print(
              "✓ FWI → FLI → Web dates are synchronized."
          )

          PY


      # ========================================================
      # LIST OUTPUTS
      # ========================================================

      - name: List outputs
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "OUTPUT FILES"
          echo "============================================================"

          find data/outputs \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "WEB FILES"

          find data/web \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "REPORT FILES"

          find data/report \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ========================================================
      # COMMIT
      # ========================================================

      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/outputs \
            data/web \
            data/report


          if git diff --cached --quiet; then

            echo ""
            echo "No output changes to commit."

            exit 0
          fi


          git commit \
            -m \
            "chore(firis): update tomorrow forecast outputs [skip ci]"


      # ========================================================
      # PUSH
      # ========================================================

      - name: Push outputs
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "============================================================"
          echo "FIRIS BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"

          echo ""
          echo "Forecast date:"
          echo "${FWI_DATE}"
