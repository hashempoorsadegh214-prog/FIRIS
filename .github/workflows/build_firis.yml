name: FIRIS

on:
  workflow_run:
    workflows: ["Update FWI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build FLI
        run: |
          if [ -f scripts/build_fli.py ]; then
            python scripts/build_fli.py
          elif [ -f build_fli.py ]; then
            python build_fli.py
          else
            echo "build_fli.py not found!" && exit 1
          fi

      - name: Build Web Map
        run: |
          if [ -f scripts/build_web_map.py ]; then
            python scripts/build_web_map.py
          elif [ -f build_web_map.py ]; then
            python build_web_map.py
          else
            echo "build_web_map.py not found!" && exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FIRIS maps and data" && git push)
