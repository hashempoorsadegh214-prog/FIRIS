```yaml
name: Build FIRIS

on:

  workflow_dispatch:

  # ============================================================
  # RUN AFTER FWI WORKFLOW
  # ============================================================

  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed

  # ============================================================
  # MANUAL / CODE CHANGES
  # ============================================================

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - "protected_areas.geojson"
      - "hunting_banned.geojson"
      - "index.html"
      - "logo.webp"
      - ".github/workflows/build_firis.yml"


permissions:
  contents: write


concurrency:
  group: firis-build
  cancel-in-progress: true


jobs:

  build-firis:

    # ==========================================================
    # IMPORTANT
    #
    # workflow_run:
    # only run FIRIS when FWI workflow succeeded.
    #
    # workflow_dispatch / push:
    # always allowed.
    # ==========================================================

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'


    runs-on: ubuntu-latest


    timeout-minutes: 45


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            pillow


      # ========================================================
      # DETECT FWI
      # ========================================================

      - name: Detect forecast FWI
        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os

          from datetime import datetime
          from pathlib import Path


          directory = Path(
              "data/raw/fwi"
          )


          if not directory.is_dir():

              raise SystemExit(
                  "ERROR: data/raw/fwi directory not found."
              )


          metadata_files = sorted(
              directory.glob(
                  "fwi_ecmwf_fars_*.json"
              )
          )


          if not metadata_files:

              raise SystemExit(
                  "ERROR: No FWI metadata files found."
              )


          candidates = []


          for metadata_path in metadata_files:

              try:

                  with metadata_path.open(
                      "r",
                      encoding="utf-8"
                  ) as file:

                      metadata = json.load(
                          file
                      )


                  forecast_date = (

                      metadata.get(
                          "target_date"
                      )

                      or

                      metadata.get(
                          "forecast_date"
                      )
                  )


                  if not forecast_date:

                      continue


                  try:

                      datetime.strptime(
                          str(forecast_date),
                          "%Y-%m-%d"
                      )

                  except ValueError:

                      print(
                          "WARNING: Invalid forecast date:",
                          metadata_path,
                          forecast_date
                      )

                      continue


                  raster_name = (
                      metadata.get(
                          "output_file"
                      )
                  )


                  if not raster_name:

                      raster_name = (
                          metadata_path.stem
                          +
                          ".tif"
                      )


                  raster_path = (
                      directory
                      /
                      str(raster_name)
                  )


                  if not raster_path.is_file():

                      alternative = Path(
                          str(raster_name)
                      )


                      if alternative.is_file():

                          raster_path = alternative

                      else:

                          print(
                              "WARNING: FWI raster not found:",
                              raster_path
                          )

                          continue


                  candidates.append(
                      (
                          str(forecast_date),
                          raster_path,
                          metadata_path
                      )
                  )


              except Exception as error:

                  print(
                      "WARNING: Could not read:",
                      metadata_path
                  )

                  print(
                      error
                  )


          if not candidates:

              raise SystemExit(
                  "ERROR: No valid FWI metadata with "
                  "target_date or forecast_date found."
              )


          candidates.sort(
              key=lambda item: item[0]
          )


          forecast_date, raster_path, metadata_path = (
              candidates[-1]
          )


          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"FWI_DATE={forecast_date}\n"
              )

              env.write(
                  f"FWI_RASTER={raster_path}\n"
              )


          print("")

          print("=" * 70)
          print("FORECAST FWI DETECTION")
          print("=" * 70)

          print("")

          print(
              "Metadata file :",
              metadata_path
          )

          print(
              "Forecast date :",
              forecast_date
          )

          print(
              "FWI raster    :",
              raster_path
          )

          print("")

          print(
              "✓ Forecast FWI selected successfully."
          )

          PY


      # ========================================================
      # INPUT PATHS
      # ========================================================

      - name: Define input files
        shell: bash

        run: |

          set -euo pipefail


          FUEL_RASTER=\
          "data/raw/fuel/fars_fuel.tif"


          DEM_RASTER=\
          "data/raw/topography/dem_fars.tif"


          FUEL_EXCEL=\
          "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"


          echo \
            "FUEL_RASTER=${FUEL_RASTER}" \
            >> "${GITHUB_ENV}"


          echo \
            "DEM_RASTER=${DEM_RASTER}" \
            >> "${GITHUB_ENV}"


          echo \
            "FUEL_EXCEL=${FUEL_EXCEL}" \
            >> "${GITHUB_ENV}"


      # ========================================================
      # CHECK INPUT FILES
      # ========================================================

      - name: Check input files
        shell: bash

        run: |

          set -euo pipefail


          required_files=(

            "${FWI_RASTER}"

            "${FUEL_RASTER}"

            "${DEM_RASTER}"

            "${FUEL_EXCEL}"

            "fars.geojson"

            "protected_areas.geojson"

            "hunting_banned.geojson"

          )


          echo ""

          echo "============================================================"
          echo "CHECKING INPUT FILES"
          echo "============================================================"


          for file in "${required_files[@]}"; do


            if [ ! -f "${file}" ]; then

              echo ""

              echo "ERROR:"
              echo "Required file not found:"
              echo "${file}"

              exit 1

            fi


            echo "✓ ${file}"


          done


          echo ""

          echo "All required input files found."


      # ========================================================
      # INSPECT FWI
      # ========================================================

      - name: Inspect selected FWI
        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import os
          import rasterio


          path = os.environ[
              "FWI_RASTER"
          ]


          date = os.environ[
              "FWI_DATE"
          ]


          print("")

          print("=" * 70)
          print("SELECTED FORECAST FWI")
          print("=" * 70)


          print("")

          print(
              "Forecast date:",
              date
          )


          print(
              "File:",
              path
          )


          with rasterio.open(
              path
          ) as src:


              print(
                  "CRS:",
                  src.crs
              )


              print(
                  "Size:",
                  src.width,
                  "x",
                  src.height
              )


              print(
                  "Resolution:",
                  src.res
              )


              print(
                  "Bounds:",
                  src.bounds
              )


              if src.crs is None:

                  raise RuntimeError(
                      "FWI raster has no CRS."
                  )


              if src.crs.to_epsg() != 4326:

                  raise RuntimeError(
                      "FWI raster must be EPSG:4326."
                  )

          PY


      # ========================================================
      # OUTPUT DIRECTORIES
      # ========================================================

      - name: Prepare output directories
        shell: bash

        run: |

          set -euo pipefail


          mkdir -p data/outputs
          mkdir -p data/web
          mkdir -p data/report


      # ========================================================
      # CONTROL POINTS
      # ========================================================

      - name: Check Fars control points
        shell: bash

        run: |

          set -euo pipefail


          if [ ! -f \
            "scripts/check_control_points.py"
          ]; then

            echo ""
            echo "WARNING:"
            echo "check_control_points.py not found."
            echo "Control-point validation skipped."
            echo ""

            exit 0

          fi


          python \
            scripts/check_control_points.py \
            --raster "${FWI_RASTER}" \
            --boundary "fars.geojson" \
            --output \
              "data/outputs/control_points_${FWI_DATE}.json"


      # ========================================================
      # RUN FIRIS
      #
      # IMPORTANT:
      #
      # build_firis.py is NOT modified here.
      #
      # Therefore:
      #
      # FLI formula remains:
      #
      # 100 *
      # (
      #   0.45 * F_FWI
      #   +
      #   0.35 * F_Fuel
      #   +
      #   0.20 * F_Topo
      # )
      #
      # The existing fars.geojson boundary handling
      # remains inside build_firis.py.
      # ========================================================

      - name: Run FIRIS
        shell: bash

        run: |

          set -euo pipefail


          echo ""

          echo "============================================================"
          echo "BUILDING FIRIS"
          echo "============================================================"


          echo ""

          echo "Forecast date:"
          echo "${FWI_DATE}"


          echo ""

          echo "FWI raster:"
          echo "${FWI_RASTER}"


          echo ""

          echo "Boundary:"
          echo "fars.geojson"


          echo ""


          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "${FWI_DATE}"


      # ========================================================
      # VERIFY FLI
      # ========================================================

      - name: Verify FLI output
        shell: bash

        run: |

          set -euo pipefail


          FLI_RASTER=\
          "data/outputs/fli_fars_${FWI_DATE}.tif"


          if [ ! -f "${FLI_RASTER}" ]; then

            echo ""

            echo "ERROR:"
            echo "FLI output not found:"

            echo "${FLI_RASTER}"

            echo ""

            echo "Available FLI files:"

            find data \
              -type f \
              -name "fli*.tif" \
              -print \
              | sort

            exit 1

          fi


          echo ""

          echo "✓ FLI output exists:"
          echo "${FLI_RASTER}"


      # ========================================================
      # BUILD WEB MAP
      # ========================================================

      - name: Build web map
        shell: bash

        run: |

          set -euo pipefail


          FLI_RASTER=\
          "data/outputs/fli_fars_${FWI_DATE}.tif"


          echo ""

          echo "============================================================"
          echo "BUILDING WEB MAP"
          echo "============================================================"


          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web" \
            --boundary "fars.geojson"


      # ========================================================
      # BUILD EXCEL REPORT
      # ========================================================

      - name: Build detailed Excel report
        shell: bash

        run: |

          set -euo pipefail


          FLI_RASTER=\
          "data/outputs/fli_fars_${FWI_DATE}.tif"


          REPORT_FILE=\
          "data/report/firis_report.xlsx"


          python scripts/build_report.py \
            --input "${FLI_RASTER}" \
            --output "${REPORT_FILE}" \
            --run-date "${FWI_DATE}" \
            --protected "protected_areas.geojson" \
            --hunting "hunting_banned.geojson"


          if [ ! -f "${REPORT_FILE}" ]; then

            echo ""

            echo "ERROR:"
            echo "Excel report was not created."

            exit 1

          fi


          echo ""

          echo "✓ Excel report created:"
          echo "${REPORT_FILE}"


      # ========================================================
      # VERIFY WEB OUTPUTS
      # ========================================================

      - name: Verify web outputs
        shell: bash

        run: |

          set -euo pipefail


          required_files=(

            "data/web/fli_latest.json"

            "data/web/fli_latest_grid.json"

            "data/web/fli_latest.png"

            "data/web/fli_polygons.geojson"

            "data/report/firis_report.xlsx"

          )


          echo ""

          echo "============================================================"
          echo "VERIFYING OUTPUT FILES"
          echo "============================================================"


          for file in "${required_files[@]}"; do


            if [ ! -f "${file}" ]; then

              echo ""

              echo "ERROR:"
              echo "Missing output:"
              echo "${file}"

              exit 1

            fi


            echo "✓ ${file}"


          done


      # ========================================================
      # VERIFY DATE SYNCHRONIZATION
      # ========================================================

      - name: Verify forecast date
        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'

          import json
          import os


          expected = os.environ[
              "FWI_DATE"
          ]


          path = (
              "data/web/"
              "fli_latest.json"
          )


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(
                  file
              )


          actual = (

              metadata.get(
                  "forecast_date"
              )

              or

              metadata.get(
                  "target_date"
              )
          )


          print("")

          print("=" * 70)
          print("FORECAST DATE VALIDATION")
          print("=" * 70)

          print("")

          print(
              "Expected:",
              expected
          )

          print(
              "Actual:",
              actual
          )


          if actual != expected:

              raise SystemExit(
                  "ERROR: FLI date does not "
                  "match FWI date."
              )


          print("")

          print(
              "✓ FWI and FLI dates are synchronized."
          )

          PY


      # ========================================================
      # COMMIT OUTPUTS
      # ========================================================

      - name: Commit FIRIS outputs
        shell: bash

        run: |

          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/outputs \
            data/web \
            data/report


          if git diff --cached --quiet; then

            echo ""

            echo "No generated changes."

            exit 0

          fi


          git commit \
            -m \
            "chore(firis): update FLI web outputs [skip ci]"


      # ========================================================
      # PUSH
      # ========================================================

      - name: Push outputs
        shell: bash

        run: |

          set -euo pipefail


          git push origin HEAD:main


          echo ""

          echo "============================================================"
          echo "FIRIS BUILD COMPLETED"
          echo "============================================================"


          echo ""


          echo "Forecast date:"
          echo "${FWI_DATE}"


          echo ""


          echo "FLI:"
          echo \
            "data/outputs/fli_fars_${FWI_DATE}.tif"


          echo ""


          echo "Web:"
          echo "data/web/fli_latest.json"
          echo "data/web/fli_latest_grid.json"
          echo "data/web/fli_polygons.geojson"


          echo ""


          echo "✓ Done."
```
