name: Build FIRIS Fire Likelihood Index

on:

  # ============================================================
  # اجرای خودکار فقط بعد از موفقیت Update FIRIS FWI
  # ============================================================
  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed

  # ============================================================
  # اجرای دستی
  # ============================================================
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-firis
  cancel-in-progress: false

jobs:

  build-firis:

    # ============================================================
    # اجرای خودکار فقط اگر FWI موفق بوده باشد
    # اجرای دستی همیشه مجاز است
    # ============================================================
    if: >
      github.event_name == 'workflow_dispatch'
      ||
      (
        github.event_name == 'workflow_run'
        &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================
      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: 3. Install Required Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            numpy \
            pandas \
            rasterio \
            openpyxl \
            geopandas \
            shapely \
            requests \
            folium

      # ========================================================
      # 4. CALCULATE TODAY + TOMORROW IN IRAN
      # ========================================================
      - name: 4. Calculate FIRIS forecast date
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IRAN = ZoneInfo("Asia/Tehran")

          now_iran = datetime.now(IRAN)

          today = now_iran.date()

          tomorrow = today + timedelta(days=1)

          today_str = today.isoformat()

          tomorrow_str = tomorrow.isoformat()

          print("=" * 70)
          print("FIRIS FORECAST DATE")
          print("=" * 70)

          print(
              f"Current Iran datetime : "
              f"{now_iran.isoformat()}"
          )

          print(
              f"Today in Iran         : "
              f"{today_str}"
          )

          print(
              f"Forecast target       : "
              f"{tomorrow_str}"
          )

          print("=" * 70)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"TODAY_IRAN={today_str}\n"
              )

              env.write(
                  f"RUN_DATE={tomorrow_str}\n"
              )
          PY

      # ========================================================
      # 5. DEFINE EXACT INPUT PATHS
      # ========================================================
      - name: 5. Define FIRIS input paths
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------
          # FWI = exact forecast for tomorrow
          # ------------------------------------------------------
          FWI_PATH="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"

          FWI_METADATA="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.json"

          # ------------------------------------------------------
          # FUEL = coded raster
          # ------------------------------------------------------
          FUEL_PATH="data/raw/fuel/fars_fuel.tif"

          # ------------------------------------------------------
          # FUEL TABLE
          # ------------------------------------------------------
          EXCEL_PATH="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          DEM_PATH="data/raw/topography/dem_fars.tif"

          BOUNDARY_PATH="fars.geojson"

          OUTPUT_DIR="outputs"

          WEB_OUTPUT_DIR="data/web"

          ARCHIVE_DIR="data/web/archive"

          echo "FWI_PATH=${FWI_PATH}" >> "$GITHUB_ENV"

          echo "FWI_METADATA=${FWI_METADATA}" >> "$GITHUB_ENV"

          echo "FUEL_PATH=${FUEL_PATH}" >> "$GITHUB_ENV"

          echo "EXCEL_PATH=${EXCEL_PATH}" >> "$GITHUB_ENV"

          echo "DEM_PATH=${DEM_PATH}" >> "$GITHUB_ENV"

          echo "BOUNDARY_PATH=${BOUNDARY_PATH}" >> "$GITHUB_ENV"

          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> "$GITHUB_ENV"

          echo "WEB_OUTPUT_DIR=${WEB_OUTPUT_DIR}" >> "$GITHUB_ENV"

          echo "ARCHIVE_DIR=${ARCHIVE_DIR}" >> "$GITHUB_ENV"

          echo "======================================================================"
          echo "FIRIS INPUT PATHS"
          echo "======================================================================"

          echo "Today Iran : ${TODAY_IRAN}"
          echo "Run date   : ${RUN_DATE}"

          echo ""

          echo "FWI        : ${FWI_PATH}"
          echo "Metadata   : ${FWI_METADATA}"
          echo "Fuel       : ${FUEL_PATH}"
          echo "Fuel Excel : ${EXCEL_PATH}"
          echo "DEM        : ${DEM_PATH}"
          echo "Boundary   : ${BOUNDARY_PATH}"
          echo "Output     : ${OUTPUT_DIR}"
          echo "Web output : ${WEB_OUTPUT_DIR}"

      # ========================================================
      # 6. VERIFY EXACT TOMORROW FWI
      # ========================================================
      - name: 6. Verify exact tomorrow FWI
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================================"
          echo "VERIFYING EXACT TOMORROW FWI"
          echo "======================================================================"

          echo "Today Iran    : ${TODAY_IRAN}"

          echo "Required date : ${RUN_DATE}"

          echo ""

          if [ ! -f "${FWI_PATH}" ]; then

            echo "ERROR: Required tomorrow FWI does not exist."

            echo "Expected file:"
            echo "${FWI_PATH}"

            echo ""

            echo "FIRIS build is STOPPED."

            echo "No old FWI is allowed."

            exit 1

          fi

          if [ ! -f "${FWI_METADATA}" ]; then

            echo "ERROR: Required FWI metadata does not exist."

            echo "${FWI_METADATA}"

            exit 1

          fi

          if [ ! -s "${FWI_PATH}" ]; then

            echo "ERROR: FWI raster is empty."

            exit 1

          fi

          if [ ! -s "${FWI_METADATA}" ]; then

            echo "ERROR: FWI metadata is empty."

            exit 1

          fi

          echo "OK: Exact tomorrow FWI exists."

      # ========================================================
      # 7. VALIDATE FWI METADATA DATE
      # ========================================================
      - name: 7. Validate FWI metadata date
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["RUN_DATE"]

          path = os.environ["FWI_METADATA"]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              metadata = json.load(file)

          actual = (
              metadata.get("target_date")
              or
              metadata.get("forecast_date")
          )

          print("=" * 70)
          print("FWI DATE VALIDATION")
          print("=" * 70)

          print(
              f"Expected : {expected}"
          )

          print(
              f"Actual   : {actual}"
          )

          print("")

          if actual != expected:

              print(
                  "ERROR: FWI date does not match tomorrow."
              )

              print(
                  "ERROR: Old/wrong-date FWI is forbidden."
              )

              sys.exit(1)

          print(
              "OK: FWI date exactly matches forecast date."
          )
          PY

      # ========================================================
      # 8. VALIDATE FWI RASTER
      # ========================================================
      - name: 8. Validate FWI raster
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import rasterio

          path = os.environ["FWI_PATH"]

          print("=" * 70)
          print("FWI RASTER VALIDATION")
          print("=" * 70)

          with rasterio.open(path) as src:

              print(
                  f"CRS        : {src.crs}"
              )

              print(
                  f"Width      : {src.width}"
              )

              print(
                  f"Height     : {src.height}"
              )

              print(
                  f"Resolution : {src.res}"
              )

              print(
                  f"Bounds     : {src.bounds}"
              )

              if (
                  src.crs is None
                  or
                  src.crs.to_epsg() != 4326
              ):

                  raise SystemExit(
                      "ERROR: FWI must be EPSG:4326."
                  )

              data = src.read(
                  1,
                  masked=True
              )

              valid = int(
                  data.count()
              )

              print(
                  f"Valid pixels : {valid}"
              )

              if valid == 0:

                  raise SystemExit(
                      "ERROR: FWI contains no valid pixels."
                  )

              print(
                  f"Min          : {float(data.min())}"
              )

              print(
                  f"Max          : {float(data.max())}"
              )

              print(
                  f"Mean         : {float(data.mean())}"
              )

          print("")

          print(
              "OK: Tomorrow FWI raster is valid."
          )
          PY

      # ========================================================
      # 9. VERIFY STATIC INPUTS
      # ========================================================
      - name: 9. Verify FIRIS static inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================================"
          echo "VERIFYING FIRIS STATIC INPUTS"
          echo "======================================================================"

          for FILE in \
            "${FUEL_PATH}" \
            "${DEM_PATH}" \
            "${EXCEL_PATH}" \
            "${BOUNDARY_PATH}"
          do

            if [ ! -f "${FILE}" ]; then

              echo "ERROR: Required input not found:"
              echo "${FILE}"

              exit 1

            fi

            echo "OK: ${FILE}"

          done

      # ========================================================
      # 10. VALIDATE CODED FUEL RASTER
      # ========================================================
      - name: 10. Validate coded Fuel raster
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import math
          import os

          import numpy as np
          import pandas as pd
          import rasterio

          fuel_path = os.environ["FUEL_PATH"]

          excel_path = os.environ["EXCEL_PATH"]

          print("=" * 70)
          print("FUEL RASTER VALIDATION")
          print("=" * 70)

          print(
              f"Fuel raster : {fuel_path}"
          )

          print(
              f"Fuel Excel  : {excel_path}"
          )

          print("")

          # ----------------------------------------------------
          # Read coded Fuel raster
          # ----------------------------------------------------
          with rasterio.open(fuel_path) as src:

              print(
                  f"Fuel CRS        : {src.crs}"
              )

              print(
                  f"Fuel size       : "
                  f"{src.width} x {src.height}"
              )

              print(
                  f"Fuel resolution : {src.res}"
              )

              print(
                  f"Fuel bounds     : {src.bounds}"
              )

              values = src.read(
                  1,
                  masked=True
              )

              compressed = values.compressed()

              if compressed.size == 0:

                  raise SystemExit(
                      "ERROR: Fuel raster contains no valid pixels."
                  )

              unique_values = np.unique(
                  compressed
              )

          # ----------------------------------------------------
          # IMPORTANT:
          # Read the correct Fuelbeds_metric sheet.
          # ----------------------------------------------------
          df = pd.read_excel(
              excel_path,
              sheet_name="Fuelbeds_metric",
              engine="openpyxl"
          )

          print("")

          print(
              "Excel sheet : Fuelbeds_metric"
          )

          print(
              f"Excel rows  : {len(df)}"
          )

          print(
              f"Excel columns: {len(df.columns)}"
          )

          if "JOIN_VALUE" not in df.columns:

              raise SystemExit(
                  "ERROR: JOIN_VALUE column is missing "
                  "from Fuelbeds_metric."
              )

          # ----------------------------------------------------
          # Build Excel JOIN_VALUE set
          # ----------------------------------------------------
          excel_codes = set()

          for value in (
              df["JOIN_VALUE"]
              .dropna()
              .tolist()
          ):

              try:

                  numeric = float(value)

                  if math.isfinite(
                      numeric
                  ):

                      excel_codes.add(
                          numeric
                      )

              except (
                  TypeError,
                  ValueError
              ):

                  continue

          # ----------------------------------------------------
          # Build raster code set
          # ----------------------------------------------------
          raster_codes = set(
              float(value)
              for value in unique_values
          )

          mapped = sorted(
              raster_codes.intersection(
                  excel_codes
              )
          )

          unmapped = sorted(
              raster_codes.difference(
                  excel_codes
              )
          )

          print("")

          print(
              "FUEL CODE MATCHING"
          )

          print(
              "------------------"
          )

          print(
              f"Unique raster codes : "
              f"{len(raster_codes)}"
          )

          print(
              f"Mapped codes        : "
              f"{len(mapped)}"
          )

          print(
              f"Unmapped codes      : "
              f"{len(unmapped)}"
          )

          if mapped:

              print("")
              print("Mapped codes:")

              for code in mapped[:30]:

                  print(
                      f"  - {code}"
                  )

          if unmapped:

              print("")
              print(
                  "First unmapped codes:"
              )

              for code in unmapped[:30]:

                  print(
                      f"  - {code}"
                  )

              raise SystemExit(
                  "ERROR: Fuel raster contains codes "
                  "that are not present in JOIN_VALUE."
              )

          print("")

          print(
              "OK: Fuel raster codes match JOIN_VALUE."
          )
          PY

      # ========================================================
      # 11. BUILD FIRIS
      # ========================================================
      - name: 11. Build FIRIS Fire Likelihood Index
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================================"
          echo "STEP 2 - BUILD FIRIS"
          echo "======================================================================"

          echo "Today Iran : ${TODAY_IRAN}"

          echo "Forecast   : ${RUN_DATE}"

          echo ""

          echo "USING FWI:"

          echo "${FWI_PATH}"

          echo ""

          echo "USING FUEL:"

          echo "${FUEL_PATH}"

          echo ""

          echo "USING FUEL EXCEL:"

          echo "${EXCEL_PATH}"

          echo ""

          python scripts/build_firis.py \
            --fwi-raster "${FWI_PATH}" \
            --fuel-raster "${FUEL_PATH}" \
            --dem-raster "${DEM_PATH}" \
            --fuel-excel "${EXCEL_PATH}" \
            --output-dir "${OUTPUT_DIR}" \
            --run-date "${RUN_DATE}" \
            --boundary "${BOUNDARY_PATH}"

      # ========================================================
      # 12. VERIFY FLI OUTPUT
      # ========================================================
      - name: 12. Verify FLI output
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          FLI_INPUT="${OUTPUT_DIR}/fli_fars_${RUN_DATE}.tif"

          echo "======================================================================"
          echo "VERIFYING FLI OUTPUT"
          echo "======================================================================"

          echo "Expected FLI:"
          echo "${FLI_INPUT}"

          echo ""

          if [ ! -f "${FLI_INPUT}" ]; then

            echo "ERROR: FLI output was not created."

            echo "Expected file:"
            echo "${FLI_INPUT}"

            exit 1

          fi

          if [ ! -s "${FLI_INPUT}" ]; then

            echo "ERROR: FLI output is empty."

            exit 1

          fi

          echo "OK: FLI output exists."

      # ========================================================
      # 13. BUILD WEB MAP
      # ========================================================
      - name: 13. Build Web Map
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          FLI_INPUT="${OUTPUT_DIR}/fli_fars_${RUN_DATE}.tif"

          echo "======================================================================"
          echo "STEP 3 - BUILD WEB MAP"
          echo "======================================================================"

          echo "Input FLI:"
          echo "${FLI_INPUT}"

          echo ""

          echo "Web output:"
          echo "${WEB_OUTPUT_DIR}"

          echo ""

          if [ ! -f "${FLI_INPUT}" ]; then

            echo "ERROR: FLI input for Web Map does not exist."

            echo "${FLI_INPUT}"

            exit 1

          fi

          mkdir -p "${WEB_OUTPUT_DIR}"

          mkdir -p "${ARCHIVE_DIR}"

          python scripts/build_web_map.py \
            --input "${FLI_INPUT}" \
            --output-dir "${WEB_OUTPUT_DIR}" \
            --archive-dir "${ARCHIVE_DIR}"

          echo ""

          echo "OK: Web map products created."

      # ========================================================
      # 14. VERIFY WEB OUTPUT
      # ========================================================
      - name: 14. Verify Web outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================================"
          echo "VERIFYING WEB OUTPUT"
          echo "======================================================================"

          REQUIRED_FILES=(
            "${WEB_OUTPUT_DIR}/fli_latest.json"
            "${WEB_OUTPUT_DIR}/fli_latest_grid.json"
            "${WEB_OUTPUT_DIR}/fli_polygons.geojson"
            "${WEB_OUTPUT_DIR}/archive/${RUN_DATE}/fli.json"
            "${WEB_OUTPUT_DIR}/archive/${RUN_DATE}/fli_grid.json"
            "${WEB_OUTPUT_DIR}/archive/${RUN_DATE}/fli_polygons.geojson"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "${FILE}" ]; then

              echo "ERROR: Required Web output is missing:"
              echo "${FILE}"

              exit 1

            fi

            echo "OK: ${FILE}"

          done

          echo ""

          echo "All required Web outputs exist."

      # ========================================================
      # 15. VERIFY FORECAST DATE IN LATEST JSON
      # ========================================================
      - name: 15. Verify Web forecast date
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["RUN_DATE"]

          path = "data/web/fli_latest.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)

          actual = (
              data.get("forecast_date")
              or
              data.get("target_date")
          )

          print("=" * 70)
          print("WEB FORECAST DATE VALIDATION")
          print("=" * 70)

          print(
              f"Expected : {expected}"
          )

          print(
              f"Actual   : {actual}"
          )

          print("")

          if str(actual) != expected:

              print(
                  "ERROR: Web forecast date is incorrect."
              )

              sys.exit(1)

          print(
              "OK: Web forecast date is correct."
          )
          PY

      # ========================================================
      # 16. COMMIT + PUSH
      # ========================================================
      - name: 16. Commit and Push FIRIS outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            outputs/ \
            data/web/

          if git diff --cached --quiet; then

            echo "No FIRIS output changes to commit."

            exit 0

          fi

          git commit \
            -m "Update FIRIS forecast ${RUN_DATE}"

          git pull --rebase origin main

          git push origin HEAD:main

          echo ""

          echo "======================================================================"
          echo "FIRIS BUILD COMPLETED"
          echo "======================================================================"

          echo "Today Iran : ${TODAY_IRAN}"

          echo "Forecast   : ${RUN_DATE}"

          echo "======================================================================"
