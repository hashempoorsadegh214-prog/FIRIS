
name: Build FIRIS

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - "protected_areas.geojson"
      - "hunting_banned.geojson"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build
  cancel-in-progress: true

jobs:

  build-firis:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            geopandas \
            matplotlib

      # ============================================================
      # CALCULATE TOMORROW DATE IN IRAN
      # ============================================================

      - name: Calculate tomorrow date
        id: dates
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CALCULATING TOMORROW DATE"
          echo "============================================================"

          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          iran = ZoneInfo("Asia/Tehran")

          now_iran = datetime.now(iran)
          tomorrow = now_iran.date() + timedelta(days=1)

          today = now_iran.date().isoformat()
          tomorrow_date = tomorrow.isoformat()

          print("")
          print("Iran current datetime:")
          print(now_iran.isoformat())

          print("")
          print("Today in Iran:")
          print(today)

          print("")
          print("Tomorrow in Iran:")
          print(tomorrow_date)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(f"today={today}\n")
              out.write(f"tomorrow={tomorrow_date}\n")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"TODAY_IRAN={today}\n")
              env.write(f"TOMORROW_DATE={tomorrow_date}\n")

          PY

      # ============================================================
      # FIND ONLY TOMORROW FWI
      # ============================================================

      - name: Find tomorrow FWI
        id: find_fwi
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SEARCHING FOR TOMORROW FWI ONLY"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Required forecast date:"
          echo "${TOMORROW_DATE}"

          FWI_JSON="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.json"
          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.tif"

          echo ""
          echo "Required FWI metadata:"
          echo "${FWI_JSON}"

          echo ""
          echo "Required FWI raster:"
          echo "${FWI_RASTER}"

          # --------------------------------------------------------
          # IMPORTANT:
          # DO NOT FALL BACK TO AN OLDER FWI.
          # FIRIS MUST ALWAYS USE TOMORROW'S FORECAST.
          # --------------------------------------------------------

          if [ ! -f "${FWI_JSON}" ]; then
            echo ""
            echo "ERROR: Tomorrow FWI metadata was not found."
            echo ""
            echo "Expected:"
            echo "${FWI_JSON}"
            echo ""
            echo "FIRIS build stopped."
            echo "No older FWI will be used as a fallback."
            exit 1
          fi

          if [ ! -f "${FWI_RASTER}" ]; then
            echo ""
            echo "ERROR: Tomorrow FWI raster was not found."
            echo ""
            echo "Expected:"
            echo "${FWI_RASTER}"
            echo ""
            echo "FIRIS build stopped."
            echo "No older FWI will be used as a fallback."
            exit 1
          fi

          echo ""
          echo "✓ Tomorrow FWI files found."

          echo ""
          echo "Validating metadata date..."

          python - <<PY
          import json

          path = "${FWI_JSON}"
          expected = "${TOMORROW_DATE}"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              meta = json.load(f)

          target = (
              meta.get("target_date")
              or meta.get("forecast_date")
          )

          print("")
          print("Expected forecast date:")
          print(expected)

          print("")
          print("Metadata forecast date:")
          print(target)

          if target != expected:
              raise SystemExit(
                  "ERROR: FWI metadata date does not match "
                  "tomorrow's Iran date."
              )

          print("")
          print("✓ FWI metadata date is correct.")

          PY

          echo ""
          echo "Tomorrow FWI selected successfully."

          echo ""
          echo "Date:"
          echo "${TOMORROW_DATE}"

          echo ""
          echo "JSON:"
          echo "${FWI_JSON}"

          echo ""
          echo "Raster:"
          echo "${FWI_RASTER}"

          {
            echo "fwi_date=${TOMORROW_DATE}"
            echo "fwi_json=${FWI_JSON}"
            echo "fwi_raster=${FWI_RASTER}"
          } >> "${GITHUB_OUTPUT}"

      # ============================================================
      # VERIFY FWI DATE
      # ============================================================

      - name: Verify FWI date
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"
          FWI_JSON="${{ steps.find_fwi.outputs.fwi_json }}"
          FWI_RASTER="${{ steps.find_fwi.outputs.fwi_raster }}"

          echo "============================================================"
          echo "FWI DATE VERIFICATION"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Required forecast date:"
          echo "${TOMORROW_DATE}"

          echo ""
          echo "Selected FWI date:"
          echo "${FWI_DATE}"

          echo ""
          echo "FWI JSON:"
          echo "${FWI_JSON}"

          echo ""
          echo "FWI Raster:"
          echo "${FWI_RASTER}"

          test -f "${FWI_JSON}"
          test -f "${FWI_RASTER}"

          if [ "${FWI_DATE}" != "${TOMORROW_DATE}" ]; then
            echo ""
            echo "ERROR: Selected FWI is not tomorrow's forecast."
            exit 1
          fi

          echo ""
          echo "✓ FWI date verified."
          echo "✓ FIRIS will use tomorrow's forecast only."

      # ============================================================
      # BUILD FIRIS
      # ============================================================

      - name: Build FIRIS
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"
          FWI_RASTER="${{ steps.find_fwi.outputs.fwi_raster }}"

          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"
          DEM_RASTER="data/raw/topography/dem_fars.tif"
          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          echo "============================================================"
          echo "BUILDING FIRIS"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Forecast target:"
          echo "${FWI_DATE}"

          echo ""
          echo "FWI raster:"
          echo "${FWI_RASTER}"

          echo ""
          echo "Fuel raster:"
          echo "${FUEL_RASTER}"

          echo ""
          echo "DEM raster:"
          echo "${DEM_RASTER}"

          echo ""
          echo "Fuel Excel:"
          echo "${FUEL_EXCEL}"

          # --------------------------------------------------------
          # REQUIRED INPUTS
          # --------------------------------------------------------

          test -f "${FWI_RASTER}"
          test -f "${FUEL_RASTER}"
          test -f "${DEM_RASTER}"
          test -f "${FUEL_EXCEL}"
          test -f "fars.geojson"

          # --------------------------------------------------------
          # BUILD FLI
          # --------------------------------------------------------

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "${FWI_DATE}"

      # ============================================================
      # VERIFY FLI
      # ============================================================

      - name: Verify FLI output
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          echo "============================================================"
          echo "VERIFYING FLI"
          echo "============================================================"

          echo ""
          echo "Expected forecast date:"
          echo "${FWI_DATE}"

          echo ""
          echo "Expected FLI:"
          echo "${FLI_RASTER}"

          if [ ! -f "${FLI_RASTER}" ]; then
            echo ""
            echo "ERROR: FLI raster was not generated."
            exit 1
          fi

          echo ""
          echo "✓ FLI raster exists."

      # ============================================================
      # BUILD WEB MAP
      # ============================================================

      - name: Build web map
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          echo "============================================================"
          echo "BUILDING WEB MAP"
          echo "============================================================"

          echo ""
          echo "Forecast target:"
          echo "${FWI_DATE}"

          echo ""
          echo "Input FLI:"
          echo "${FLI_RASTER}"

          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web" \
            --boundary "fars.geojson"

      # ============================================================
      # VERIFY WEB OUTPUT
      # ============================================================

      - name: Verify web outputs
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          echo "============================================================"
          echo "VERIFYING WEB OUTPUTS"
          echo "============================================================"

          REQUIRED_FILES=(
            "data/web/fli_latest.json"
            "data/web/fli_latest_grid.json"
            "data/web/fli_latest.png"
            "data/web/fli_polygons.geojson"
            "data/web/archive/${FWI_DATE}/fli.json"
            "data/web/archive/${FWI_DATE}/fli_grid.json"
            "data/web/archive/${FWI_DATE}/fli.png"
            "data/web/archive/${FWI_DATE}/fli_polygons.geojson"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "${file}" ]; then
              echo ""
              echo "ERROR: Missing:"
              echo "${file}"
              exit 1
            fi

            echo "✓ ${file}"

          done

          echo ""
          echo "Validating web forecast date..."

          python - <<PY
          import json

          path = "data/web/fli_latest.json"
          expected = "${FWI_DATE}"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          actual = (
              data.get("forecast_date")
              or data.get("target_date")
              or data.get("date")
          )

          print("")
          print("Expected forecast date:")
          print(expected)

          print("")
          print("Web latest date:")
          print(actual)

          if actual != expected:
              raise SystemExit(
                  "ERROR: Web map date does not match "
                  "tomorrow's forecast."
              )

          print("")
          print("✓ Web map date verified.")

          PY

      # ============================================================
      # CHECK GIT STATUS
      # ============================================================

      - name: Check generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          git status --short

      # ============================================================
      # COMMIT FIRIS OUTPUTS
      # ============================================================

      - name: Commit FIRIS outputs
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          echo "============================================================"
          echo "COMMITTING FIRIS OUTPUTS"
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/outputs \
            data/web \
            data/report

          if git diff --cached --quiet; then
            echo ""
            echo "No generated changes."
            exit 0
          fi

          git commit \
            -m "Update FIRIS outputs for ${FWI_DATE}"

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SYNCING WITH REMOTE MAIN"
          echo "============================================================"

          git fetch origin main

          echo ""
          echo "Merging latest main..."

          # Keep the outputs generated by this build
          # when generated FIRIS files conflict.
          git merge origin/main \
            -X ours \
            --no-edit \
            || {
              echo ""
              echo "ERROR: Git merge failed."
              git status
              exit 1
            }

          echo ""
          echo "Merge completed."

          echo ""
          echo "Pushing FIRIS outputs..."

          git push origin HEAD:main

          echo ""
          echo "============================================================"
          echo "FIRIS BUILD COMPLETED"
          echo "============================================================"

          echo ""
          echo "Today in Iran:"
          echo "${TODAY_IRAN}"

          echo ""
          echo "Tomorrow forecast:"
          echo "${{ steps.find_fwi.outputs.fwi_date }}"

          echo ""
          echo "FLI:"
          echo \
            "data/outputs/fli_fars_${{ steps.find_fwi.outputs.fwi_date }}.tif"

          echo ""
          echo "Web:"
          echo "data/web/fli_latest.json"
          echo "data/web/fli_latest_grid.json"
          echo "data/web/fli_polygons.geojson"

          echo ""
          echo "✓ FIRIS built exclusively for tomorrow's forecast."
