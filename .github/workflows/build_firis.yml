name: Build FIRIS Fire Likelihood Index

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-firis
  cancel-in-progress: false

jobs:
  build-firis:
    name: Build FLI Raster and Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FWI_RASTER: data/raw/fwi/fwi_ecmwf_fars_2026-08-27.tif
      FUEL_RASTER: data/raw/fuel/fars_fuel.tif
      DEM_RASTER: data/raw/topography/dem_fars.tif
      FUEL_EXCEL: data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx

      OUTPUT_DIR: data/outputs

      FUEL_CODE_COLUMN: fuel_code
      FUEL_SCORE_COLUMN: fuel_score

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Validate input files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking FIRIS input files..."

          for file in \
            "$FWI_RASTER" \
            "$FUEL_RASTER" \
            "$DEM_RASTER" \
            "$FUEL_EXCEL"
          do
            if [ ! -f "$file" ]; then
              echo "::error::Input file not found: $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          mkdir -p "$OUTPUT_DIR"

      - name: Show fuel Excel sheets and columns
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          excel_path = os.environ["FUEL_EXCEL"]

          workbook = pd.ExcelFile(excel_path)

          print(f"Excel file: {excel_path}")
          print(f"Sheets: {workbook.sheet_names}")

          for sheet in workbook.sheet_names:
              df = pd.read_excel(excel_path, sheet_name=sheet, nrows=5)

              print("\n" + "=" * 70)
              print(f"Sheet: {sheet}")
              print("Columns:")
              print(df.columns.tolist())
              print("\nSample rows:")
              print(df.to_string(index=False))
          PY

      - name: Set run date
        id: run_date
        shell: bash
        run: |
          echo "value=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build FIRIS FLI
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_firis.py \
            --fwi-raster "$FWI_RASTER" \
            --fuel-raster "$FUEL_RASTER" \
            --dem-raster "$DEM_RASTER" \
            --fuel-excel "$FUEL_EXCEL" \
            --fuel-code-column "$FUEL_CODE_COLUMN" \
            --fuel-score-column "$FUEL_SCORE_COLUMN" \
            --output-dir "$OUTPUT_DIR" \
            --run-date "${{ steps.run_date.outputs.value }}"

      - name: Verify output files
        shell: bash
        run: |
          set -euo pipefail

          TIF_FILE="$OUTPUT_DIR/fli_fars_${{ steps.run_date.outputs.value }}.tif"
          JSON_FILE="$OUTPUT_DIR/firis_report_${{ steps.run_date.outputs.value }}.json"

          echo "Generated files:"
          find "$OUTPUT_DIR" -maxdepth 1 -type f | sort

          test -f "$TIF_FILE"
          test -f "$JSON_FILE"

          echo ""
          echo "FIRIS report:"
          cat "$JSON_FILE"

      - name: Commit outputs to repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore(firis): update FLI ${{ steps.run_date.outputs.value }}"
          git push origin "HEAD:${{ github.ref_name }}"
