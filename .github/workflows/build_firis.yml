name: FIRIS Pipeline

on:
  schedule:
    - cron: '35 20 * * *' # اجرای خودکار شبانه (۰۰:۰۵ بامداد ایران)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas rasterio openpyxl geopandas shapely folium requests

      - name: Auto-resolve data files and date
        id: prepare_env
        run: |
          python -c '
          import os, glob, sys
          from datetime import datetime, timedelta
          import zoneinfo

          tehran = zoneinfo.ZoneInfo("Asia/Tehran")
          now = datetime.now(tehran)
          target_date = (now + timedelta(days=1)).strftime("%Y-%m-%d")

          def find_first(patterns):
              for pat in patterns:
                  matches = sorted(glob.glob(pat, recursive=True))
                  if matches:
                      return matches[0]
              return None

          def find_latest(patterns):
              for pat in patterns:
                  matches = sorted(glob.glob(pat, recursive=True))
                  if matches:
                      return matches[-1]
              return None

          # 1. جستجوی خودکار لایه FWI
          fwi_file = find_latest([
              f"data/*{target_date}*.tif",
              "data/*fwi*.tif",
              "**/*fwi*.tif",
              "data/*.tif"
          ])

          # 2. جستجوی خودکار لایه سوخت (Fuel)
          fuel_file = find_first([
              "data/*fuel*.tif",
              "**/*fuel*.tif",
              "data/fuel.tif"
          ])

          # 3. جستجوی خودکار لایه ارتفاعی (DEM)
          dem_file = find_first([
              "data/*dem*.tif",
              "**/*dem*.tif",
              "data/dem.tif"
          ])

          # 4. جستجوی خودکار جدول اکسل سوخت
          excel_file = find_first([
              "data/*.xlsx",
              "data/*.xls",
              "**/*.xlsx",
              "**/*.xls"
          ])

          # 5. جستجوی مرز منطقه (GeoJSON / Shapefile)
          boundary_file = find_first([
              "data/*fars*.geojson",
              "**/*fars*.geojson",
              "data/*.geojson",
              "**/*.geojson"
          ])

          print(f"Target Date: {target_date}")
          print(f"FWI File: {fwi_file}")
          print(f"Fuel File: {fuel_file}")
          print(f"DEM File: {dem_file}")
          print(f"Excel File: {excel_file}")
          print(f"Boundary File: {boundary_file}")

          if not fwi_file:
              # در صورتی که فایلی پیدا نشود لیست فایل‌های موجود جهت بررسی چاپ می‌شود
              print("Existing tif files:", glob.glob("**/*.tif", recursive=True))
              raise FileNotFoundError("هیچ فایل تیف مربوط به FWI در مخزن یافت نشد.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TARGET_DATE={target_date}\n")
              f.write(f"FWI_FILE={fwi_file}\n")
              f.write(f"FUEL_FILE={fuel_file or ''}\n")
              f.write(f"DEM_FILE={dem_file or ''}\n")
              f.write(f"EXCEL_FILE={excel_file or ''}\n")
              f.write(f"BOUNDARY_FILE={boundary_file or ''}\n")
          '

      - name: Run FIRIS Model
        run: |
          mkdir -p outputs
          
          CMD="python scripts/build_firis.py --fwi-raster \"$FWI_FILE\" --output-dir \"outputs\" --run-date \"$TARGET_DATE\""
          
          if [ -n "$FUEL_FILE" ]; then
            CMD="$CMD --fuel-raster \"$FUEL_FILE\""
          fi
          if [ -n "$DEM_FILE" ]; then
            CMD="$CMD --dem-raster \"$DEM_FILE\""
          fi
          if [ -n "$EXCEL_FILE" ]; then
            CMD="$CMD --fuel-excel \"$EXCEL_FILE\""
          fi
          if [ -n "$BOUNDARY_FILE" ]; then
            CMD="$CMD --boundary \"$BOUNDARY_FILE\""
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --staged --quiet; then
            echo "تغییر جدیدی برای ارسال وجود ندارد."
          else
            git commit -m "Auto-update FIRIS outputs for ${TARGET_DATE}"
            git push
          fi
