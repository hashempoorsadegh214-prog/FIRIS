name: Build FIRIS

on:
  schedule:
    # اجرا هر روز ساعت 00:45 بامداد به وقت ایران (21:15 UTC)
    - cron: '15 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas rasterio geopandas openpyxl matplotlib folium requests

      - name: Run Build FIRIS
        run: |
          python scripts/build_firis.py

      - name: Run Build Report
        run: |
          python scripts/build_report.py

      - name: Run Build Web Map
        run: |
          python scripts/build_web_map.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update FIRIS products [skip ci]"
          git push
