name: Build FIRIS Fire Likelihood Index

on:
  schedule:
    # ساعت ۲۱:۱۵ UTC (معادل ۰۰:۴۵ به وقت ایران - ۴۰ دقیقه پس از دریافت داده‌های FWI)
    - cron: "15 21 * * *"
  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-firis
  cancel-in-progress: false

jobs:
  build-firis:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio openpyxl shapely pyproj fiona requests Pillow affine

      - name: Determine Iran dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          iran = ZoneInfo("Asia/Tehran")
          now_iran = datetime.now(iran)
          today = now_iran.date()
          tomorrow = today + timedelta(days=1)

          today_str = today.isoformat()
          tomorrow_str = tomorrow.isoformat()

          print(f"Current Iran datetime: {now_iran.isoformat()}")
          print(f"Today in Iran: {today_str}")
          print(f"Tomorrow in Iran: {tomorrow_str}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TODAY_IRAN={today_str}\n")
              env.write(f"TOMORROW_DATE={tomorrow_str}\n")
          PY

      - name: Download Tomorrow FWI (Fallback)
        run: |
          python scripts/update_fwi.py --boundary "fars.geojson" --overwrite || true

      - name: Locate and Validate Tomorrow FWI
        shell: bash
        run: |
          FWI_JSON="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.json"
          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.tif"
          
          if [ ! -f "${FWI_RASTER}" ]; then
            echo "ERROR: Tomorrow FWI raster not found: ${FWI_RASTER}"
            exit 1
          fi
          echo "FWI Raster validated."

      - name: Build FIRIS FLI
        run: |
          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.tif"
          mkdir -p data/outputs data/report data/web
          python scripts/build_firis.py --fwi-raster "${FWI_RASTER}" --fuel-raster "data/raw/fuel/fars_fuel.tif" --dem-raster "data/raw/topography/dem_fars.tif" --fuel-excel "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx" --boundary "fars.geojson" --output-dir "data/outputs" --run-date "${TOMORROW_DATE}"

      - name: Build Excel Report and Web Map
        run: |
          FLI_RASTER="data/outputs/fli_fars_${TOMORROW_DATE}.tif"
          REPORT_FILE="data/report/firis_report.xlsx"
          ARCHIVE_DIR="data/web/archive/${TOMORROW_DATE}"
          mkdir -p "${ARCHIVE_DIR}"
          
          python scripts/build_report.py --input "${FLI_RASTER}" --output "${REPORT_FILE}" --run-date "${TOMORROW_DATE}" --protected "protected_areas.geojson" --hunting "hunting_banned.geojson"
          cp -f "${REPORT_FILE}" "${ARCHIVE_DIR}/firis_report.xlsx"
          
          if [ -f "scripts/build_web_map.py" ]; then
            python scripts/build_web_map.py || true
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update FLI and report for ${TOMORROW_DATE} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
