name: Build FIRIS Fire Risk Index

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/build_firis.py"
      - "requirements.txt"
      - "data/raw/fwi/**"
      - "data/raw/fuel/**"
      - "data/raw/topography/**"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

# جلوگیری از اجرای هم‌زمان چند Workflow مربوط به FIRIS
concurrency:
  group: firis-build-publish-main
  cancel-in-progress: false

jobs:
  build-firis:
    runs-on: ubuntu-latest

    env:
      FIRIS_DATE: "2026-08-27"

      FWI_RASTER: "data/raw/fwi/fwi_ecmwf_fars_2026-08-27.tif"
      FUEL_RASTER: "data/raw/fuel/fars_fuel.tif"
      DEM_RASTER: "data/raw/topography/dem_fars.tif"
      FUEL_EXCEL: "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

      FUEL_CODE_COLUMN: "JOIN_VALUE"
      FUEL_SCORE_COLUMN: "AUTO"

      OUTPUT_DIR: "data/outputs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # برای fetch، rebase و push لازم است.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check input files
        run: |
          set -e

          echo "Checking input files..."

          test -f "$FWI_RASTER"
          test -f "$FUEL_RASTER"
          test -f "$DEM_RASTER"
          test -f "$FUEL_EXCEL"

          echo "All input files exist."

      - name: Create output directory
        run: |
          mkdir -p "$OUTPUT_DIR"

      - name: Build FIRIS
        run: |
          set -e

          python scripts/build_firis.py \
            --fwi-raster "$FWI_RASTER" \
            --fuel-raster "$FUEL_RASTER" \
            --dem-raster "$DEM_RASTER" \
            --fuel-excel "$FUEL_EXCEL" \
            --fuel-code-column "$FUEL_CODE_COLUMN" \
            --fuel-score-column "$FUEL_SCORE_COLUMN" \
            --output-dir "$OUTPUT_DIR" \
            --run-date "$FIRIS_DATE"

      - name: Show generated outputs
        run: |
          set -e
          echo "Files in output directory:"
          ls -lah "$OUTPUT_DIR"

      - name: Commit and push generated outputs safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # فقط فایل‌های خروجی تولیدشده وارد Commit شوند
          git add data/outputs/

          # اگر خروجی نسبت به Git تغییری نکرده، کار تمام است.
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore(firis): update FLI ${FIRIS_DATE} [skip ci]"

          # اگر هم‌زمان Commit دیگری روی main ایجاد شد،
          # این بخش تا 5 بار fetch + rebase + push را تکرار می‌کند.
          for attempt in 1 2 3 4 5; do
            echo "----------------------------------------"
            echo "Push attempt: ${attempt}/5"

            # دریافت آخرین وضعیت main از GitHub
            git fetch origin main

            # قرار دادن Commit خروجی روی آخرین Commit شاخه main
            git rebase origin/main

            # ارسال Commit به GitHub
            if git push origin HEAD:main; then
              echo "FIRIS outputs pushed successfully."
              exit 0
            fi

            echo "Push rejected: main changed during workflow execution."
            echo "Waiting before next attempt..."
            sleep $((attempt * 5))
          done

          echo "ERROR: Push failed after 5 attempts."
          exit 1
