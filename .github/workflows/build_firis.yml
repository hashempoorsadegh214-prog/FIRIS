name: Build FIRIS Fire Risk Map

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "Global_fuelbeds_parameters_v1.2.xlsx"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build-main
  cancel-in-progress: false

jobs:
  build-firis:
    name: Build FIRIS outputs and web map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          # کتابخانه‌های لازم برای پردازش GeoTIFF و تولید PNG
          pip install numpy pandas rasterio openpyxl pillow

      - name: Show available input files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Available input raster files:"
          echo "============================================================"
          find data/raw -type f \( -iname "*.tif" -o -iname "*.tiff" \) | sort || true

          echo ""
          echo "============================================================"
          echo "Available Excel files:"
          echo "============================================================"
          find . -type f \( -iname "*.xlsx" -o -iname "*.xls" \) | sort || true

      - name: Locate FIRIS input files
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIR="data/raw"

          find_single_raster() {
            local label="$1"
            local pattern="$2"

            mapfile -t matches < <(
              find "${SEARCH_DIR}" -type f \
                \( -iname "*.tif" -o -iname "*.tiff" \) \
                -iname "${pattern}" | sort
            )

            if [ "${#matches[@]}" -eq 0 ]; then
              echo "ERROR: هیچ فایل رستری برای ${label} پیدا نشد."
              echo "Pattern searched: ${pattern}"
              exit 1
            fi

            if [ "${#matches[@]}" -gt 1 ]; then
              echo "ERROR: بیش از یک فایل برای ${label} پیدا شد:"
              printf ' - %s\n' "${matches[@]}"
              echo "نام فایل‌ها را یکتا کنید یا الگوی جستجو را دقیق‌تر کنید."
              exit 1
            fi

            echo "${matches[0]}"
          }

          FWI_RASTER="$(find_single_raster "FWI raster" "*fwi*.tif")"
          FUEL_RASTER="$(find_single_raster "Fuel raster" "*fuel*.tif")"
          DEM_RASTER="$(find_single_raster "DEM raster" "*dem*.tif")"

          FUEL_EXCEL="Global_fuelbeds_parameters_v1.2.xlsx"

          if [ ! -f "${FUEL_EXCEL}" ]; then
            echo "ERROR: فایل اکسل سوخت پیدا نشد:"
            echo "${FUEL_EXCEL}"
            exit 1
          fi

          echo "Selected FIRIS inputs:"
          echo "FWI raster : ${FWI_RASTER}"
          echo "Fuel raster: ${FUEL_RASTER}"
          echo "DEM raster : ${DEM_RASTER}"
          echo "Fuel Excel : ${FUEL_EXCEL}"

          echo "FWI_RASTER=${FWI_RASTER}" >> "$GITHUB_ENV"
          echo "FUEL_RASTER=${FUEL_RASTER}" >> "$GITHUB_ENV"
          echo "DEM_RASTER=${DEM_RASTER}" >> "$GITHUB_ENV"
          echo "FUEL_EXCEL=${FUEL_EXCEL}" >> "$GITHUB_ENV"

      - name: Build FIRIS FLI GeoTIFF and report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/outputs

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --output-dir "data/outputs" \
            --run-date "${RUN_DATE}"

      - name: Build web PNG overlay and metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/web

          python scripts/build_web_map.py \
            --input "data/outputs/fli_fars_$(date -u +'%Y-%m-%d').tif" \
            --output-dir "data/web"

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FIRIS outputs:"
          echo "============================================================"
          find data/outputs -maxdepth 1 -type f -printf "%f %k KB\n" | sort

          echo ""
          echo "============================================================"
          echo "Web-map outputs:"
          echo "============================================================"
          find data/web -maxdepth 1 -type f -printf "%f %k KB\n" | sort

          echo ""
          echo "Latest web metadata:"
          cat data/web/fli_latest.json

      - name: Commit and push generated outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outputs/ data/web/

          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
            exit 0
          fi

          git commit -m "chore(firis): update FLI and web-map outputs [skip ci]"
          git push origin HEAD:main
