name: Build FIRIS

on:

  workflow_dispatch:

  push:
    paths:

      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - "protected_areas.geojson"
      - "hunting_banned.geojson"
      - "index.html"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write


jobs:

  build-firis:

    runs-on: ubuntu-latest


    steps:


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            pillow


      # ============================================================
      # RUN DATE
      # ============================================================

      - name: Set run date

        shell: bash

        run: |

          set -euo pipefail

          RUN_DATE="$(date -u +%Y-%m-%d)"

          echo "RUN_DATE=${RUN_DATE}" \
            >> "${GITHUB_ENV}"

          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"

          echo "Run date: ${RUN_DATE}"


      # ============================================================
      # INPUT FILES
      # ============================================================

      - name: Locate input files

        shell: bash

        run: |

          set -euo pipefail

          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif"

          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"

          DEM_RASTER="data/raw/topography/dem_fars.tif"

          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"


          echo "============================================================"
          echo "INPUT FILES"
          echo "============================================================"

          echo "FWI_RASTER  = ${FWI_RASTER}"
          echo "FUEL_RASTER = ${FUEL_RASTER}"
          echo "DEM_RASTER  = ${DEM_RASTER}"
          echo "FUEL_EXCEL  = ${FUEL_EXCEL}"

          echo "BOUNDARY    = fars.geojson"
          echo "PROTECTED   = protected_areas.geojson"
          echo "HUNTING     = hunting_banned.geojson"


          test -f "${FWI_RASTER}" \
            || {
              echo "ERROR: FWI raster not found."
              exit 1
            }


          test -f "${FUEL_RASTER}" \
            || {
              echo "ERROR: Fuel raster not found."
              exit 1
            }


          test -f "${DEM_RASTER}" \
            || {
              echo "ERROR: DEM raster not found."
              exit 1
            }


          test -f "${FUEL_EXCEL}" \
            || {
              echo "ERROR: Fuel Excel not found."
              exit 1
            }


          test -f "fars.geojson" \
            || {
              echo "ERROR: Fars boundary not found."
              exit 1
            }


          test -f "protected_areas.geojson" \
            || {
              echo "ERROR: Protected areas not found."
              exit 1
            }


          test -f "hunting_banned.geojson" \
            || {
              echo "ERROR: Hunting banned areas not found."
              exit 1
            }


          echo ""
          echo "All input files found."


      # ============================================================
      # RUN FIRIS
      # ============================================================

      - name: Run FIRIS

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"


          python scripts/build_firis.py \
            --fwi-raster \
              "data/raw/fwi/fwi_ecmwf_fars_${RUN_DATE}.tif" \
            --fuel-raster \
              "data/raw/fuel/fars_fuel.tif" \
            --dem-raster \
              "data/raw/topography/dem_fars.tif" \
            --fuel-excel \
              "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx" \
            --boundary \
              "fars.geojson" \
            --output-dir \
              "data/outputs" \
            --run-date \
              "${RUN_DATE}"


      # ============================================================
      # BUILD WEB MAP
      # ============================================================

      - name: Build web map

        shell: bash

        run: |

          set -euo pipefail

          FLI_RASTER="data/outputs/fli_fars_${RUN_DATE}.tif"


          if [ ! -f "${FLI_RASTER}" ]; then

            echo ""
            echo "ERROR: FLI output not found:"
            echo "${FLI_RASTER}"

            exit 1

          fi


          mkdir -p data/web


          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web"


      # ============================================================
      # BUILD EXCEL REPORT
      # ============================================================

      - name: Build Excel report

        shell: bash

        run: |

          set -euo pipefail


          FLI_RASTER="data/outputs/fli_fars_${RUN_DATE}.tif"

          REPORT_DIR="data/report"

          REPORT_FILE="${REPORT_DIR}/firis_report.xlsx"


          if [ ! -f "${FLI_RASTER}" ]; then

            echo "ERROR: FLI raster not found."

            exit 1

          fi


          mkdir -p "${REPORT_DIR}"


          python scripts/build_report.py \
            --input "${FLI_RASTER}" \
            --output "${REPORT_FILE}" \
            --run-date "${RUN_DATE}"


          if [ ! -f "${REPORT_FILE}" ]; then

            echo "ERROR: Excel report was not created."

            exit 1

          fi


          echo ""
          echo "Excel report created:"
          echo "${REPORT_FILE}"


      # ============================================================
      # VALIDATE WEB FILES
      # ============================================================

      - name: Validate web outputs

        shell: bash

        run: |

          set -euo pipefail


          test -f "data/web/fli_latest.png"

          test -f "data/web/fli_latest.json"

          test -f "data/web/fli_latest_grid.json"

          test -f "data/report/firis_report.xlsx"


          echo ""
          echo "============================================================"
          echo "WEB OUTPUT VALIDATION PASSED"
          echo "============================================================"


      # ============================================================
      # SHOW OUTPUTS
      # ============================================================

      - name: Check outputs

        shell: bash

        run: |

          set -euo pipefail


          echo ""
          echo "============================================================"
          echo "OUTPUT FILES"
          echo "============================================================"


          find data/outputs \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          echo ""
          echo "WEB FILES"


          find data/web \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


          echo ""
          echo "REPORT FILES"


          find data/report \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit outputs

        shell: bash

        run: |

          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/outputs \
            data/web \
            data/report


          if git diff --cached --quiet; then

            echo "No output changes to commit."

            exit 0

          fi


          git commit \
            -m "chore(firis): update FLI web map and report [skip ci]"


      # ============================================================
      # SAFE PUSH
      # ============================================================

      - name: Push outputs

        shell: bash

        run: |

          set -euo pipefail


          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
