```yaml
name: Build FIRIS

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed

  push:
    paths:
      - "scripts/**"
      - "data/raw/**"
      - "fars.geojson"
      - "protected_areas.geojson"
      - "hunting_banned.geojson"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build
  cancel-in-progress: true

jobs:

  build-firis:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            openpyxl \
            rasterio \
            shapely \
            pyproj \
            geopandas \
            matplotlib

      # ============================================================
      # FIND LATEST FWI
      # ============================================================

      - name: Find latest FWI
        id: find_fwi
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SEARCHING FOR LATEST FWI"
          echo "============================================================"

          python - <<'PY'
          import json
          import glob
          import os
          import re

          files = glob.glob(
              "data/raw/fwi/fwi_ecmwf_fars_*.json"
          )

          if not files:
              raise SystemExit(
                  "ERROR: No FWI metadata files found."
              )

          candidates = []

          for path in files:

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      meta = json.load(f)
              except Exception as e:
                  print(
                      f"Skipping invalid JSON: {path} ({e})"
                  )
                  continue

              date = (
                  meta.get("target_date")
                  or meta.get("forecast_date")
              )

              if not date:
                  m = re.search(
                      r"fwi_ecmwf_fars_(\d{4}-\d{2}-\d{2})\.json$",
                      path
                  )

                  if m:
                      date = m.group(1)

              if not date:
                  continue

              raster = (
                  f"data/raw/fwi/"
                  f"fwi_ecmwf_fars_{date}.tif"
              )

              if not os.path.exists(raster):
                  print(
                      f"Skipping {date}: raster not found."
                  )
                  continue

              candidates.append(
                  (date, path, raster)
              )

          if not candidates:
              raise SystemExit(
                  "ERROR: No valid FWI raster/metadata pair found."
              )

          candidates.sort(
              key=lambda x: x[0],
              reverse=True
          )

          date, meta_path, raster = candidates[0]

          print("")
          print("Latest FWI:")
          print(f"Date:   {date}")
          print(f"JSON:   {meta_path}")
          print(f"Raster: {raster}")
          print("")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:

              out.write(f"fwi_date={date}\n")
              out.write(f"fwi_json={meta_path}\n")
              out.write(f"fwi_raster={raster}\n")

          PY

      # ============================================================
      # VERIFY FWI DATE
      # ============================================================

      - name: Verify FWI date
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"
          FWI_JSON="${{ steps.find_fwi.outputs.fwi_json }}"
          FWI_RASTER="${{ steps.find_fwi.outputs.fwi_raster }}"

          echo "============================================================"
          echo "FWI DATE VERIFICATION"
          echo "============================================================"

          echo "FWI_DATE:"
          echo "${FWI_DATE}"

          echo ""

          echo "FWI JSON:"
          echo "${FWI_JSON}"

          echo ""

          echo "FWI Raster:"
          echo "${FWI_RASTER}"

          echo ""

          test -f "${FWI_JSON}"
          test -f "${FWI_RASTER}"

          python - <<PY
          import json

          path = "${FWI_JSON}"
          expected = "${FWI_DATE}"

          with open(path, "r", encoding="utf-8") as f:
              meta = json.load(f)

          target = (
              meta.get("target_date")
              or meta.get("forecast_date")
          )

          print("Metadata target date:", target)
          print("Expected date:", expected)

          if target != expected:
              raise SystemExit(
                  f"ERROR: FWI metadata date mismatch: "
                  f"{target} != {expected}"
              )

          print("")
          print("✓ FWI date verified.")
          PY

      # ============================================================
      # BUILD FIRIS
      # ============================================================

      - name: Build FIRIS
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"
          FWI_RASTER="${{ steps.find_fwi.outputs.fwi_raster }}"

          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"
          DEM_RASTER="data/raw/topography/dem_fars.tif"
          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"

          echo "============================================================"
          echo "BUILDING FIRIS"
          echo "============================================================"

          echo "Forecast date:"
          echo "${FWI_DATE}"

          echo ""

          echo "FWI raster:"
          echo "${FWI_RASTER}"

          echo ""

          echo "Fuel raster:"
          echo "${FUEL_RASTER}"

          echo ""

          echo "DEM raster:"
          echo "${DEM_RASTER}"

          echo ""

          echo "Fuel Excel:"
          echo "${FUEL_EXCEL}"

          echo ""

          test -f "${FWI_RASTER}"
          test -f "${FUEL_RASTER}"
          test -f "${DEM_RASTER}"
          test -f "${FUEL_EXCEL}"
          test -f "fars.geojson"

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "${FWI_DATE}"

      # ============================================================
      # VERIFY FLI
      # ============================================================

      - name: Verify FLI output
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          echo "============================================================"
          echo "VERIFYING FLI"
          echo "============================================================"

          echo "Expected FLI:"
          echo "${FLI_RASTER}"

          echo ""

          if [ ! -f "${FLI_RASTER}" ]; then
              echo "ERROR: FLI raster was not generated."
              exit 1
          fi

          echo "✓ FLI raster exists."

      # ============================================================
      # BUILD WEB MAP
      # ============================================================

      - name: Build web map
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          echo "============================================================"
          echo "BUILDING WEB MAP"
          echo "============================================================"

          python scripts/build_web_map.py \
            --input "${FLI_RASTER}" \
            --output-dir "data/web" \
            --boundary "fars.geojson"

      # ============================================================
      # VERIFY WEB OUTPUT
      # ============================================================

      - name: Verify web outputs
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          echo "============================================================"
          echo "VERIFYING WEB OUTPUTS"
          echo "============================================================"

          REQUIRED_FILES=(
            "data/web/fli_latest.json"
            "data/web/fli_latest_grid.json"
            "data/web/fli_latest.png"
            "data/web/fli_polygons.geojson"
            "data/web/archive/${FWI_DATE}/fli.json"
            "data/web/archive/${FWI_DATE}/fli_grid.json"
            "data/web/archive/${FWI_DATE}/fli.png"
            "data/web/archive/${FWI_DATE}/fli_polygons.geojson"
          )

          for file in "${REQUIRED_FILES[@]}"; do

              if [ ! -f "${file}" ]; then
                  echo "ERROR: Missing:"
                  echo "${file}"
                  exit 1
              fi

              echo "✓ ${file}"

          done

          echo ""

          python - <<PY
          import json

          path = "data/web/fli_latest.json"
          expected = "${FWI_DATE}"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          actual = (
              data.get("forecast_date")
              or data.get("target_date")
              or data.get("date")
          )

          print("Expected date:", expected)
          print("Web latest date:", actual)

          if actual != expected:
              raise SystemExit(
                  f"ERROR: Web map date mismatch: "
                  f"{actual} != {expected}"
              )

          print("")
          print("✓ Web map date verified.")
          PY

      # ============================================================
      # CHECK GIT STATUS
      # ============================================================

      - name: Check generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          git status --short

      # ============================================================
      # COMMIT FIRIS OUTPUTS
      # ============================================================

      - name: Commit FIRIS outputs
        shell: bash
        run: |
          set -euo pipefail

          FWI_DATE="${{ steps.find_fwi.outputs.fwi_date }}"

          echo "============================================================"
          echo "COMMITTING FIRIS OUTPUTS"
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/outputs \
            data/web \
            data/report

          if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
          fi

          git commit \
            -m "Update FIRIS outputs for ${FWI_DATE}"

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SYNCING WITH REMOTE MAIN"
          echo "============================================================"

          git fetch origin main

          echo ""
          echo "Rebasing generated FIRIS commit onto latest main..."

          git rebase origin/main

          echo ""
          echo "Pushing FIRIS outputs..."

          git push origin HEAD:main

          echo ""
          echo "============================================================"
          echo "FIRIS BUILD COMPLETED"
          echo "============================================================"

          echo ""

          echo "Forecast date:"
          echo "${{ steps.find_fwi.outputs.fwi_date }}"

          echo ""

          echo "FLI:"
          echo \
            "data/outputs/fli_fars_${{ steps.find_fwi.outputs.fwi_date }}.tif"

          echo ""

          echo "Web:"
          echo "data/web/fli_latest.json"
          echo "data/web/fli_latest_grid.json"
          echo "data/web/fli_polygons.geojson"

          echo ""

          echo "✓ Done."
```
