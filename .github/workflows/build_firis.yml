name: Build FIRIS Fire Likelihood Index

on:
  workflow_run:
    workflows:
      - "Update FIRIS FWI"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-firis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. دریافت مخزن
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. نصب Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. نصب وابستگی‌ها
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            rasterio \
            openpyxl \
            shapely \
            pyproj \
            fiona \
            requests

      # ============================================================
      # 4. تعیین تاریخ ایران
      # ============================================================
      - name: Determine Iran dates
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now_iran = datetime.now(ZoneInfo("Asia/Tehran"))

          today = now_iran.date()
          tomorrow = today + timedelta(days=1)

          print("Iran current datetime:", now_iran)
          print("TODAY_IRAN:", today)
          print("TOMORROW_DATE:", tomorrow)

          with open("date.env", "w", encoding="utf-8") as f:
              f.write(f"TODAY_IRAN={today}\n")
              f.write(f"TOMORROW_DATE={tomorrow}\n")
          PY

          cat date.env >> "$GITHUB_ENV"

      # ============================================================
      # 5. بررسی فایل FWI فردا
      # ============================================================
      - name: Locate tomorrow FWI
        shell: bash
        run: |
          FWI_JSON="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.json"
          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.tif"

          echo "Expected FWI JSON:"
          echo "$FWI_JSON"

          echo "Expected FWI raster:"
          echo "$FWI_RASTER"

          if [ ! -f "$FWI_JSON" ]; then
            echo "ERROR: Tomorrow FWI JSON not found."
            exit 1
          fi

          if [ ! -f "$FWI_RASTER" ]; then
            echo "ERROR: Tomorrow FWI raster not found."
            exit 1
          fi

          echo "FWI files found successfully."

      # ============================================================
      # 6. اعتبارسنجی تاریخ FWI
      # ============================================================
      - name: Validate tomorrow FWI
        shell: bash
        run: |
          export FWI_JSON="data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.json"

          python - <<'PY'
          import json
          import os
          import sys

          path = os.environ["FWI_JSON"]
          expected = os.environ["TOMORROW_DATE"]

          print("Reading:", path)
          print("Expected forecast date:", expected)

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = []

          def collect_dates(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      key = str(k).lower()

                      if isinstance(v, str):
                          if (
                              "date" in key
                              or "target" in key
                              or "forecast" in key
                              or "valid" in key
                          ):
                              candidates.append((k, v))

                      collect_dates(v)

                  return

              if isinstance(obj, list):
                  for item in obj:
                      collect_dates(item)

          collect_dates(data)

          print("Date-like metadata:")
          for k, v in candidates:
              print(f"  {k}: {v}")

          found = False

          for _, value in candidates:
              if expected in str(value):
                  found = True
                  break

          if not found:
              print(
                  "ERROR: Tomorrow date was not found in FWI metadata."
              )
              sys.exit(1)

          print("FWI date validation: OK")
          PY

      # ============================================================
      # 7. ساخت FLI
      # ============================================================
      - name: Build FIRIS FLI
        shell: bash
        run: |
          FWI_DATE="${TOMORROW_DATE}"

          FWI_RASTER="data/raw/fwi/fwi_ecmwf_fars_${FWI_DATE}.tif"
          FLI_RASTER="data/outputs/fli_fars_${FWI_DATE}.tif"

          mkdir -p data/outputs
          mkdir -p data/report

          echo "Building FIRIS for:"
          echo "$FWI_DATE"

          python scripts/build_firis.py \
            --fwi-raster "$FWI_RASTER" \
            --fuel-raster "data/raw/fuel/fars_fuel.tif" \
            --dem-raster "data/raw/topography/dem_fars.tif" \
            --fuel-excel "data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx" \
            --boundary "fars.geojson" \
            --output-dir "data/outputs" \
            --run-date "$FWI_DATE"

      # ============================================================
      # 8. بررسی FLI تولیدشده
      # ============================================================
      - name: Verify FLI output
        shell: bash
        run: |
          FLI_RASTER="data/outputs/fli_fars_${TOMORROW_DATE}.tif"

          echo "Expected FLI:"
          echo "$FLI_RASTER"

          if [ ! -f "$FLI_RASTER" ]; then
            echo "ERROR: Tomorrow FLI was not created."
            exit 1
          fi

          ls -lh "$FLI_RASTER"

          echo "FLI output validation: OK"

      # ============================================================
      # 9. تولید گزارش Excel
      # ============================================================
      - name: Build FIRIS Excel report
        shell: bash
        run: |
          FLI_RASTER="data/outputs/fli_fars_${TOMORROW_DATE}.tif"
          REPORT_FILE="data/report/firis_report.xlsx"

          echo "Building Excel report for:"
          echo "$TOMORROW_DATE"

          echo "Input FLI:"
          echo "$FLI_RASTER"

          echo "Output Excel:"
          echo "$REPORT_FILE"

          python scripts/build_report.py \
            --input "$FLI_RASTER" \
            --output "$REPORT_FILE" \
            --run-date "$TOMORROW_DATE" \
            --protected "protected_areas.geojson" \
            --hunting "hunting_banned.geojson"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "ERROR: Excel report was not created."
            exit 1
          fi

          ls -lh "$REPORT_FILE"

          echo "Excel report generated successfully."

      # ============================================================
      # 10. کنترل نهایی تاریخ Excel
      # ============================================================
      - name: Verify Excel report
        shell: bash
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import os
          import sys

          report = Path("data/report/firis_report.xlsx")
          expected = os.environ["TOMORROW_DATE"]

          if not report.exists():
              print("ERROR: Excel report does not exist.")
              sys.exit(1)

          wb = load_workbook(report, read_only=True, data_only=True)

          print("Excel sheets:")
          for sheet in wb.sheetnames:
              print(" -", sheet)

          if "خلاصه" not in wb.sheetnames:
              print("WARNING: Sheet 'خلاصه' not found.")
          else:
              ws = wb["خلاصه"]

              print("\nChecking summary sheet...")

              found_expected = False

              for row in ws.iter_rows():
                  for cell in row:
                      if cell.value is not None:
                          value = str(cell.value)

                          if expected in value:
                              found_expected = True
                              print(
                                  "Expected forecast date found:",
                                  value
                              )

              if not found_expected:
                  print(
                      "ERROR: Expected tomorrow date "
                      f"{expected} was not found in Excel."
                  )
                  sys.exit(1)

          wb.close()

          print("Excel date validation: OK")
          PY

      # ============================================================
      # 11. ساخت Web GIS
      # ============================================================
      - name: Build Web GIS map
        shell: bash
        run: |
          FLI_RASTER="data/outputs/fli_fars_${TOMORROW_DATE}.tif"

          python scripts/build_web_map.py \
            --input "$FLI_RASTER" \
            --output-dir "data/web"

      # ============================================================
      # 12. بررسی خروجی Web GIS
      # ============================================================
      - name: Verify Web GIS outputs
        shell: bash
        run: |
          echo "Checking Web GIS outputs..."

          test -f "data/web/fli_latest.json" || {
            echo "ERROR: fli_latest.json not found."
            exit 1
          }

          test -d "data/web/archive/${TOMORROW_DATE}" || {
            echo "ERROR: Tomorrow archive directory not found."
            exit 1
          }

          echo "Web GIS outputs:"
          find "data/web/archive/${TOMORROW_DATE}" -maxdepth 2 -type f -print

          echo "Web GIS validation: OK"

      # ============================================================
      # 13. بروزرسانی Archive Index
      # ============================================================
      - name: Update Archive Index
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archive_dir = Path("data/web/archive")
          index_file = archive_dir / "index.json"

          archive_dir.mkdir(parents=True, exist_ok=True)

          dates = sorted(
              [
                  p.name
                  for p in archive_dir.iterdir()
                  if p.is_dir()
                  and len(p.name) == 10
                  and p.name[4] == "-"
                  and p.name[7] == "-"
              ],
              reverse=True
          )

          data = {
              "dates": dates
          }

          with index_file.open("w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Archive index updated.")
          print("Dates:")
          for date in dates:
              print(" -", date)
          PY

      # ============================================================
      # 14. بررسی نهایی تاریخ کل زنجیره
      # ============================================================
      - name: Final date consistency check
        shell: bash
        run: |
          echo "=============================================="
          echo "FINAL FIRIS DATE CHECK"
          echo "=============================================="

          echo "TODAY_IRAN     = ${TODAY_IRAN}"
          echo "TOMORROW_DATE  = ${TOMORROW_DATE}"

          echo ""
          echo "FWI:"
          ls -lh "data/raw/fwi/fwi_ecmwf_fars_${TOMORROW_DATE}.tif"

          echo ""
          echo "FLI:"
          ls -lh "data/outputs/fli_fars_${TOMORROW_DATE}.tif"

          echo ""
          echo "Excel:"
          ls -lh "data/report/firis_report.xlsx"

          echo ""
          echo "Web latest:"
          ls -lh "data/web/fli_latest.json"

          echo ""
          echo "Web archive:"
          find "data/web/archive/${TOMORROW_DATE}" -maxdepth 2 -type f -print

          echo ""
          echo "=============================================="
          echo "ALL FIRIS OUTPUTS ARE FOR TOMORROW:"
          echo "${TOMORROW_DATE}"
          echo "=============================================="

      # ============================================================
      # 15. Commit و Push
      # ============================================================
      - name: Commit FIRIS outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/outputs \
            data/web \
            data/report

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update FIRIS forecast ${TOMORROW_DATE}"
          git push
