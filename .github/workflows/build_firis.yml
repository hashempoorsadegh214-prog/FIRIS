
name: Build FIRIS Fire Risk Map

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/raw/**"
      - ".github/workflows/build_firis.yml"

permissions:
  contents: write

concurrency:
  group: firis-build-main
  cancel-in-progress: false

jobs:

  build-firis:

    name: Build FIRIS FLI

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            rasterio \
            openpyxl \
            pillow


      # =====================================================
      # SHOW INPUT FILES
      # =====================================================

      - name: Show available input files

        shell: bash

        run: |

          set -euo pipefail

          echo "============================================================"
          echo "AVAILABLE RASTER INPUTS"
          echo "============================================================"

          find data/raw \
            -type f \
            \( -iname "*.tif" -o -iname "*.tiff" \) \
            | sort

          echo ""

          echo "============================================================"
          echo "AVAILABLE EXCEL INPUTS"
          echo "============================================================"

          find data/raw \
            -type f \
            \( -iname "*.xlsx" -o -iname "*.xls" \) \
            | sort


      # =====================================================
      # SELECT INPUTS
      # =====================================================

      - name: Locate FIRIS input files

        shell: bash

        run: |

          set -euo pipefail

          echo "============================================================"
          echo "SELECTING FIRIS INPUTS"
          echo "============================================================"


          # ---------------------------------------------------
          # FWI
          # ---------------------------------------------------

          mapfile -t FWI_FILES < <(
            find data/raw/fwi \
              -maxdepth 1 \
              -type f \
              \( -iname "*.tif" -o -iname "*.tiff" \) \
              -iname "*fwi*" \
              | sort
          )


          if [ "${#FWI_FILES[@]}" -eq 0 ]; then

            echo "ERROR: No FWI raster found."

            exit 1

          fi


          FWI_RASTER="${FWI_FILES[${#FWI_FILES[@]}-1]}"


          echo "Selected newest FWI:"
          echo "${FWI_RASTER}"


          # ---------------------------------------------------
          # FUEL
          # ---------------------------------------------------

          FUEL_RASTER="data/raw/fuel/fars_fuel.tif"


          if [ ! -f "${FUEL_RASTER}" ]; then

            echo "ERROR: Fuel raster not found:"
            echo "${FUEL_RASTER}"

            exit 1

          fi


          # ---------------------------------------------------
          # FUEL EXCEL
          # ---------------------------------------------------

          FUEL_EXCEL="data/raw/fuel/Global_fuelbeds_parameters_v1.2.xlsx"


          if [ ! -f "${FUEL_EXCEL}" ]; then

            echo "ERROR: Fuel Excel not found:"
            echo "${FUEL_EXCEL}"

            exit 1

          fi


          # ---------------------------------------------------
          # DEM
          # ---------------------------------------------------

          DEM_RASTER="data/raw/topography/dem_fars.tif"


          if [ ! -f "${DEM_RASTER}" ]; then

            echo "ERROR: DEM raster not found:"
            echo "${DEM_RASTER}"

            exit 1

          fi


          # ---------------------------------------------------
          # EXPORT VARIABLES
          # ---------------------------------------------------

          echo ""
          echo "============================================================"
          echo "FINAL INPUT SELECTION"
          echo "============================================================"

          echo "FWI  : ${FWI_RASTER}"
          echo "Fuel : ${FUEL_RASTER}"
          echo "Excel: ${FUEL_EXCEL}"
          echo "DEM  : ${DEM_RASTER}"


          echo "FWI_RASTER=${FWI_RASTER}" >> "${GITHUB_ENV}"
          echo "FUEL_RASTER=${FUEL_RASTER}" >> "${GITHUB_ENV}"
          echo "FUEL_EXCEL=${FUEL_EXCEL}" >> "${GITHUB_ENV}"
          echo "DEM_RASTER=${DEM_RASTER}" >> "${GITHUB_ENV}"


      # =====================================================
      # INSPECT INPUT RASTERS
      # =====================================================

      - name: Inspect input raster metadata

        shell: bash

        run: |

          set -euo pipefail

          python - <<'PY'

          import os
          import rasterio


          files = {
              "FWI": os.environ["FWI_RASTER"],
              "Fuel": os.environ["FUEL_RASTER"],
              "DEM": os.environ["DEM_RASTER"],
          }


          print("")
          print("=" * 70)
          print("INPUT RASTER METADATA")
          print("=" * 70)


          for name, path in files.items():

              print("")
              print(f"[{name}]")
              print(f"Path       : {path}")

              with rasterio.open(path) as src:

                  print(f"CRS        : {src.crs}")
                  print(f"Width      : {src.width}")
                  print(f"Height     : {src.height}")
                  print(f"Cell Size  : {src.res}")
                  print(f"Bounds     : {src.bounds}")
                  print(f"NoData     : {src.nodata}")
                  print(f"Data Type  : {src.dtypes[0]}")

          PY


      # =====================================================
      # BUILD FIRIS
      # =====================================================

      - name: Build FIRIS FLI

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p data/outputs

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          echo ""
          echo "============================================================"
          echo "RUNNING FIRIS"
          echo "============================================================"

          echo "Run date: ${RUN_DATE}"

          echo ""
          echo "FWI_RASTER  = ${FWI_RASTER}"
          echo "FUEL_RASTER = ${FUEL_RASTER}"
          echo "FUEL_EXCEL  = ${FUEL_EXCEL}"
          echo "DEM_RASTER  = ${DEM_RASTER}"

          python scripts/build_firis.py \
            --fwi-raster "${FWI_RASTER}" \
            --fuel-raster "${FUEL_RASTER}" \
            --dem-raster "${DEM_RASTER}" \
            --fuel-excel "${FUEL_EXCEL}" \
            --fuel-code-column "JOIN_VALUE" \
            --output-dir "data/outputs" \
            --run-date "${RUN_DATE}"


      # =====================================================
      # CHECK FIRIS OUTPUT
      # =====================================================

      - name: Check FIRIS output

        shell: bash

        run: |

          set -euo pipefail

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          FLI_OUTPUT="data/outputs/fli_fars_${RUN_DATE}.tif"

          REPORT_OUTPUT="data/outputs/firis_report_${RUN_DATE}.json"


          echo ""
          echo "============================================================"
          echo "CHECKING FIRIS OUTPUT"
          echo "============================================================"


          if [ ! -f "${FLI_OUTPUT}" ]; then

            echo "ERROR: FLI output was not created:"
            echo "${FLI_OUTPUT}"

            exit 1

          fi


          if [ ! -f "${REPORT_OUTPUT}" ]; then

            echo "ERROR: FIRIS report was not created:"
            echo "${REPORT_OUTPUT}"

            exit 1

          fi


          echo "FLI output:"
          echo "${FLI_OUTPUT}"

          echo ""

          echo "Report:"
          echo "${REPORT_OUTPUT}"


      # =====================================================
      # BUILD WEB MAP
      # =====================================================

      - name: Build web map

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p data/web

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          INPUT_FLI="data/outputs/fli_fars_${RUN_DATE}.tif"


          if [ ! -f "${INPUT_FLI}" ]; then

            echo "ERROR: FLI output not found:"
            echo "${INPUT_FLI}"

            exit 1

          fi


          python scripts/build_web_map.py \
            --input "${INPUT_FLI}" \
            --output-dir "data/web"


      # =====================================================
      # SHOW RESULTS
      # =====================================================

      - name: Show generated files

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "FIRIS OUTPUT FILES"
          echo "============================================================"

          find data/outputs \
            -maxdepth 1 \
            -type f \
            -printf "%f %k KB\n" \
            | sort


          echo ""
          echo "============================================================"
          echo "WEB OUTPUT FILES"
          echo "============================================================"

          find data/web \
            -maxdepth 1 \
            -type f \
            -printf "%f %k KB\n" \
            | sort


          echo ""
          echo "============================================================"
          echo "FIRIS REPORT"
          echo "============================================================"

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          REPORT="data/outputs/firis_report_${RUN_DATE}.json"


          if [ -f "${REPORT}" ]; then

            cat "${REPORT}"

          fi


      # =====================================================
      # COMMIT OUTPUTS
      # =====================================================

      - name: Commit and push generated outputs

        shell: bash

        run: |

          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/outputs/ \
            data/web/


          if git diff --cached --quiet; then

            echo "No generated-file changes."

            exit 0

          fi


          git commit \
            -m "chore(firis): update FLI outputs [skip ci]"


          git push origin HEAD:main
