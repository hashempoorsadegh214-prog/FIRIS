name: Inspect FIRIS Inputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Inspect raw inputs
        run: |
          python scripts/inspect_inputs.py
          python scripts/inspect_fuel_mapping.py

      - name: Commit inspection reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input_inventory.json data/fuel_mapping_inventory.json
          git diff --cached --quiet || git commit -m "chore: update FIRIS inspection reports"
          git push
