name: Inspect FIRIS Inputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب کتابخانه‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: بازرسی ورودی‌های خام
        run: python scripts/inspect_inputs.py

      - name: ذخیره گزارش بازرسی در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input_inventory.json
          git diff --cached --quiet || git commit -m "chore: update FIRIS input inventory"
          git push
